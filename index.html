  <style>
    :root {
      --bg: #0a0a0f;
      --bg-panel: #13131a;
      --bg-panel-2: #181823;
      --text: #e2e8f0;
      --muted: rgba(226, 232, 240, 0.5);
      --accent: #ec4899;
      --accent-2: #8b5cf6;
      --accent-3: #22d3ee;
      --outline: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      font-family: 'Exo 2', sans-serif;
      background: radial-gradient(circle at 15% 20%, #151525 0%, #0b0b12 40%, #0a0a0f 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .title-font {
      font-family: 'Exo 2', sans-serif;
      letter-spacing: 0.08em;
    }

    .panel-glow {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .ambient-bg {
      background-image:
        radial-gradient(circle at 20% 10%, rgba(236, 72, 153, 0.15), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12), transparent 50%);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0f;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .compare-scroll-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .compare-scroll-hidden::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flash {
      0% { background-color: rgba(255, 255, 255, 0.05); }
      50% { background-color: rgba(255, 255, 255, 0.2); }
      100% { background-color: rgba(255, 255, 255, 0.05); }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease both;
    }

    .animate-flash {
      animation: flash 0.6s ease;
    }

    .gradient-text {
      background: linear-gradient(270deg, #d100ff, #7a00ff, #00c3ff, #d100ff);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 10s linear infinite;
    }

    @keyframes gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes critical-pulse {
      0%, 100% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
      50% { text-shadow: 0 0 40px #00bfff, 0 0 80px #00bfff; }
    }

    .critical-label {
      animation: critical-pulse 2.5s ease-in-out infinite;
    }

    @keyframes breathe-opacity {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }

    .animate-breathe {
      animation: breathe-opacity 4s ease-in-out infinite;
    }

    @keyframes pink-soft-glow {
      0%, 100% {
        color: rgba(244, 114, 182, 0.78);
        text-shadow: 0 0 6px rgba(236, 72, 153, 0.38);
        border-color: rgba(236, 72, 153, 0.22);
        box-shadow: 0 0 8px rgba(236, 72, 153, 0.16);
      }
      50% {
        color: rgba(251, 207, 232, 0.95);
        text-shadow: 0 0 14px rgba(236, 72, 153, 0.72);
        border-color: rgba(236, 72, 153, 0.5);
        box-shadow: 0 0 20px rgba(236, 72, 153, 0.34);
      }
    }

    .expand-glow {
      animation: pink-soft-glow 3.4s ease-in-out infinite;
    }
  </style>
</head>

              <CharacterForgePanel isVisible={true} />
            </div>
          </main>
        </div>
      );
    };

    const parseStoredIdList = (key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(parsed) ? parsed.filter((id) => typeof id === "string" && id.trim().length > 0) : [];
      } catch (err) {
        return [];
      }
    };
    const parseStoredStoryAnswers = () => {
      const empty = { race: {}, class: {}, background: {} };
      try {
        const raw = JSON.parse(localStorage.getItem(CHARACTER_FORGE_STORAGE_KEYS.storyAnswersById) || "{}");
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) return empty;
        return {
          race: raw.race && typeof raw.race === "object" && !Array.isArray(raw.race) ? raw.race : {},
          class: raw.class && typeof raw.class === "object" && !Array.isArray(raw.class) ? raw.class : {},
          background: raw.background && typeof raw.background === "object" && !Array.isArray(raw.background) ? raw.background : {}
        };
      } catch (err) {
        return empty;
      }
    };

    const readStoryQuestion = (item) => {
      return typeof item?.storyQuestion === "string" ? item.storyQuestion.trim() : "";
    };

    const resolveItemStoryQuestion = (item, itemsById) => {
      if (!item || !itemsById) return "";
      const visited = new Set();
      let current = item;
      while (current && typeof current === "object") {
        const currentId = typeof current.id === "string" ? current.id : "";
        if (currentId && visited.has(currentId)) break;
        if (currentId) visited.add(currentId);
        const question = readStoryQuestion(current);
        if (question) return question;
        const parentId = typeof current.parentId === "string" ? current.parentId.trim() : "";
        if (!parentId) break;
        current = itemsById.get(parentId) || null;
      }
      return "";
    };

    const getClassStoryPrompt = (classItem, classesById) => {
      if (!classItem) {
        return {
          statement: "Classes define combat style, discipline, and role in the world.",
          question: "How did you become this class, and what goal drives you now?"
        };
      }
      const question =
        resolveItemStoryQuestion(classItem, classesById) ||
        `How did you become ${classItem.name}, and what is driving you now?`;
      return {
        statement: classItem.description,
        question
      };
    };

    const getRaceStoryPrompt = (raceItem, racesById) => {
      if (!raceItem) {
        return {
          statement: "Your race shapes culture, identity, and how the world reacts to you.",
          question: "What part of your heritage most shaped your life before adventuring?"
        };
      }
      const question =
        resolveItemStoryQuestion(raceItem, racesById) ||
        "What part of your heritage most shaped your life before adventuring?";
      return {
        statement: raceItem.description,
        question
      };
    };

    const getBackgroundStoryPrompt = (backgroundItem) => {
      if (!backgroundItem) {
        return {
          statement: "Background defines your life before adventuring.",
          question: "What part of your former life still influences your decisions today?"
        };
      }
      const question =
        readStoryQuestion(backgroundItem) ||
        "What part of your former life still influences your decisions today?";
      return {
        statement: backgroundItem.description,
        question
      };
    };

    const capitalizeChipStart = (value) => {
      if (typeof value !== "string") return value;
      return value.replace(/^(\s*)([a-z])/, (_, prefix, char) => `${prefix}${char.toUpperCase()}`);
    };

    const CLASS_PROFILE_KEYS = ["damage", "survival", "support", "control", "utility"];

    const validateCharacterItems = (rawItems, kind) => {
      if (!Array.isArray(rawItems)) {
        throw new Error(`Invalid ${kind} JSON: expected an array.`);
      }

      const parseBonusEntry = (entry) => {
        if (entry && typeof entry === "object" && !Array.isArray(entry)) {
          const stat = typeof entry.stat === "string" ? entry.stat.trim().toUpperCase() : "";
          const value = Number(entry.value);
          if (stat && Number.isFinite(value) && value !== 0) return { stat, value };
          return null;
        }
        if (typeof entry === "string") {
          const raw = entry.trim().toUpperCase();
          const match = raw.match(/^([+-]{1,2}|[+-]?\d+)\s*([A-Z]{3,})$/);
          if (!match) return null;
          const token = match[1];
          const stat = match[2];
          let value = Number(token);
          if (!Number.isFinite(value)) {
            if (token === "+") value = 1;
            if (token === "++") value = 2;
            if (token === "-") value = -1;
            if (token === "--") value = -2;
          }
          if (!Number.isFinite(value) || value === 0) return null;
          return { stat, value };
        }
        return null;
      };

      const parseNameOptions = (rawNames) => {
        if (!rawNames || typeof rawNames !== "object" || Array.isArray(rawNames)) {
          return null;
        }

        const parseNameList = (value) =>
          Array.isArray(value)
            ? value
                .map((entry) => (typeof entry === "string" ? entry.trim() : ""))
                .filter((entry) => entry.length > 0)
            : [];

        const male = parseNameList(rawNames.male);
        const female = parseNameList(rawNames.female);
        const any = parseNameList(rawNames.any);
        const groupNames = parseNameList(rawNames.groupNames);
        const groupLabel =
          typeof rawNames.groupLabel === "string" && rawNames.groupLabel.trim().length > 0
            ? rawNames.groupLabel.trim()
            : "Family Names";

        if (male.length === 0 && female.length === 0 && any.length === 0 && groupNames.length === 0) {
          return null;
        }

        return { male, female, any, groupLabel, groupNames };
      };

      const idSet = new Set();
      const normalized = rawItems.map((raw) => {
        const id = typeof raw?.id === "string" ? raw.id.trim() : "";
        const name = typeof raw?.name === "string" ? raw.name.trim() : "";
        const image = typeof raw?.image === "string" ? raw.image.trim() : "";
        const description = typeof raw?.description === "string" ? raw.description.trim() : "";
        const parentId = raw?.parentId === null || raw?.parentId === undefined ? null : String(raw.parentId).trim();
        const bonuses = Array.isArray(raw?.bonuses)
          ? raw.bonuses.map(parseBonusEntry).filter(Boolean)
          : [];
        const traits = Array.isArray(raw?.traits)
          ? raw.traits
              .map((trait) => (typeof trait === "string" ? trait.trim() : ""))
              .filter((trait) => trait.length > 0)
          : [];
        const dataChips = Array.isArray(raw?.dataChips)
          ? raw.dataChips
              .map((chip) => (typeof chip === "string" ? chip.trim() : ""))
              .filter((chip) => chip.length > 0)
          : [];
        const explicitLanguages = typeof raw?.languages === "string" ? raw.languages.trim() : "";
        const extractedLanguagesChip = dataChips.find((chip) => /^Languages:\s*/i.test(chip)) || "";
        const languages = explicitLanguages
          || (extractedLanguagesChip ? extractedLanguagesChip.replace(/^Languages:\s*/i, "").trim() : "");
        const normalizedDataChips = dataChips.filter((chip) => !/^Languages:\s*/i.test(chip));
        const linkChipRaw = raw?.linkChip;
        const linkChip =
          linkChipRaw && typeof linkChipRaw === "object" && !Array.isArray(linkChipRaw)
            ? {
                label: typeof linkChipRaw.label === "string" ? linkChipRaw.label.trim() : "",
                url: typeof linkChipRaw.url === "string" ? linkChipRaw.url.trim() : "",
              }
            : null;
        const names = parseNameOptions(raw?.names);
        const isAdditional = raw?.isAdditional === true;
        const hidden = raw?.hidden === true;
        const faction = typeof raw?.faction === "string" ? raw.faction.trim() : "";
        const rawFactionPreference = raw?.factionPreference;
        const factionPreference = Number.isFinite(Number(rawFactionPreference))
          ? Math.min(7, Math.max(1, Math.round(Number(rawFactionPreference))))
          : (typeof rawFactionPreference === "string" ? rawFactionPreference.trim() : "");
        const profileRaw = raw?.profile;
        const profile =
          profileRaw && typeof profileRaw === "object" && !Array.isArray(profileRaw)
            ? CLASS_PROFILE_KEYS.reduce((acc, key) => {
                const parsed = Number(profileRaw[key]);
                if (Number.isFinite(parsed)) {
                  const clamped = Math.min(5, Math.max(1, Math.round(parsed)));
                  acc[key] = clamped;
                }
                return acc;
              }, {})
            : {};
        const parsedDifficulty = Number(raw?.difficulty);
        const difficulty = Number.isFinite(parsedDifficulty)
          ? Math.min(5, Math.max(1, Math.round(parsedDifficulty)))
          : 3;
        const tags = Array.isArray(raw?.tags)
          ? raw.tags
              .map((tag) => (typeof tag === "string" ? tag.trim() : ""))
              .filter((tag) => tag.length > 0)
          : [];
        const storyQuestion = typeof raw?.storyQuestion === "string" ? raw.storyQuestion.trim() : "";

        if (!id || !name || !image || !description) {
          throw new Error(`Invalid ${kind} item: required fields are id, name, image, description.`);
        }
        if (idSet.has(id)) {
          throw new Error(`Duplicate ${kind} id "${id}" in dataset.`);
        }
        idSet.add(id);

        return {
          id,
          name,
          image,
          description,
          parentId,
          bonuses,
          traits,
          dataChips: normalizedDataChips,
          languages,
          linkChip: linkChip?.url ? linkChip : null,
          names,
          isAdditional,
          hidden,
          faction,
          factionPreference,
          profile,
          difficulty,
          tags,
          storyQuestion,
        };
      });

      const availableIds = new Set(normalized.map((item) => item.id));
      normalized.forEach((item) => {
        if (item.parentId && !availableIds.has(item.parentId)) {
          throw new Error(`Invalid ${kind} item "${item.id}": parentId "${item.parentId}" does not exist.`);
        }
      });

      return normalized;
    };

    const validateBackgroundItems = (rawItems) => {
      if (rawItems === undefined) return [];
      if (!Array.isArray(rawItems)) {
        throw new Error("Invalid backgrounds JSON: expected an array.");
      }

      const idSet = new Set();
      return rawItems.map((raw) => {
        const id = typeof raw?.id === "string" ? raw.id.trim() : "";
        const name = typeof raw?.name === "string" ? raw.name.trim() : "";
        const description = typeof raw?.description === "string" ? raw.description.trim() : "";
        const skills = Array.isArray(raw?.proficiencies?.skills)
          ? raw.proficiencies.skills
              .map((entry) => (typeof entry === "string" ? entry.trim() : ""))
              .filter(Boolean)
          : [];
        const tools = Array.isArray(raw?.proficiencies?.tools)
          ? raw.proficiencies.tools
              .map((entry) => (typeof entry === "string" ? entry.trim() : ""))
              .filter(Boolean)
          : [];
        const languages = Number.isFinite(Number(raw?.languages)) ? Math.max(0, Math.round(Number(raw.languages))) : 0;
        const equipment = Array.isArray(raw?.equipment)
          ? raw.equipment
              .map((entry) => (typeof entry === "string" ? entry.trim() : ""))
              .filter(Boolean)
          : [];
        const startingMoney = typeof raw?.startingMoney === "string" ? raw.startingMoney.trim() : "";
        const storyQuestion = typeof raw?.storyQuestion === "string" ? raw.storyQuestion.trim() : "";
        const isAdditional = raw?.isAdditional === true;
        const linkChipRaw = raw?.linkChip;
        const linkChip =
          linkChipRaw && typeof linkChipRaw === "object" && !Array.isArray(linkChipRaw)
            ? {
                label: typeof linkChipRaw.label === "string" ? linkChipRaw.label.trim() : "",
                url: typeof linkChipRaw.url === "string" ? linkChipRaw.url.trim() : "",
              }
            : null;

        if (!id || !name || !description) {
          throw new Error("Invalid background item: required fields are id, name, description.");
        }
        if (idSet.has(id)) {
          throw new Error(`Duplicate background id "${id}" in dataset.`);
        }
        idSet.add(id);

        return {
          id,
          name,
          description,
          proficiencies: { skills, tools },
          languages,
          equipment,
          startingMoney,
          storyQuestion,
          isAdditional,
          linkChip: linkChip?.url ? linkChip : null,
        };
      });
    };

    const validateWeaponItems = (rawItems) => {
      if (rawItems === undefined) return [];
      if (!Array.isArray(rawItems)) {
        throw new Error("Invalid weapons JSON: expected an array.");
      }

      const normalizeWeaponTags = (rawTags) => {
        const cleaned = rawTags
          .map((entry) => (typeof entry === "string" ? entry.trim() : ""))
          .filter(Boolean);
        const versatileRegex = /^versatile\s*\(([^)]+)\)$/i;
        const baseDamageRegex = /^\d+d\d+$/i;
        const loadingRegex = /^loading$/i;

        let versatileDamage = null;
        const withoutVersatile = cleaned.filter((tag) => {
          if (loadingRegex.test(tag)) return false;
          const match = tag.match(versatileRegex);
          if (!match) return true;
          if (!versatileDamage) versatileDamage = match[1].trim();
          return false;
        });

        if (!versatileDamage) return withoutVersatile;

        const damageIndex = withoutVersatile.findIndex((tag) => baseDamageRegex.test(tag));
        if (damageIndex >= 0) {
          withoutVersatile[damageIndex] = `${withoutVersatile[damageIndex]} / ${versatileDamage}`;
        } else {
          withoutVersatile.unshift(versatileDamage);
        }

        return withoutVersatile;
      };

      const idSet = new Set();
      return rawItems.map((raw) => {
        const id = typeof raw?.id === "string" ? raw.id.trim() : "";
        const name = typeof raw?.name === "string" ? raw.name.trim() : "";
        const image = typeof raw?.image === "string" ? raw.image.trim() : "";
        const tags = Array.isArray(raw?.tags) ? normalizeWeaponTags(raw.tags) : [];

        if (!id || !name || !image) {
          throw new Error("Invalid weapon item: required fields are id, name, image.");
        }
        if (idSet.has(id)) {
          throw new Error(`Duplicate weapon id "${id}" in dataset.`);
        }
        idSet.add(id);

        return { id, name, image, tags };
      });
    };

    const CHARACTER_LOCAL_IMAGE_EXTENSIONS = ["png"];

    const getCharacterImageCandidates = (item, kind) => {
      const fallback = typeof item?.image === "string" ? item.image.trim() : "";
      const id = typeof item?.id === "string" ? item.id.trim() : "";
      if (!id) return fallback ? [fallback] : [];
      const encodedId = encodeURIComponent(id);
      const folderByKind = {
        race: "race",
        class: "class",
        weapon: "weapon"
      };
      const folder = folderByKind[kind] || "class";
      const localCandidates = CHARACTER_LOCAL_IMAGE_EXTENSIONS.flatMap((ext) => (
        kind === "weapon"
          ? [`img/weapon/${encodedId}.${ext}`]
          : [`img/${folder}/${encodedId}.${ext}`]
      ));
      return fallback ? [...localCandidates, fallback] : localCandidates;
    };

    const CharacterItemImage = ({ item, kind, alt, className = "", loading = undefined }) => {
      const candidates = useMemo(
        () => getCharacterImageCandidates(item, kind),
        [item?.id, item?.image, kind]
      );
      const [candidateIndex, setCandidateIndex] = useState(0);

      useEffect(() => {
        setCandidateIndex(0);
      }, [candidates.join("|")]);

      const src = candidates[candidateIndex] || "";
      const canFallback = candidateIndex < candidates.length - 1;

      return (
        <img
          src={src}
          alt={alt || item?.name || ""}
          className={className}
          loading={loading}
          onError={canFallback ? () => setCandidateIndex((prev) => prev + 1) : undefined}
        />
      );
    };

    const QuickFadeCharacterImage = ({ item, kind, className = "" }) => {
      const [currentItem, setCurrentItem] = useState(item || null);
      const [previousItem, setPreviousItem] = useState(null);
      const [showCurrent, setShowCurrent] = useState(true);
      const rafRef = useRef(null);
      const cleanupTimeoutRef = useRef(null);

      useEffect(() => {
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (cleanupTimeoutRef.current) clearTimeout(cleanupTimeoutRef.current);
        };
      }, []);

      useEffect(() => {
        const next = item || null;

        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        if (cleanupTimeoutRef.current) clearTimeout(cleanupTimeoutRef.current);

        setCurrentItem((prevCurrent) => {
          if (!next) {
            setPreviousItem(null);
            setShowCurrent(true);
            return null;
          }
          if (!prevCurrent) {
            setPreviousItem(null);
            setShowCurrent(true);
            return next;
          }
          if (prevCurrent.id === next.id) return prevCurrent;

          // Restart fade on every target update, including mid-transition changes.
          setPreviousItem(prevCurrent);
          setShowCurrent(false);
          rafRef.current = requestAnimationFrame(() => setShowCurrent(true));
          cleanupTimeoutRef.current = setTimeout(() => setPreviousItem(null), 260);
          return next;
        });
      }, [item?.id, kind]);

      return (
        <div className={`relative w-full h-full ${className}`}>
          {previousItem && (
            <CharacterItemImage
              item={previousItem}
              kind={kind}
              alt={previousItem.name}
              className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-200 ${showCurrent ? "opacity-0" : "opacity-100"}`}
              loading="lazy"
            />
          )}
          {currentItem && (
            <CharacterItemImage
              item={currentItem}
              kind={kind}
              alt={currentItem.name}
              className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-200 ${
                previousItem ? (showCurrent ? "opacity-100" : "opacity-0") : "opacity-100"
              }`}
              loading="lazy"
            />
          )}
        </div>
      );
    };

    const getBonusPrefix = (value) => {
      if (value === 1) return "+";
      if (value === 2) return "++";
      if (value === -1) return "-";
      if (value === -2) return "--";
      return value > 0 ? `+${value}` : `${value}`;
    };

    const mergeBonuses = (bonusArrays) => {
      const totals = new Map();
      bonusArrays.flat().forEach((bonus) => {
        if (!bonus || !bonus.stat || !Number.isFinite(bonus.value)) return;
        totals.set(bonus.stat, (totals.get(bonus.stat) || 0) + bonus.value);
      });
      return Array.from(totals.entries())
        .map(([stat, value]) => ({ stat, value }))
        .filter((bonus) => bonus.value !== 0)
        .sort((a, b) => b.value - a.value || a.stat.localeCompare(b.stat));
    };

    const mergeTraits = (traitArrays) => {
      const seen = new Set();
      const merged = [];
      traitArrays.flat().forEach((trait) => {
        if (!trait || typeof trait !== "string") return;
        const normalized = trait.trim();
        if (!normalized) return;
        const key = normalized.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        merged.push(normalized);
      });
      return merged;
    };

    const mergeDataChips = (chipArrays) => {
      const seen = new Set();
      const merged = [];
      chipArrays.flat().forEach((chip) => {
        if (!chip || typeof chip !== "string") return;
        const normalized = chip.trim();
        if (!normalized) return;
        const key = normalized.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        merged.push(normalized);
      });
      return merged;
    };

    const extractAgeInfoFromChips = (chips = []) => {
      const ageInfo = [];
      const remaining = [];
      chips.forEach((chip) => {
        if (!chip || typeof chip !== "string") return;
        const trimmed = chip.trim();
        const normalized = trimmed
          .replace(/^"+|"+$/g, "")
          .replace(/\s*\|\s*/g, ". ")
          .trim();

        if (/^Lifespan:/i.test(normalized)) {
          ageInfo.push(normalized);
          return;
        }

        if (/^"?\s*Maturity:/i.test(trimmed)) {
          const lifespanMatch = normalized.match(/Lifespan:\s*[^.]+/i);
          if (lifespanMatch) {
            ageInfo.push(lifespanMatch[0].trim());
            return;
          }
        }

        remaining.push(trimmed);
      });
      return { ageInfo, remaining };
    };

    const extractHpInfoFromChips = (chips = []) => {
      let hp = null;
      const remaining = [];
      chips.forEach((chip) => {
        if (!chip || typeof chip !== "string") return;
        const trimmed = chip.trim();
        const match = trimmed.match(/^HP:\s*(-?\d+)$/i);
        if (match && hp === null) {
          hp = Number(match[1]);
          return;
        }
        remaining.push(trimmed);
      });
      return { hp, remaining };
    };

    const getHeartCountForHp = (hp) => {
      if (!Number.isFinite(hp) || hp <= 0) return 0;
      if (hp <= 6) return 1;
      return 1 + Math.ceil((hp - 6) / 2);
    };

    const BonusChips = ({ bonuses = [], className = "" }) => (
      <div className={`flex flex-wrap gap-2 ${className}`}>
        {bonuses.map((bonus) => (
          <span
            key={`${bonus.stat}-${bonus.value}`}
            className={`px-2.5 py-1 rounded-full border text-[11px] font-bold tracking-[0.12em] ${
              bonus.value >= 3
                ? "bg-lime-400/30 border-lime-200/90 text-lime-50 backdrop-blur-xl"
                : bonus.value === 2
                  ? "bg-green-400/30 border-green-200/90 text-green-50 backdrop-blur-xl"
                  : bonus.value === 1
                    ? "bg-emerald-500/20 border-emerald-300/60 text-emerald-100 backdrop-blur-xl"
                    : "bg-rose-500/20 border-rose-300/60 text-rose-100 backdrop-blur-xl"
            }`}
          >
            {getBonusPrefix(bonus.value)} {bonus.stat}
          </span>
        ))}
      </div>
    );

    const TraitChips = ({ traits = [], className = "" }) => (
      <div className={`flex flex-wrap gap-2 ${className}`}>
        {traits.map((trait) => (
          <span
            key={trait}
            className="px-2.5 py-1 rounded-full border border-white/20 bg-white/5 text-[11px] font-semibold tracking-[0.06em] text-white/85"
          >
            {trait}
          </span>
        ))}
      </div>
    );

    const DetailChips = ({ items = [], className = "", chipClassName = "" }) => {
      if (!items.length) return null;
      return (
        <div className={`flex flex-wrap gap-2 ${className}`}>
          {items.map((item) => (
            <span
              key={item}
              className={`px-2.5 py-1 rounded-full border text-[11px] font-semibold tracking-[0.06em] ${chipClassName}`}
            >
              {item}
            </span>
          ))}
        </div>
      );
    };

    const HoverInfoChip = ({ label, tooltipContent, className = "" }) => {
      const [tooltipState, setTooltipState] = useState(null);

      const showTooltip = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const tooltipWidth = 280;
        const viewportPadding = 12;
        const centeredLeft = rect.left + (rect.width / 2) - (tooltipWidth / 2);
        const left = Math.max(
          viewportPadding,
          Math.min(centeredLeft, window.innerWidth - tooltipWidth - viewportPadding)
        );

        setTooltipState({
          top: Math.max(12, rect.top - 12),
          left
        });
      };

      const hideTooltip = () => {
        setTooltipState(null);
      };

      const handleChipTap = (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (tooltipState) {
          hideTooltip();
          return;
        }
        showTooltip(event);
      };

      useEffect(() => {
        const clearTooltip = () => hideTooltip();
        window.addEventListener("scroll", clearTooltip, true);
        window.addEventListener("resize", clearTooltip);
        return () => {
          window.removeEventListener("scroll", clearTooltip, true);
          window.removeEventListener("resize", clearTooltip);
        };
      }, []);

      return (
        <>
          <div
            className={`inline-flex items-center rounded-full border px-3 py-1.5 text-[11px] font-semibold tracking-[0.08em] ${className}`}
            onMouseEnter={showTooltip}
            onMouseLeave={hideTooltip}
            onFocus={showTooltip}
            onBlur={hideTooltip}
            onMouseDown={(event) => event.stopPropagation()}
            onTouchStart={(event) => event.stopPropagation()}
            onClick={handleChipTap}
            tabIndex={0}
          >
            {label}
          </div>
          {tooltipState && ReactDOM.createPortal(
            <div
              className="pointer-events-none fixed z-[60] w-[280px] -translate-y-full rounded-2xl border border-white/10 bg-[#0f0f16]/95 px-3 py-3 text-xs leading-relaxed text-white/75 shadow-2xl"
              style={{
                top: tooltipState.top,
                left: tooltipState.left
              }}
            >
              {tooltipContent}
            </div>,
            document.body
          )}
        </>
      );
    };

        const left = Math.max(

    const getFactionPreferenceValue = (item) => {
      const faction = typeof item?.faction === "string" ? item.faction.toLowerCase().trim() : "";
      const normalizedFaction = faction
        .replace(/[â€“â€”]/g, "-")
        .replace(/\s*-\s*/g, "-")
        .replace(/\s+/g, " ")
        .trim();
      const factionByText = {
        "very horde": 1,
        "horde": 2,
        "horde-leaning": 3,
        "neutral": 4,
        "alliance-leaning": 5,
        "alliance": 6,
        "very alliance": 7
      };
      if (factionByText[normalizedFaction]) return factionByText[normalizedFaction];
      if (normalizedFaction.includes("horde")) return 2;
      if (normalizedFaction.includes("alliance")) return 6;
      if (normalizedFaction.includes("neutral")) return 4;
      return 4;

      const childrenByParent = useMemo(() => {
        const map = new Map();
        items.forEach((item) => {
          if (!item.parentId) return;
          const arr = map.get(item.parentId) || [];
          arr.push(item);
          map.set(item.parentId, arr);
        });
        map.forEach((arr) => arr.sort((a, b) => a.id.localeCompare(b.id)));
        return map;
      }, [items]);
      const orderedItems = useMemo(() => {
        if (!useParentGrouping) {
          return mainItems
            .filter((item) => selectableMainIds.has(item.id))
            .sort((a, b) => a.id.localeCompare(b.id));
        }

        const baseItems = mainItems.filter((item) => !item.parentId).sort((a, b) => a.id.localeCompare(b.id));
        const ordered = [];

        baseItems.forEach((parent) => {
          ordered.push(parent);
          const variants = childrenByParent.get(parent.id) || [];
          if (variants.length > 0 && expandedParentIds.has(parent.id)) {
            ordered.push(...variants.map((variant) => ({ ...variant, _isExpandedChild: true })));
          }
        });

        const parentIds = new Set(baseItems.map((p) => p.id));
        const orphanVariants = mainItems
          .filter((item) => item.parentId && !parentIds.has(item.parentId))
          .sort((a, b) => a.id.localeCompare(b.id));
        ordered.push(...orphanVariants);
        return ordered;
      }, [mainItems, childrenByParent, expandedParentIds, useParentGrouping, selectableMainIds]);
      const selectableAdditionalIds = useMemo(() => getSelectableCharacterIds(additionalItems), [additionalItems]);
      const selectableItemIds = useMemo(() => getSelectableCharacterIds(items), [items]);
      const selectableItems = useMemo(
        () => items.filter((item) => selectableItemIds.has(item.id)),
        [items, selectableItemIds]
      );
      const orderedAdditionalItems = useMemo(() => {
        if (additionalItems.length === 0) return [];
        if (!useParentGrouping) {
          return additionalItems
            .filter((item) => selectableAdditionalIds.has(item.id))
            .sort((a, b) => a.id.localeCompare(b.id));
        }

        const baseItems = additionalItems.filter((item) => !item.parentId).sort((a, b) => a.id.localeCompare(b.id));
        const ordered = [];

          if (variants.length > 0 && expandedParentIds.has(parent.id)) {

    const VerticalCompareSpinner = ({ items, onActiveChange, onPreviewIdChange, onRequestRemove, removeLabel }) => {
      const containerRef = useRef(null);
      const [activeIndex, setActiveIndex] = useState(0);
      const [spacerHeight, setSpacerHeight] = useState(160);
      const scrollEndTimeoutRef = useRef(null);
      const programmaticScrollTimeoutRef = useRef(null);
      const isProgrammaticScrollRef = useRef(false);
      const wheelStepTimeoutRef = useRef(null);

      const measureSpacerHeight = () => {
        const container = containerRef.current;
        if (!container) return;
        const firstCard = container.querySelector("[data-spinner-item='true']");
        if (!firstCard) return;
        const nextSpacer = Math.max(0, (container.clientHeight - firstCard.offsetHeight) / 2);
        setSpacerHeight(nextSpacer);
      };

      const snapToIndex = (index, behavior = "smooth") => {
        const container = containerRef.current;
        if (!container) return;
        const cards = Array.from(container.querySelectorAll("[data-spinner-item='true']"));
        const target = cards[index];
        if (!target) return;
        const top = target.offsetTop - (container.clientHeight - target.offsetHeight) / 2;
        isProgrammaticScrollRef.current = true;
        container.scrollTo({ top: Math.max(0, top), behavior });
        if (programmaticScrollTimeoutRef.current) clearTimeout(programmaticScrollTimeoutRef.current);
        programmaticScrollTimeoutRef.current = setTimeout(() => {
          isProgrammaticScrollRef.current = false;
        }, behavior === "smooth" ? 260 : 30);
      };

      useEffect(() => {
        return () => {
          if (scrollEndTimeoutRef.current) clearTimeout(scrollEndTimeoutRef.current);
          if (programmaticScrollTimeoutRef.current) clearTimeout(programmaticScrollTimeoutRef.current);
          if (wheelStepTimeoutRef.current) clearTimeout(wheelStepTimeoutRef.current);
        };
      }, []);

      useEffect(() => {
        setActiveIndex(0);
        if (onPreviewIdChange) onPreviewIdChange(items[0]?.id || null);
        requestAnimationFrame(() => {
          measureSpacerHeight();
          snapToIndex(0, "auto");
        });
      }, [items, onPreviewIdChange]);

      useEffect(() => {
        const onResize = () => {
          measureSpacerHeight();
          snapToIndex(activeIndex, "auto");
        };
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, [activeIndex]);

      useEffect(() => {
        if (!items.length) return;
        onActiveChange(items[activeIndex] || null);
      }, [activeIndex, items, onActiveChange]);

      const updateActiveIndex = () => {
        const container = containerRef.current;
        if (!container) return;
        if (isProgrammaticScrollRef.current) return;
        const cards = Array.from(container.querySelectorAll("[data-spinner-item='true']"));
        if (!cards.length) return;
        const centerY = container.getBoundingClientRect().top + container.clientHeight / 2;
        let nearestIndex = 0;
        let nearestDistance = Infinity;
        cards.forEach((card, index) => {
          const rect = card.getBoundingClientRect();
          const cardCenter = rect.top + rect.height / 2;
          const distance = Math.abs(cardCenter - centerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestIndex = index;
          }
        });
        if (onPreviewIdChange) onPreviewIdChange(items[nearestIndex]?.id || null);

        if (scrollEndTimeoutRef.current) clearTimeout(scrollEndTimeoutRef.current);
        scrollEndTimeoutRef.current = setTimeout(() => {
          setActiveIndex(nearestIndex);
          snapToIndex(nearestIndex, "smooth");
        }, 90);
      };

      const handleWheel = (event) => {
        event.preventDefault();
        if (!items.length) return;
        if (wheelStepTimeoutRef.current) return;

        const direction = event.deltaY > 0 ? 1 : event.deltaY < 0 ? -1 : 0;
        if (!direction) return;

        const nextIndex = Math.max(0, Math.min(items.length - 1, activeIndex + direction));
        if (nextIndex === activeIndex) return;
        setActiveIndex(nextIndex);
        if (onPreviewIdChange) onPreviewIdChange(items[nextIndex]?.id || null);
        snapToIndex(nextIndex, "smooth");

        wheelStepTimeoutRef.current = setTimeout(() => {
          wheelStepTimeoutRef.current = null;
        }, 140);
      };

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const onWheel = (event) => handleWheel(event);
        container.addEventListener("wheel", onWheel, { passive: false });
        return () => container.removeEventListener("wheel", onWheel);
      }, [handleWheel]);

      return (
        <div className="relative w-full max-w-none mx-auto">
          <div
            ref={containerRef}
            onScroll={updateActiveIndex}
            className="h-[clamp(220px,34vh,430px)] overflow-y-auto compare-scroll-hidden"
          >
            <div style={{ height: `${spacerHeight}px` }}></div>
            <div className="flex flex-col gap-2">
              {items.map((item, index) => {
                const isActive = index === activeIndex;
                const distance = Math.abs(index - activeIndex);
                const fadeDistance = 3;
                const opacity = Math.max(0, 1 - (distance / fadeDistance));
                const scale = Math.max(0.85, 1 - (distance * 0.04));
                return (
                  <div
                    key={item.id}
                    data-spinner-item="true"
                    className="w-full h-14 px-1"
                    style={{ opacity, transform: `scale(${scale})` }}
                  >
                    <div className="group/compare-row relative w-full max-w-none h-full mx-auto">
                      <button
                        type="button"
                        tabIndex={-1}
                        onClick={() => {
                          setActiveIndex(index);
                          if (onPreviewIdChange) onPreviewIdChange(item.id);
                          snapToIndex(index, "smooth");
                        }}
                        className="w-full h-full text-center text-white transition-all duration-200 inline-flex items-center justify-center"
                      >
                        <div className="flex items-center justify-center gap-3">
                          <span className={`text-[14px] md:text-[28px] font-semibold leading-none tracking-[0.03em] transition-colors ${isActive ? "text-white" : "text-inherit"}`}>
                            {item.name}
                          </span>
                          {isActive && onRequestRemove ? (
                            <span className="relative h-4 w-4 inline-flex items-center justify-center">
                              <button
                                type="button"
                                tabIndex={-1}
                                onClick={(event) => {
                                  event.stopPropagation();
                                  onRequestRemove(item);
                                }}
                                className="h-4 w-4 inline-flex items-center justify-center text-white/70 opacity-0 group-hover/compare-row:opacity-100 hover:text-white transition-all duration-200"
                                aria-label={`Remove selected ${removeLabel || "item"}`}
                              >
                                <X className="w-4 h-4" />
                              </button>
                            </span>
                          ) : isActive ? (
                            <span className="h-1.5 w-1.5 rounded-full bg-white/85"></span>
                          ) : null}
                        </div>
                      </button>
                    </div>
                  </div>
                );

            </div>
            <div style={{ height: `${spacerHeight}px` }}></div>

        const storedIds = parseStoredIdList(CHARACTER_FORGE_STORAGE_KEYS.selectedWeaponIds).slice(0, 2);
        if (storedIds.length > 0) return storedIds;
        const legacyId = localStorage.getItem(CHARACTER_FORGE_STORAGE_KEYS.selectedWeaponId) || "";
        return legacyId ? [legacyId] : [];
      });
      const [races, setRaces] = useState([]);
      const [classes, setClasses] = useState([]);
      const [backgrounds, setBackgrounds] = useState([]);
      const [weapons, setWeapons] = useState([]);

      const [loadError, setLoadError] = useState("");
      const [modalState, setModalState] = useState(null);
      const [removeConfirmState, setRemoveConfirmState] = useState(null);
      const [isStoryModalOpen, setIsStoryModalOpen] = useState(false);
      const [storyAnswersById, setStoryAnswersById] = useState(() => parseStoredStoryAnswers());
      const [activeRace, setActiveRace] = useState(null);
      const [activeClass, setActiveClass] = useState(null);
      const [previewRaceId, setPreviewRaceId] = useState(null);
      const [previewClassId, setPreviewClassId] = useState(null);
      const [isFinalizeExpanded, setIsFinalizeExpanded] = useState(false);
      const [isPersonaInlineOpen, setIsPersonaInlineOpen] = useState(false);
      const [isFinalizeStatsVisible, setIsFinalizeStatsVisible] = useState(false);
      const previousStepRef = useRef(activeStep);
      const dataFileInputRef = useRef(null);
      const visibleRaces = useMemo(() => races.filter((item) => item.hidden !== true), [races]);
      const visibleClasses = useMemo(() => classes.filter((item) => item.hidden !== true), [classes]);

      const applyCharacterData = (data) => {
        if (!data || !Array.isArray(data.races) || !Array.isArray(data.classes)) {
          throw new Error("Invalid character JSON: expected { races: [], classes: [] }.");
        }
        setRaces(validateCharacterItems(data.races, "races"));
        setClasses(validateCharacterItems(data.classes, "classes"));
        setBackgrounds(validateBackgroundItems(data.backgrounds));
        setWeapons(validateWeaponItems(data.weapons));
      };

      const loadData = async () => {
        setIsLoading(true);
        setLoadError("");
        try {
          const bundledData = window[CHARACTER_FORGE_DATA_GLOBAL_KEY];
          if (bundledData) {
            applyCharacterData(bundledData);
            return;
          }

          if (isFileProtocol) {
            throw new Error("Could not load character data script. Ensure data/wow-character-options.js exists and is linked in index.html.");
          }

          const response = await fetch(CHARACTER_FORGE_DATA_FILE);
          if (!response.ok) {
            throw new Error("Could not load character data JSON.");
          }

          const data = await response.json();
          applyCharacterData(data);
        } catch (err) {
          setLoadError(err.message || "Failed to load character data.");
        } finally {
          setIsLoading(false);
        }
      };

      const handleManualImport = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = typeof reader.result === "string" ? reader.result : "";
            const parsed = JSON.parse(text);
            applyCharacterData(parsed);
            if (dataFileInputRef.current) dataFileInputRef.current.value = "";
            setLoadError("");
          } catch (err) {
            setLoadError(err.message || "Failed to parse JSON file.");
          }
        };
        reader.onerror = () => {
          setLoadError("Failed to read JSON file.");
        };
        reader.readAsText(file);
      };

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.activeStep, activeStep);
      }, [activeStep]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedRaceIds, JSON.stringify(selectedRaceIds));
      }, [selectedRaceIds]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedClassIds, JSON.stringify(selectedClassIds));
      }, [selectedClassIds]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedBackgroundId, selectedBackgroundId);
      }, [selectedBackgroundId]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedWeaponIds, JSON.stringify(selectedWeaponIds));
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedWeaponId, selectedWeaponIds[0] || "");

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.storyAnswersById, JSON.stringify(storyAnswersById));

        if (isVisible && activeStep === "compare") {

        };
      }, [isVisible, activeStep]);

      useEffect(() => {

        if (!visibleRaces.length) {
          setSelectedRaceIds([]);

        const validIds = getSelectableCharacterIds(visibleRaces);
        setSelectedRaceIds((prev) => prev.filter((id) => validIds.has(id)));

        setSelectedClassIds((prev) => prev.filter((id) => validIds.has(id)));

          if (sanitized.length === 2) break;

        if (sanitized.length !== selectedWeaponIds.length || sanitized.some((id, index) => id !== selectedWeaponIds[index])) {

      const selectedRaces = useMemo(() => {

                  Go to Classes

            </div>

        const comboBonuses = mergeBonuses([
          compareRace?.bonuses || [],
          compareClass?.bonuses || []
        ]);
        const comboTraits = mergeTraits([
          compareRace?.traits || [],
          compareClass?.traits || []

        const comboDataChips = mergeDataChips([
          compareRace?.dataChips || [],
          compareClass?.dataChips || []
        ]);
        const { remaining: comboAgeResolvedChips } = extractAgeInfoFromChips(comboDataChips);
        const { hp: comboBaseHp, remaining: comboChips } = extractHpInfoFromChips(comboAgeResolvedChips);
        const comboConBonus = comboBonuses.find((bonus) => bonus.stat === "CON")?.value || 0;
        const getNameRows = (item) => {

          return [

            { key: "female", label: "Female", names: item.names.female || [] },
            { key: "family", label: "Family", names: item.names.groupNames || item.names.any || [] }

        const getDetailChips = (item) => {
          const traitChips = Array.isArray(item?.traits) ? item.traits : [];
          const dataChips = Array.isArray(item?.dataChips)
            ? item.dataChips.filter((chip) => typeof chip === "string" && !/^Lifespan:/i.test(chip) && !/^HP:\s*-?\d+/i.test(chip))
            : [];
          return mergeDataChips([traitChips, dataChips]);
        };
        const raceNameRows = getNameRows(compareRace);
        const classNameRows = getNameRows(compareClass);
        const raceDetailChips = getDetailChips(compareRace);
        const classDetailChips = getDetailChips(compareClass);
        const backgroundSkillChips = selectedBackground
          ? [
              ...selectedBackground.proficiencies.skills,
              ...selectedBackground.proficiencies.tools
            ]
          : [];
        const backgroundLanguageChips = selectedBackground && selectedBackground.languages > 0
          ? [`+${selectedBackground.languages} Languages`]
          : [];
        const backgroundGearChips = selectedBackground
          ? selectedBackground.equipment.map(capitalizeChipStart)
          : [];
        const backgroundFundsChips = selectedBackground && selectedBackground.startingMoney
          ? [selectedBackground.startingMoney]
          : [];
        const compareProfile = compareClass?.profile || {};
        const compareDifficultyValues = [Number(compareClass?.difficulty), Number(compareRace?.difficulty)]
          .filter((value) => Number.isFinite(value));
        const compareDifficulty = compareDifficultyValues.length > 0
          ? Math.round((compareDifficultyValues.reduce((sum, value) => sum + value, 0) / compareDifficultyValues.length) * 10) / 10
          : null;
        const hasCompareProfile = Object.keys(compareProfile || {}).length > 0 || Number.isFinite(compareDifficulty);

        return (

            <div className={`relative z-10 h-full ${isFinalizeExpanded ? "px-0 pt-0 pb-0 md:px-0 md:pt-0 md:pb-0" : "px-0 pt-3 pb-0 md:px-8 md:pt-8 md:pb-0"} flex flex-col gap-3 md:gap-6`}>
              {!isFinalizeExpanded && (

                      removeLabel="race"
                    />
                    <VerticalCompareSpinner
                      items={selectedClasses}
                      onActiveChange={setActiveClass}
                      onPreviewIdChange={setPreviewClassId}
                      onRequestRemove={(item) => setRemoveConfirmState({ kind: "class", item })}
                      removeLabel="class"
                    />
                  </div>
                </div>

              <div className={`${isFinalizeExpanded ? "w-full flex-1 min-h-0 px-2 md:px-3 pt-2 md:pt-3 pb-2 md:pb-3" : "fixed inset-x-0 bottom-0 z-20 w-full max-w-7xl mx-auto px-2 sm:px-4 md:px-6 pb-2 md:pb-3 flex flex-col gap-2"}`}>
                {!isFinalizeExpanded && hasCompareProfile && isFinalizeStatsVisible && (
                  <div className="md:hidden rounded-2xl border border-white/10 bg-black/35 backdrop-blur-xl p-3">
                    <ProfileBars profile={compareProfile} difficulty={compareDifficulty} />
                  </div>
                )}
                {!isFinalizeExpanded && hasCompareProfile && isFinalizeStatsVisible && (
                  <div className="hidden md:flex justify-end">
                    <div className="w-[320px] rounded-2xl border border-white/10 bg-black/35 backdrop-blur-xl p-3">
                      <ProfileBars profile={compareProfile} difficulty={compareDifficulty} />

                    <button

                      onClick={() => setIsFinalizeExpanded((prev) => !prev)}
                      className="shrink-0 text-[11px] uppercase tracking-[0.18em] text-white/70 hover:text-white transition"
                    >
                      {isFinalizeExpanded ? "Collapse Final Results" : "Expand Final Results"}
                    </button>
                    <div className="h-px flex-1 bg-white/15"></div>
                  </div>
                  <div className="flex items-center justify-between gap-3">
                    <div className="text-lg md:text-2xl font-semibold text-white/95">{comboName}</div>
                    {!isFinalizeExpanded && hasCompareProfile && (
                      <button

                        onClick={() => setIsFinalizeStatsVisible((prev) => !prev)}
                        className={`text-[11px] uppercase tracking-[0.18em] transition ${

                                  <DetailChips

                                  <DetailChips
                                    items={backgroundFundsChips}
                                    chipClassName="border-amber-200/35 bg-amber-300/15 text-amber-50"
                                  />
                                  <DetailChips
                                    items={backgroundGearChips}
                                    chipClassName="border-slate-200/30 bg-slate-200/10 text-slate-100"
                                  />
                                </div>
                              }
                            />
                          </div>
                        )}
                      </div>
                      {selectedBackground ? (
                        <div className={`shrink-0 ${isFinalizeExpanded ? "mt-2 flex flex-col items-start gap-2" : "mt-1 flex items-center gap-2"}`}>
                          {isFinalizeExpanded && selectedBackground.description && (
                            <div className="w-full text-sm text-white/65 leading-relaxed">
                              {selectedBackground.description}
                            </div>
                          )}
                        </div>
                      ) : (
                        <div className="mt-2 text-sm text-white/45 leading-relaxed">
                          Background grants skills, gear, and funds.
                        </div>
                      )}
                    </button>
                    <div className="grid grid-cols-2 gap-3">
                      {[0, 1].map((slotIndex) => {
                        const weapon = selectedWeapons[slotIndex] || null;
                        return (
                          <button
                            key={`weapon-slot-${slotIndex}`}
                            type="button"
                            onClick={() => setActiveStep("weapon")}
                            className="relative overflow-hidden rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-3 text-left hover:border-white/20 hover:bg-white/[0.07] transition"
                          >
                            {weapon && (
                              <>
                                <div className="pointer-events-none absolute inset-0">
                                  <CharacterItemImage
                                    item={weapon}
                                    kind="weapon"
                                    alt={weapon.name}
                                    className="absolute left-1/2 top-[70%] -translate-x-1/2 -translate-y-1/2 scale-[0.91] md:scale-[0.7] object-contain opacity-[0.15]"
                                    loading="lazy"
                                  />
                                </div>
                              </>
                            )}
                            <div className="relative z-10 text-sm font-semibold text-white/95">
                              {weapon ? weapon.name : (slotIndex === 0 ? "Main weapon" : "Optional weapon")}
                            </div>
                            {weapon?.tags?.length > 0 ? (
                              <DetailChips
                                items={weapon.tags}
                                className="relative z-10 mt-2"
                                chipClassName="border-amber-200/30 bg-amber-300/10 text-amber-50"
                              />
                            ) : (
                              <div className="relative z-10 mt-2 text-sm text-white/45 leading-relaxed">
                                Press to choose.
                              </div>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  {isFinalizeExpanded && (
                    <div className="mt-2 rounded-2xl border border-white/10 bg-white/[0.03] p-3 md:p-4 flex flex-col gap-3">
                      <button
                        type="button"
                        onClick={() => setIsPersonaInlineOpen((prev) => !prev)}
                        className="mx-auto w-fit text-[11px] uppercase tracking-[0.18em] text-white/75 hover:text-white transition"
                      >
                        {isPersonaInlineOpen ? "Hide Persona" : "Open Persona"}
                      </button>
                      {isPersonaInlineOpen && (
                        <div className="flex flex-col gap-3">
                          <div className="grid gap-3 md:grid-cols-2">
                            <section className="flex flex-col gap-3">
                              <div className="text-sm text-cyan-200/80">{compareRace ? compareRace.name : "No race selected"}</div>
                              <div className="text-sm text-white/90 leading-relaxed">{raceStoryPrompt.question}</div>
                              <textarea
                                value={raceStoryAnswer}
                                onChange={(event) => updateStoryAnswer("race", compareRace?.id, event.target.value)}
                                placeholder="Write a short answer..."
                                className="w-full min-h-[96px] rounded-xl border border-white/15 bg-black/35 px-3 py-2.5 text-sm text-white/90 placeholder:text-white/35 focus:outline-none focus:border-pink-300/80"
                              />
                            </section>
                            <section className="flex flex-col gap-3">
                              <div className="text-sm text-emerald-200/80">{compareClass ? compareClass.name : "No class selected"}</div>
                              <div className="text-sm text-white/90 leading-relaxed">{classStoryPrompt.question}</div>
                              <textarea
                                value={classStoryAnswer}
                                onChange={(event) => updateStoryAnswer("class", compareClass?.id, event.target.value)}
                                placeholder="Write a short answer..."
                                className="w-full min-h-[96px] rounded-xl border border-white/15 bg-black/35 px-3 py-2.5 text-sm text-white/90 placeholder:text-white/35 focus:outline-none focus:border-pink-300/80"
                              />
                            </section>
                          </div>
                          {/* <div className="h-px bg-white/10"></div>
                          <section className="flex flex-col gap-3">
                            <div className="text-sm text-amber-200/80">{selectedBackground ? selectedBackground.name : "No background selected"}</div>
                            <div className="text-sm text-white/90 leading-relaxed">{backgroundStoryPrompt.question}</div>
                            <textarea
                              value={backgroundStoryAnswer}
                              onChange={(event) => updateStoryAnswer("background", selectedBackground?.id, event.target.value)}
                              placeholder={selectedBackground ? "Write a short answer..." : "Pick a background first, then answer here."}
                              className="w-full min-h-[96px] rounded-xl border border-white/15 bg-black/35 px-3 py-2.5 text-sm text-white/90 placeholder:text-white/35 focus:outline-none focus:border-pink-300/80"
                              disabled={!selectedBackground}
                            />
                          </section> */}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const isCompareActiveView = !isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "compare";
      const isCompareExpandedView = isCompareActiveView && isFinalizeExpanded;

      return (
        <div className="relative flex flex-col gap-3 md:gap-6 min-h-[100svh] -mx-2 sm:-mx-4 -my-2 sm:-my-4">
          {isCompareActiveView && (
            <div className="absolute inset-x-0 inset-y-0 lg:-inset-x-10 lg:-inset-y-10 z-0 pointer-events-none overflow-hidden">
              <div className="absolute inset-0">
                <div
                  className="absolute inset-y-0 left-0 w-[68%] md:w-[56%]"
                  style={{
                    WebkitMaskImage: "linear-gradient(to right, black 74%, transparent 100%)",
                    maskImage: "linear-gradient(to right, black 74%, transparent 100%)"
                  }}
                >
                  {backgroundRace && (
                    <QuickFadeCharacterImage
                      item={backgroundRace}
                      kind="race"
                      className="absolute inset-0 w-full h-full object-left contrast-[0.7] brightness-[0.5] saturate-[0.9]"
                    />
                  )}
                </div>
                <div
                  className="absolute inset-y-0 right-0 w-[68%] md:w-[56%]"
                  style={{
                    WebkitMaskImage: "linear-gradient(to left, black 74%, transparent 100%)",
                    maskImage: "linear-gradient(to left, black 74%, transparent 100%)"
                  }}
                >
                  {backgroundClass && (
                    <QuickFadeCharacterImage
                      item={backgroundClass}
                      kind="class"
                      className="absolute inset-0 w-full h-full object-right contrast-[0.7] brightness-[0.5] saturate-[0.9]"
                    />
                  )}
                </div>
              </div>
              <div className="absolute inset-0 bg-black/35"></div>
            </div>
          )}

          {!isCompareExpandedView && (
            <div className="hidden md:block fixed top-5 left-5 z-50">
              <button
                type="button"
                onClick={clearAllSelections}
                className="text-[11px] uppercase tracking-[0.18em] text-white/65 hover:text-white transition"
              >
                Clear options
              </button>
            </div>
          )}
          {!isCompareExpandedView && canOpenFinalize && (
            <div className="hidden md:block fixed top-5 right-5 z-50">
              <button
                type="button"
                disabled={activeStep === "compare"}
                onClick={() => {
                  if (activeStep === "compare") return;
                  setActiveStep("compare");
                }}
                className={`px-6 py-3 rounded-xl bg-pink-500/90 text-white text-[11px] font-semibold uppercase tracking-[0.18em] border border-pink-300/70 shadow-[0_8px_24px_rgba(236,72,153,0.35)] transition ${
                  activeStep === "compare" ? "opacity-50 cursor-not-allowed" : "hover:bg-pink-400"
                }`}
              >
                Finalize
              </button>
            </div>
          )}

          {!isCompareExpandedView && (
          <div className="sticky top-0 md:top-3 z-30 mt-1 md:mt-0 pt-1 md:pt-0 py-0 md:py-2 mb-0">
            <div className="grid md:hidden grid-cols-3 items-center px-4 sm:px-0">
              <div className="flex justify-start">
              <button
                type="button"
                onClick={clearAllSelections}
                className="text-[11px] uppercase tracking-[0.18em] text-white/65 hover:text-white transition"
              >
                Clear options
              </button>
              </div>
              <div />
              <div className="flex justify-end">
                {canOpenFinalize ? (
                  <button
                    type="button"
                    disabled={activeStep === "compare"}
                    onClick={() => {
                      if (activeStep === "compare") return;
                      setActiveStep("compare");
                    }}
                    className={`px-3 py-1.5 rounded-lg bg-pink-500/90 text-white text-[11px] font-semibold uppercase tracking-[0.18em] border border-pink-300/70 shadow-[0_8px_24px_rgba(236,72,153,0.35)] transition ${
                      activeStep === "compare" ? "opacity-50 cursor-not-allowed" : "hover:bg-pink-400"
                    }`}
                  >
                    Finalize
                  </button>
                ) : null}
              </div>
            </div>
            <div className="md:hidden pl-4 pr-4 pt-2 pb-1 -mt-1 -mb-2">
              <div className="flex items-center justify-between gap-1">
                {CHARACTER_FORGE_STEPS.filter((step) => step.id !== "compare").map((step) => {
                  return (
                    <button
                      key={`mobile-${step.id}`}
                      type="button"
                      onClick={() => {
                        setActiveStep(step.id);
                      }}
                      className={`shrink-0 whitespace-nowrap px-4 py-2 rounded-xl text-[11px] font-bold uppercase tracking-[0.14em] border backdrop-blur-xl transition-all ${
                        activeStep === step.id
                          ? "bg-white text-black border-white shadow-[0_0_22px_rgba(255,255,255,0.45)]"
                          : "bg-black/25 text-white/55 border-white/10 hover:bg-black/35 hover:text-white"
                      }`}
                    >
                      {step.label}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="hidden md:flex fixed top-5 left-1/2 -translate-x-1/2 z-40 -mx-2 px-2 py-1 flex-wrap items-center justify-center gap-5">
              {CHARACTER_FORGE_STEPS.filter((step) => step.id !== "compare").map((step) => {
                return (
                  <button
                    key={`desktop-${step.id}`}
                    type="button"
                    onClick={() => {
                      setActiveStep(step.id);
                    }}
                    className={`px-8 py-4 rounded-2xl text-[18px] font-bold uppercase tracking-[0.2em] border backdrop-blur-xl transition-all ${
                      activeStep === step.id
                        ? "bg-white text-black border-white shadow-[0_0_22px_rgba(255,255,255,0.45)] scale-105"
                        : "bg-black/25 text-white/55 border-white/10 hover:bg-black/35 hover:text-white"
                    }`}
                  >
                    {step.label}
                  </button>
                );
              })}
            </div>
          </div>
          )}

          <div className={isCompareActiveView ? "" : "bg-[#13131a]/90 border border-white/5 rounded-3xl px-0 py-4 sm:p-6 panel-glow"}>
            <input
              ref={dataFileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleManualImport}
              className="hidden"
            />

            {isLoading && renderLoadingSkeleton()}

            {!isLoading && loadError && (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-200 rounded-2xl p-4 text-sm flex flex-col gap-3">
                <span>{loadError}</span>
                <div className="flex flex-wrap gap-2">
                  {!isFileProtocol && (
                    <button
                      type="button"
                      onClick={loadData}
                      className="px-4 py-2 rounded-xl border border-rose-300/30 bg-rose-300/10 text-[11px] uppercase tracking-[0.25em] hover:bg-rose-300/20 transition"
                    >
                      Retry
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => dataFileInputRef.current?.click()}
                    className="px-4 py-2 rounded-xl border border-white/20 bg-white/5 text-[11px] uppercase tracking-[0.25em] text-white/90 hover:border-white/40 hover:bg-white/10 transition"
                  >
                    Import Character JSON
                  </button>
                </div>
              </div>
            )}

            {!isLoading && !loadError && (races.length === 0 || classes.length === 0) && (
              <div className="bg-white/5 border border-white/10 rounded-2xl p-4 text-sm text-white/80 flex flex-col gap-3">
                <span>Import character JSON to continue.</span>
                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={() => dataFileInputRef.current?.click()}
                    className="px-4 py-2 rounded-xl border border-white/20 bg-white/5 text-[11px] uppercase tracking-[0.25em] text-white/90 hover:border-white/40 hover:bg-white/10 transition"
                  >
                    Import Character JSON
                  </button>
                </div>
              </div>
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "races" && (
              <CharacterPickerSection
                title="Official races"
                items={visibleRaces}
                selectedIds={selectedRaceIds}
                onOpenItem={(item, rect) => openItemModal("race", item, rect)}
                onToggleItem={(itemId) => toggleSelection("race", itemId)}
                onDeselectItems={(itemIds) => deselectSelections("race", itemIds)}
              />
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "classes" && (
              <CharacterPickerSection
                title="Official classes"
                items={visibleClasses}
                selectedIds={selectedClassIds}
                onOpenItem={(item, rect) => openItemModal("class", item, rect)}
                onToggleItem={(itemId) => toggleSelection("class", itemId)}
                onDeselectItems={(itemIds) => deselectSelections("class", itemIds)}
              />
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "compare" && renderCompare()}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "background" && (
              <BackgroundSelectionSection
                backgrounds={backgrounds}
                selectedBackgroundId={selectedBackgroundId}
                onSelect={setSelectedBackgroundId}
              />
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "weapon" && (
              <WeaponPickerSection
                weapons={weapons}
                selectedWeaponIds={selectedWeaponIds}
                onToggleWeapon={toggleWeaponSelection}
              />
            )}
          </div>

          {modalState && (
            <CharacterItemModal
              item={modalState.item}
              kind={modalState.kind}
              kindLabel={modalState.kind === "race" ? "Race" : "Class"}
              selected={
                modalState.kind === "race"
                  ? selectedRaceIds.includes(modalState.item.id)
                  : selectedClassIds.includes(modalState.item.id)
              }
              originRect={modalState.rect}
              onClose={() => setModalState(null)}
              onToggle={() => {
                toggleSelection(modalState.kind, modalState.item.id);
              }}
            />
          )}

          {removeConfirmState && (
            <CompareRemoveConfirmModal
              item={removeConfirmState.item}
              onCancel={() => setRemoveConfirmState(null)}
              onConfirm={() => {
                toggleSelection(removeConfirmState.kind, removeConfirmState.item.id);
                setRemoveConfirmState(null);
              }}
            />
          )}

          {isStoryModalOpen && (
            <CharacterStoryModal
              raceItem={compareRace}
              classItem={compareClass}
              backgroundItem={selectedBackground}
              racePrompt={raceStoryPrompt}
              classPrompt={classStoryPrompt}
              backgroundPrompt={backgroundStoryPrompt}
              raceAnswer={raceStoryAnswer}
              classAnswer={classStoryAnswer}
              backgroundAnswer={backgroundStoryAnswer}
              onRaceChange={(value) => updateStoryAnswer("race", compareRace?.id, value)}
              onClassChange={(value) => updateStoryAnswer("class", compareClass?.id, value)}
              onBackgroundChange={(value) => updateStoryAnswer("background", selectedBackground?.id, value)}
              onClose={() => setIsStoryModalOpen(false)}
            />
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
