<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
  <script src="data/audio-manifest.js"></script>

  <style>
    :root {
      --bg: #0a0a0f;
      --bg-panel: #13131a;
      --bg-panel-2: #181823;
      --text: #e2e8f0;
      --muted: rgba(226, 232, 240, 0.5);
      --accent: #ec4899;
      --accent-2: #8b5cf6;
      --accent-3: #22d3ee;
      --outline: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      font-family: 'Exo 2', sans-serif;
      background: radial-gradient(circle at 15% 20%, #151525 0%, #0b0b12 40%, #0a0a0f 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .title-font {
      font-family: 'Exo 2', sans-serif;
      letter-spacing: 0.08em;
    }

    .panel-glow {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .ambient-bg {
      background-image:
        radial-gradient(circle at 20% 10%, rgba(236, 72, 153, 0.15), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12), transparent 50%);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0f;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .compare-scroll-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .compare-scroll-hidden::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flash {
      0% { background-color: rgba(255, 255, 255, 0.05); }
      50% { background-color: rgba(255, 255, 255, 0.2); }
      100% { background-color: rgba(255, 255, 255, 0.05); }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease both;
    }

    .animate-flash {
      animation: flash 0.6s ease;
    }

    .gradient-text {
      background: linear-gradient(270deg, #d100ff, #7a00ff, #00c3ff, #d100ff);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 10s linear infinite;
    }

    @keyframes gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes critical-pulse {
      0%, 100% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
      50% { text-shadow: 0 0 40px #00bfff, 0 0 80px #00bfff; }
    }

    .critical-label {
      animation: critical-pulse 2.5s ease-in-out infinite;
    }

    @keyframes breathe-opacity {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }

    .animate-breathe {
      animation: breathe-opacity 4s ease-in-out infinite;
    }

    .ambience-track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr));
      align-items: start;
      gap: 0.75rem;
    }

    .rules-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr));
      gap: 0.75rem;
    }

    .music-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));
      gap: 0.75rem;
    }

    .sfx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
      gap: 0.75rem;
    }
  </style>
</head>

      const hue = Math.abs(hash) % 360;

    const WAVEFORM_PEAK_CACHE = new Map();
    let waveformAudioContext = null;
    const getWaveformAudioContext = () => {
      if (!waveformAudioContext) {
        waveformAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return waveformAudioContext;
    };

    const buildWaveformPeaks = (audioBuffer, peakCount = 220) => {
      const channel = audioBuffer.getChannelData(0);
      const blockSize = Math.max(1, Math.floor(channel.length / peakCount));
      const peaks = [];
      for (let i = 0; i < peakCount; i++) {
        const start = i * blockSize;
        const end = Math.min(channel.length, start + blockSize);
        let peak = 0;
        for (let j = start; j < end; j++) {
          const value = Math.abs(channel[j]);
          if (value > peak) peak = value;
        }
        peaks.push(peak);
      }
      const maxPeak = Math.max(0.01, ...peaks);
      return peaks.map((peak) => peak / maxPeak);
    };

    const MusicWaveform = ({ track, currentTime, duration, onSeek }) => {
      const canvasRef = useRef(null);
      const [peaks, setPeaks] = useState([]);
      const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });

      const seekFromPointer = (event) => {
        if (!track || !duration || !onSeek) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const clientX = event.clientX ?? event.touches?.[0]?.clientX;
        if (clientX === undefined) return;
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        onSeek(ratio * duration);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const updateSize = () => {
          const rect = canvas.getBoundingClientRect();
          setCanvasSize({ width: Math.round(rect.width), height: Math.round(rect.height) });
        };
        updateSize();
        if (!window.ResizeObserver) {
          window.addEventListener("resize", updateSize);
          return () => window.removeEventListener("resize", updateSize);
        }
        const observer = new ResizeObserver(updateSize);
        observer.observe(canvas);
        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        let cancelled = false;
        setPeaks([]);
        if (!track?.file) return;
        const cached = WAVEFORM_PEAK_CACHE.get(track.file);
        if (cached) {
          setPeaks(cached);
          return;
        }

        fetch(resolveAssetUrl(track.file))
          .then((response) => response.arrayBuffer())
          .then((arrayBuffer) => getWaveformAudioContext().decodeAudioData(arrayBuffer))
          .then((audioBuffer) => {
            if (cancelled) return;
            const nextPeaks = buildWaveformPeaks(audioBuffer);
            WAVEFORM_PEAK_CACHE.set(track.file, nextPeaks);
            setPeaks(nextPeaks);
          })
          .catch(() => {
            if (!cancelled) setPeaks([]);
          });

        return () => {
          cancelled = true;
        };
      }, [track?.file]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        const midY = height / 2;
        const sourcePeaks = peaks.length > 0 ? peaks : Array.from({ length: 72 }, (_, index) => 0.18 + (Math.sin(index * 1.7) + 1) * 0.12);
        const progressRatio = duration > 0 ? Math.min(1, Math.max(0, currentTime / duration)) : 0;
        const barGap = Math.max(1, 1.5 * dpr);
        const step = width / sourcePeaks.length;
        const barWidth = Math.max(1, step - barGap);

        const drawBars = (color, clipProgress = null) => {
          ctx.save();
          if (clipProgress !== null) {
            ctx.beginPath();
            ctx.rect(0, 0, width * clipProgress, height);
            ctx.clip();
          }
          ctx.fillStyle = color;
          sourcePeaks.forEach((peak, index) => {
            const barHeight = Math.max(2 * dpr, peak * height * 0.86);
            const x = index * step;
            const y = midY - barHeight / 2;
            ctx.fillRect(x, y, barWidth, barHeight);
          });
          ctx.restore();
        };

        drawBars("rgba(255, 255, 255, 0.18)");
        if (track && progressRatio > 0) {
          drawBars("rgba(236, 72, 153, 0.95)", progressRatio);
        }
      }, [peaks, currentTime, duration, track?.file, canvasSize.width, canvasSize.height]);

      return (
        <div className="h-10 min-w-[10rem] flex-1 overflow-hidden px-1 py-1">
          <canvas
            ref={canvasRef}
            onClick={seekFromPointer}
            className="block h-full w-full cursor-pointer"
            aria-label="Music waveform timeline"
            role="slider"
            aria-valuemin="0"
            aria-valuemax={Math.max(0, duration || 0)}
            aria-valuenow={Math.min(duration || 0, currentTime || 0)}
          />
        </div>
      );
    };

      const ambienceTracks = AUDIO_MANIFEST.ambience || [];

      const audioContextRef = useRef(null);
      const masterGainRef = useRef(null);
      const activeTracksRef = useRef({});
      const volumeResetRef = useRef(null);
      const searchInputRef = useRef(null);

      const [query, setQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("All");
      const [sortMode, setSortMode] = useState("name");
      const [masterVolume, setMasterVolume] = useState(0.7);
      const [activeUrls, setActiveUrls] = useState([]);
      const [pendingUrl, setPendingUrl] = useState(null);
      const [isPaused, setIsPaused] = useState(false);

      useTypeToSearch(isActive, searchInputRef, setQuery);

      useEffect(() => {
        audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
        masterGainRef.current = audioContextRef.current.createGain();
        masterGainRef.current.gain.setValueAtTime(masterVolume, audioContextRef.current.currentTime);
        masterGainRef.current.connect(audioContextRef.current.destination);

        return () => {
          clearInterval(volumeResetRef.current);
          Object.values(activeTracksRef.current).forEach((track) => {
            track.audio.pause();
            try { track.source.disconnect(); } catch (err) {}
          });
          activeTracksRef.current = {};
        };
      }, []);

      useEffect(() => {
        if (audioContextRef.current && masterGainRef.current) {
          masterGainRef.current.gain.setValueAtTime(masterVolume, audioContextRef.current.currentTime);
        }
      }, [masterVolume]);

      const playTrack = async (track) => {
        if (!audioContextRef.current) return;
        if (audioContextRef.current.state === "suspended") await audioContextRef.current.resume();

        setPendingUrl(track.file);
        const audioUrl = resolveAssetUrl(track.file);
        const audio = new Audio();
        if (shouldUseAudioCors(audioUrl)) {
          audio.crossOrigin = "anonymous";
        }
        audio.src = audioUrl;
        audio.loop = true;

        const source = audioContextRef.current.createMediaElementSource(audio);
        const gainNode = audioContextRef.current.createGain();
        gainNode.gain.setValueAtTime(0, audioContextRef.current.currentTime);

        source.connect(gainNode);
        gainNode.connect(masterGainRef.current);

        try {
          await audio.play();
          setIsPaused(false);
          const fadeDuration = 4.5;
          gainNode.gain.linearRampToValueAtTime(1, audioContextRef.current.currentTime + fadeDuration);
          activeTracksRef.current[track.file] = { audio, source, gainNode, title: track.title };
          setActiveUrls(Object.keys(activeTracksRef.current));
          setTimeout(() => setPendingUrl(null), fadeDuration * 1000);
        } catch (err) {
          setPendingUrl(null);
        }
      };

      const stopTrack = (track) => {
        const active = activeTracksRef.current[track.file];
        if (!active) return;
        setPendingUrl(track.file);
        const fadeDuration = 4.5;
        const now = audioContextRef.current.currentTime;
        active.gainNode.gain.cancelScheduledValues(now);
        active.gainNode.gain.setValueAtTime(active.gainNode.gain.value, now);
        active.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);
        setTimeout(() => {
          active.audio.pause();
          active.source.disconnect();
          delete activeTracksRef.current[track.file];
          setActiveUrls(Object.keys(activeTracksRef.current));
          setPendingUrl(null);
        }, fadeDuration * 1000);
      };

      const stopAll = () => {
        Object.keys(activeTracksRef.current).forEach((url) => {
          stopTrack({ file: url });
        });
        setIsPaused(false);
      };

      const pauseOrResumeAll = async () => {
        if (activeUrls.length === 0) return;
        if (!audioContextRef.current) return;
        if (audioContextRef.current.state === "suspended") await audioContextRef.current.resume();

        const fadeDuration = 1.5;
        const now = audioContextRef.current.currentTime;
        if (!isPaused) {
          Object.values(activeTracksRef.current).forEach((track) => {
            track.gainNode.gain.cancelScheduledValues(now);
            track.gainNode.gain.setValueAtTime(track.gainNode.gain.value, now);
            track.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);
          });
          setIsPaused(true);
          return;
        }

        Object.values(activeTracksRef.current).forEach(async (track) => {
          try {
            await track.audio.play();
          } catch (err) {}
          const resumeNow = audioContextRef.current.currentTime;
          track.gainNode.gain.cancelScheduledValues(resumeNow);
          track.gainNode.gain.setValueAtTime(track.gainNode.gain.value, resumeNow);
          track.gainNode.gain.linearRampToValueAtTime(1, resumeNow + fadeDuration);
        });
        setIsPaused(false);
      };

      useEffect(() => {
        if (!isActive) return;
        const handleKeyDown = (event) => {
          if (event.code !== "Space" || isTypingTarget(event.target) || event.ctrlKey || event.metaKey || event.altKey) return;
          event.preventDefault();
          pauseOrResumeAll();
        };
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, [isActive, activeUrls, isPaused]);

      const resetMasterVolume = (event) => {
        event.preventDefault();
        clearInterval(volumeResetRef.current);
        volumeResetRef.current = animateNumber(masterVolume, 0.7, setMasterVolume);
      };

      const visibleTracks = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        const filtered = ambienceTracks.filter((track) => {
          const matchesCategory = activeCategory === "All" || (track.tags || []).includes(activeCategory);
          const matchesQuery =
            !normalizedQuery ||
            `${track.title} ${track.fileName} ${(track.tags || []).join(" ")}`.toLowerCase().includes(normalizedQuery);
          return matchesCategory && matchesQuery;
        });
        return [...filtered].sort((a, b) => {
          if (sortMode === "latest") return (b.modifiedAt || 0) - (a.modifiedAt || 0);
          return a.title.localeCompare(b.title);
        });
      }, [ambienceTracks, query, activeCategory, sortMode]);

      return (
        <div className="h-[calc(100vh-1.5rem)] flex flex-col gap-3 sm:gap-4">
          <div className="flex flex-col gap-3">
            <PageTopBar onOpenSidebar={onOpenSidebar}>
              <SearchInput
                value={query}
                onChange={setQuery}
                placeholder="Search ambience..."
                className="min-w-[12rem] flex-1"
                inputRef={searchInputRef}
              />
              <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            </PageTopBar>
            <div className="flex min-h-[4.75rem] items-center gap-2 overflow-x-auto custom-scrollbar py-4">
              {["All", ...categories].map((category) => (
                <CategoryTabButton
                  key={category}
                  label={category}
                  active={activeCategory === category}
                  onClick={() => setActiveCategory(category)}
                />
              ))}
            </div>
          </div>

          <div className="music-list-grid flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1 pb-24">
            {visibleTracks.length === 0 && (
              <div className="rounded-xl border border-white/5 bg-[#13131a]/90 p-4 text-sm text-white/40">
                No ambience found.
              </div>
            )}
            {visibleTracks.map((track) => {
              const isActive = activeUrls.includes(track.file);
              const isPending = pendingUrl === track.file;
              return (
                <button
                  key={track.file}
                  onClick={() => (isActive ? stopTrack(track) : playTrack(track))}
                  disabled={isPending}
                  className={`text-left rounded-xl border p-2.5 transition ${
                    isActive
                      ? "bg-gradient-to-br from-pink-600/80 via-purple-600/80 to-indigo-600/80 text-white border-transparent shadow-lg shadow-pink-500/20"
                      : "bg-[#13131a]/90 border-white/5 text-white/80 hover:bg-white/10"
                  } ${isPending ? "opacity-70 cursor-wait" : ""}`}
                >
                  <div className="text-sm font-semibold leading-tight break-words">{track.title}</div>
                  {(track.tags || []).length > 0 && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      {track.tags.map((tag) => (
                        <TagPill key={tag} tag={tag} className="break-words" />
                      ))}
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          <div className="fixed bottom-0 left-0 right-0 z-30 border-t border-white/10 bg-[#0d0d14]/95 p-3 sm:p-4">
            <div className="mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center">
              <div className="min-w-0 flex-1">
                <div className="truncate text-sm font-semibold text-white/90">
                  {activeUrls.length > 0 ? `${activeUrls.length} layer${activeUrls.length === 1 ? "" : "s"} playing` : "No ambience playing"}
                </div>
                {activeUrls.length > 0 && (
                  <div className="mt-1 flex gap-1 overflow-x-auto custom-scrollbar pb-1">
                    {activeUrls.map((url) => {
                      const track = ambienceTracks.find((item) => item.file === url);
                      return (
                        <span key={url} className="shrink-0 rounded bg-white/5 px-2 py-0.5 text-[10px] text-white/50">
                          {track ? track.title : "Track"}
                        </span>
                      );
                    })}
                  </div>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-2 sm:gap-5">
                <button
                  type="button"
                  onClick={pauseOrResumeAll}
                  disabled={activeUrls.length === 0}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white disabled:opacity-40"
                  aria-label={isPaused ? "Play ambience" : "Pause ambience"}
                  title={isPaused ? "Play" : "Pause"}
                >
                  {isPaused ? <IconPlayerPlay className="h-5 w-5" /> : <IconPlayerPause className="h-5 w-5" />}
                </button>
                <button
                  onClick={stopAll}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white"
                  aria-label="Stop ambience"
                  title="Stop"
                >
                  <IconPlayerStop className="h-5 w-5" />
                </button>
                <div className="flex items-center gap-1.5">
                  <input
                    aria-label="Ambience volume"
                    onContextMenu={resetMasterVolume}
                    type="range"
                    min="0"
                    max="100"
                    value={Math.round(masterVolume * 100)}
                    onChange={(e) => setMasterVolume(Number(e.target.value) / 100)}
                    className="w-32 accent-pink-500"
                  />
                  <span className="w-10 text-right text-xs text-white/50">{Math.round(masterVolume * 100)}%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MusicPanel = ({ onOpenSidebar, isActive, onActivate }) => {
      const musicTracks = AUDIO_MANIFEST.music || [];
      const categories = AUDIO_MANIFEST.musicCategories || [];
      const activeAudioRef = useRef(null);
      const incomingAudioRef = useRef(null);
      const musicAudiosRef = useRef(new Set());
      const timeoutsRef = useRef([]);
      const controlResetTimersRef = useRef({});
      const loopCrossfadeRef = useRef(false);
      const transitionIdRef = useRef(0);
      const searchInputRef = useRef(null);
      const linkCopyResetRef = useRef(null);
      const [query, setQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("All");
      const [sortMode, setSortMode] = useState("name");
      const [currentFolder, setCurrentFolder] = useState("");
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [volume, setVolume] = useState(0.75);
      const [tune, setTune] = useState(1);
      const volumeRef = useRef(volume);
      const tuneRef = useRef(tune);
      const [musicProgress, setMusicProgress] = useState({ currentTime: 0, duration: 0 });
      const [copiedTrackFile, setCopiedTrackFile] = useState("");
      const [musicTagOverrides, setMusicTagOverrides] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("dm_music_tag_overrides_v1"));
          return saved && typeof saved === "object" ? saved : {};
        } catch (err) {
          return {};
        }
      });
      const [tagEditor, setTagEditor] = useState(null);
      const [selectedTag, setSelectedTag] = useState(null);

      useTypeToSearch(isActive, searchInputRef, setQuery);

      useEffect(() => {
        const id = setTimeout(() => {
          try {
            localStorage.setItem("dm_music_tag_overrides_v1", JSON.stringify(musicTagOverrides));
          } catch (err) {}
        }, 300);
        return () => clearTimeout(id);
      }, [musicTagOverrides]);

      const getTrackTags = (track) => {
        if (!track) return [];
        return musicTagOverrides[track.file] || track.tags || [];
      };

      const knownTags = useMemo(() => {
        const tags = new Set(categories);
        musicTracks.forEach((track) => {
          (track.tags || []).forEach((tag) => tags.add(tag));
          (musicTagOverrides[track.file] || []).forEach((tag) => tags.add(tag));
        });
        const orderedBuiltIns = categories.filter((tag) => tags.has(tag));
        const customTags = [...tags]
          .filter((tag) => tag && !categories.includes(tag))
          .sort((a, b) => a.localeCompare(b));
        return [...orderedBuiltIns, ...customTags];
      }, [categories, musicTracks, musicTagOverrides]);

      const clearTransitionTimers = () => {
        timeoutsRef.current.forEach((id) => {
          clearTimeout(id);
          clearInterval(id);
        });
        timeoutsRef.current = [];
      };

      const clearControlResetTimers = () => {
        Object.values(controlResetTimersRef.current).forEach((id) => clearInterval(id));
        controlResetTimersRef.current = {};
      };

      const stopAudio = (audio) => {
        if (!audio) return;
        audio._dmStopped = true;
        if (audio._dmFadeInterval) {
          clearInterval(audio._dmFadeInterval);
          audio._dmFadeInterval = null;
        }
        if (audio._dmLoopTimer) {
          clearTimeout(audio._dmLoopTimer);
          audio._dmLoopTimer = null;
        }
        if (audio._dmLoopHandler) {
          audio.removeEventListener("timeupdate", audio._dmLoopHandler);
          audio._dmLoopHandler = null;
        }
        if (audio._dmLoadedMetadataHandler) {
          audio.removeEventListener("loadedmetadata", audio._dmLoadedMetadataHandler);
          audio._dmLoadedMetadataHandler = null;
        }
        if (audio._dmPlayHandler) {
          audio.removeEventListener("play", audio._dmPlayHandler);
          audio._dmPlayHandler = null;
        }
        if (audio._dmSeekedHandler) {
          audio.removeEventListener("seeked", audio._dmSeekedHandler);
          audio._dmSeekedHandler = null;
        }
        if (audio._dmEndedHandler) {
          audio.removeEventListener("ended", audio._dmEndedHandler);
          audio._dmEndedHandler = null;
        }
        audio.pause();
        audio.src = "";
        musicAudiosRef.current.delete(audio);
        if (activeAudioRef.current === audio) activeAudioRef.current = null;
        if (incomingAudioRef.current === audio) incomingAudioRef.current = null;
      };

      const applyTune = (audio, nextTune) => {
        if (!audio) return;
        audio.playbackRate = nextTune;
        audio.preservesPitch = false;
        audio.mozPreservesPitch = false;
        audio.webkitPreservesPitch = false;
      };

      useEffect(() => {
        return () => {
          transitionIdRef.current += 1;
          clearTransitionTimers();
          clearControlResetTimers();
          clearTimeout(linkCopyResetRef.current);
          [...musicAudiosRef.current].forEach(stopAudio);
        };
      }, []);

      const resetControl = (event, key, currentValue, targetValue, setter) => {
        event.preventDefault();
        clearInterval(controlResetTimersRef.current[key]);
        controlResetTimersRef.current[key] = animateNumber(currentValue, targetValue, setter);
      };

      useEffect(() => {
        volumeRef.current = volume;
        const activeAudio = activeAudioRef.current;
        if (activeAudio && isPlaying && !isTransitioning && !activeAudio._dmFadeInterval) {
          activeAudio.volume = volume;
        }
      }, [volume, isPlaying, isTransitioning]);

      useEffect(() => {
        tuneRef.current = tune;
        applyTune(activeAudioRef.current, tune);
        applyTune(incomingAudioRef.current, tune);
        activeAudioRef.current?._dmScheduleLoopCrossfade?.();
      }, [tune]);

      useEffect(() => {
        if (!currentTrack) {
          setMusicProgress({ currentTime: 0, duration: 0 });
          return;
        }

        const updateProgress = () => {
          const audio = activeAudioRef.current || incomingAudioRef.current;
          const currentTime = audio?.currentTime || 0;
          const duration = Number.isFinite(audio?.duration) ? audio.duration : 0;
          setMusicProgress((prev) => {
            const nextCurrent = Math.round(currentTime * 10) / 10;
            const nextDuration = Math.round(duration * 10) / 10;
            if (prev.currentTime === nextCurrent && prev.duration === nextDuration) return prev;
            return { currentTime: nextCurrent, duration: nextDuration };
          });
        };

        updateProgress();
        const interval = setInterval(updateProgress, 150);
        return () => clearInterval(interval);
      }, [currentTrack, isPlaying, isTransitioning]);

      const fadeVolume = (audio, from, to, durationMs, onDone) => {
        if (!audio || audio._dmStopped) return;
        clearInterval(audio._dmFadeInterval);
        const start = Date.now();
        audio.volume = from;

        const interval = setInterval(() => {
          if (audio._dmStopped) {
            clearInterval(interval);
            if (audio._dmFadeInterval === interval) audio._dmFadeInterval = null;
            return;
          }
          const progress = Math.min(1, (Date.now() - start) / durationMs);
          audio.volume = from + (to - from) * progress;
          if (progress >= 1) {
            clearInterval(interval);
            if (audio._dmFadeInterval === interval) audio._dmFadeInterval = null;
            if (onDone) onDone();
          }
        }, 50);
        audio._dmFadeInterval = interval;
      };

      const createMusicAudio = (track) => {
        const audio = new Audio(resolveAssetUrl(track.file));
        audio.loop = false;
        audio.volume = 0;
        applyTune(audio, tuneRef.current);
        audio._dmTrack = track;
        audio._dmStopped = false;
        musicAudiosRef.current.add(audio);
        const loopFadeDuration = 2000;
        const getWallMsUntilEnd = () => {
          const playbackRate = Number.isFinite(audio.playbackRate) && audio.playbackRate > 0 ? audio.playbackRate : 1;
          return ((audio.duration - audio.currentTime) * 1000) / playbackRate;
        };
        const scheduleLoopCrossfade = () => {
          clearTimeout(audio._dmLoopTimer);
          if (audio._dmStopped || activeAudioRef.current !== audio) return;
          if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
          const msUntilFade = Math.max(0, getWallMsUntilEnd() - loopFadeDuration);
          audio._dmLoopTimer = setTimeout(() => startLoopCrossfade(false), msUntilFade);
        };
        audio._dmScheduleLoopCrossfade = scheduleLoopCrossfade;
        const startLoopCrossfade = (fallback = false) => {
          if (loopCrossfadeRef.current || activeAudioRef.current !== audio) return;
          if (!fallback && Number.isFinite(audio.duration) && getWallMsUntilEnd() > loopFadeDuration + 120) return;

          const transitionId = transitionIdRef.current;
          loopCrossfadeRef.current = true;
          const nextAudio = createMusicAudio(track);
          incomingAudioRef.current = nextAudio;

          nextAudio.play().then(() => {
            if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== nextAudio) {
              stopAudio(nextAudio);
              return;
            }
            const fadeDuration = loopFadeDuration;
            activeAudioRef.current = nextAudio;
            nextAudio._dmScheduleLoopCrossfade?.();
            fadeVolume(audio, audio.volume, 0, fadeDuration, () => stopAudio(audio));
            fadeVolume(nextAudio, 0, volumeRef.current, fadeDuration, () => {
              if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== nextAudio) {
                stopAudio(nextAudio);
                return;
              }
              incomingAudioRef.current = null;
              loopCrossfadeRef.current = false;
            });
          }).catch(() => {
            if (transitionId !== transitionIdRef.current) {
              stopAudio(nextAudio);
              return;
            }
            incomingAudioRef.current = null;
            loopCrossfadeRef.current = false;
            audio.currentTime = 0;
            audio.volume = volumeRef.current;
            audio.play().catch(() => {});
          });
        };
        audio._dmLoopHandler = () => {
          scheduleLoopCrossfade();
        };
        audio._dmLoadedMetadataHandler = scheduleLoopCrossfade;
        audio._dmPlayHandler = scheduleLoopCrossfade;
        audio._dmSeekedHandler = scheduleLoopCrossfade;
        audio._dmEndedHandler = () => {
          startLoopCrossfade(true);
        };
        audio.addEventListener("loadedmetadata", audio._dmLoadedMetadataHandler);
        audio.addEventListener("play", audio._dmPlayHandler);
        audio.addEventListener("seeked", audio._dmSeekedHandler);
        audio.addEventListener("timeupdate", audio._dmLoopHandler);
        audio.addEventListener("ended", audio._dmEndedHandler);
        return audio;
      };

      const playTrack = (track) => {
        const transitionId = transitionIdRef.current + 1;
        transitionIdRef.current = transitionId;
        clearTransitionTimers();
        loopCrossfadeRef.current = false;
        setIsTransitioning(true);
        setCurrentTrack(track);

        if (incomingAudioRef.current) {
          stopAudio(incomingAudioRef.current);
          incomingAudioRef.current = null;
        }

        activeAudioRef.current = null;
        const incoming = createMusicAudio(track);
        incomingAudioRef.current = incoming;
        const outgoingAudios = [...musicAudiosRef.current].filter((audio) => audio !== incoming);
        outgoingAudios.forEach((audio) => {
          fadeVolume(audio, audio.volume, 0, 4000, () => stopAudio(audio));
        });

        const startIncomingTimer = setTimeout(async () => {
          if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
            stopAudio(incoming);
            return;
          }
          try {
            await incoming.play();
            if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
              stopAudio(incoming);
              return;
            }
            activeAudioRef.current = incoming;
            incoming._dmScheduleLoopCrossfade?.();
            fadeVolume(incoming, 0, volumeRef.current, 4000, () => {
              if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
                stopAudio(incoming);
                return;
              }
              incomingAudioRef.current = null;
              setCurrentTrack(track);
              setIsPlaying(true);
              setIsTransitioning(false);
            });
          } catch (err) {
            stopAudio(incoming);
            setIsTransitioning(false);
          }
        }, outgoingAudios.length > 0 ? 2000 : 0);
        timeoutsRef.current.push(startIncomingTimer);
      };

      const pauseOrResume = async () => {
        const audio = activeAudioRef.current;
        const incoming = incomingAudioRef.current;

        if (isPlaying || isTransitioning) {
          transitionIdRef.current += 1;
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          const preferredAudio = incoming && currentTrack && incoming._dmTrack?.file === currentTrack.file ? incoming : audio;
          [...musicAudiosRef.current].forEach((item) => {
            fadeVolume(item, item.volume, 0, 4000, () => {
              if (item === preferredAudio) {
                item.pause();
                return;
              }
              stopAudio(item);
            });
          });
          activeAudioRef.current = preferredAudio || null;
          incomingAudioRef.current = null;
          setIsPlaying(false);
          setIsTransitioning(false);
          return;
        }

        if (!audio && currentTrack) {
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          playTrack(currentTrack);
          return;
        }

        if (!audio) return;

        try {
          const transitionId = transitionIdRef.current + 1;
          transitionIdRef.current = transitionId;
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          const resumeVolume = audio.volume;
          audio.volume = resumeVolume;
          setIsTransitioning(true);
          await audio.play();
          if (transitionId !== transitionIdRef.current || activeAudioRef.current !== audio) return;
          fadeVolume(audio, resumeVolume, volumeRef.current, 4000, () => {
            if (transitionId !== transitionIdRef.current || activeAudioRef.current !== audio) return;
            setIsTransitioning(false);
          });
          setIsPlaying(true);
        } catch (err) {
          setIsTransitioning(false);
        }
      };

      useEffect(() => {
        if (!isActive) return;
        const handleKeyDown = (event) => {
          if (event.code !== "Space" || isTypingTarget(event.target) || event.ctrlKey || event.metaKey || event.altKey) return;
          event.preventDefault();
          pauseOrResume();
        };
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, [isActive, isPlaying, isTransitioning, currentTrack, volume]);

      const stopMusic = () => {
        transitionIdRef.current += 1;
        clearTransitionTimers();
        loopCrossfadeRef.current = false;
        const audios = [...musicAudiosRef.current];
        audios.forEach((audio) => {
          fadeVolume(audio, audio.volume, 0, 4000, () => stopAudio(audio));
        });

        activeAudioRef.current = null;
        incomingAudioRef.current = null;
        setIsPlaying(false);
        setIsTransitioning(false);
        setCurrentTrack(null);
      };

      const normalizeMusicReference = (value) => {
        if (!value) return "";
        const normalized = String(value).replace(/\\/g, "/");
        try {
          return decodeURIComponent(normalized).toLowerCase();
        } catch (err) {
          return normalized.toLowerCase();
        }
      };

      const matchesMusicCommand = (track, reference) => {
        const normalizedReference = normalizeMusicReference(reference);
        if (!normalizedReference) return false;
        const relativeFile = `${track.folderPath ? `${track.folderPath}/` : ""}${track.fileName}`;
        return [track.file, relativeFile, track.fileName]
          .map(normalizeMusicReference)
          .some((candidate) => candidate === normalizedReference || candidate.endsWith(`/${normalizedReference}`));
      };

      const escapeMarkdownLinkText = (value) => String(value || "").replace(/([\\[\]])/g, "\\$1");

      const buildMusicObsidianLink = (track) => {
        let decodedFile = track.file;
        try {
          decodedFile = decodeURIComponent(track.file);
        } catch (err) {}
        return `[Play: ${escapeMarkdownLinkText(track.title)}](dmtool://music/play?file=${encodeURIComponent(decodedFile)})`;
      };

      const copyMusicObsidianLink = async (event, track) => {
        event.preventDefault();
        event.stopPropagation();
        const link = buildMusicObsidianLink(track);
        try {
          await copyTextToClipboard(link);
          setCopiedTrackFile(track.file);
          clearTimeout(linkCopyResetRef.current);
          linkCopyResetRef.current = setTimeout(() => setCopiedTrackFile(""), 1400);
        } catch (err) {
          console.warn("Unable to copy music link.", err);
        }
      };

      useEffect(() => {
        if (!window.dmDesktop?.onMusicCommand) return;
        const unsubscribe = window.dmDesktop.onMusicCommand((command) => {
          if (!command || command.type !== "play" || !command.file) return;
          const track = musicTracks.find((item) => matchesMusicCommand(item, command.file));
          if (!track) return;
          onActivate?.();
          setQuery("");
          setActiveCategory("All");
          setCurrentFolder(track.folderPath || "");
          playTrack(track);
        });
        return unsubscribe;
      }, [musicTracks, onActivate, volume, tune]);

      const seekMusic = (nextTime) => {
        const audio = activeAudioRef.current || incomingAudioRef.current;
        if (!audio || !Number.isFinite(audio.duration)) return;
        const boundedTime = Math.min(Math.max(nextTime, 0), Math.max(0, audio.duration - 0.05));
        audio.currentTime = boundedTime;
        setMusicProgress({ currentTime: Math.round(boundedTime * 10) / 10, duration: Math.round(audio.duration * 10) / 10 });
      };

      const folderBrowserActive = activeCategory === "All" && query.trim().length === 0;
      const folderLabel = currentFolder ? currentFolder.split("/").pop() : "Music";
      const currentParentFolder = currentFolder.split("/").slice(0, -1).join("/");

      const visibleFolders = useMemo(() => {
        if (!folderBrowserActive) return [];
        const folderNames = new Set();
        const prefix = currentFolder ? `${currentFolder}/` : "";

        musicTracks.forEach((track) => {
          const folderPath = track.folderPath || "";
          if (!folderPath.startsWith(prefix) || folderPath === currentFolder) return;
          const remaining = folderPath.slice(prefix.length);
          const folderName = remaining.split("/")[0];
          if (folderName) folderNames.add(folderName);

        const latestForFolder = (name) => {
          const folderPath = currentFolder ? `${currentFolder}/${name}` : name;
          return Math.max(0, ...musicTracks
            .filter((track) => (track.folderPath || "").startsWith(folderPath))
            .map((track) => track.modifiedAt || 0));
        };

        return [...folderNames]
          .sort((a, b) => sortMode === "latest" ? latestForFolder(b) - latestForFolder(a) : a.localeCompare(b))
          .map((name) => ({
            name,
            path: currentFolder ? `${currentFolder}/${name}` : name
          }));
      }, [folderBrowserActive, musicTracks, currentFolder, sortMode]);

      const visibleTracks = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        if (folderBrowserActive) {
          return musicTracks
            .filter((track) => (track.folderPath || "") === currentFolder)
            .sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
        }

        const filtered = musicTracks.filter((track) => {
          const trackTags = getTrackTags(track);
          const matchesCategory = activeCategory === "All" || trackTags.includes(activeCategory);
          const matchesQuery =
            !normalizedQuery ||
            `${track.title} ${track.fileName} ${track.folderPath || ""} ${trackTags.join(" ")}`.toLowerCase().includes(normalizedQuery);
          return matchesCategory && matchesQuery;
        });
        return [...filtered].sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
      }, [musicTracks, query, activeCategory, folderBrowserActive, currentFolder, musicTagOverrides, sortMode]);

      const currentTags = getTrackTags(currentTrack);
      const openTagEditor = (mode, originalTag = "") => {

        setSelectedTag(null);
        setTagEditor({ mode, originalTag, value: originalTag });

      const tagSuggestion = tagEditor?.value
        ? knownTags.find((tag) => tag.toLowerCase().startsWith(tagEditor.value.toLowerCase()) && tag.toLowerCase() !== tagEditor.value.toLowerCase())
        : "";
      const saveTag = () => {
        if (!currentTrack || !tagEditor) return;
        const nextTag = tagEditor.value.trim();
        if (!nextTag) return;

        const baseTags = getTrackTags(currentTrack);
        const nextTags = tagEditor.mode === "edit"
          ? baseTags.map((tag) => (tag === tagEditor.originalTag ? nextTag : tag))

        const uniqueTags = [...new Set(nextTags.map((tag) => tag.trim()).filter(Boolean))];
        setMusicTagOverrides((prev) => ({ ...prev, [currentTrack.file]: uniqueTags }));
        setTagEditor(null);

      const deleteTag = (tagToDelete) => {
        if (!currentTrack) return;
        const nextTags = getTrackTags(currentTrack).filter((tag) => tag !== tagToDelete);

      return (

            <PageTopBar onOpenSidebar={onOpenSidebar}>

                className="min-w-[12rem] flex-1"
                inputRef={searchInputRef}

              <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            </PageTopBar>
            <div className="flex min-h-[4.75rem] items-center gap-2 overflow-x-auto custom-scrollbar py-4">
              {["All", ...knownTags].map((category) => (
                <CategoryTabButton

            {folderBrowserActive && currentFolder && (

              >
                <div className="flex items-center gap-2 text-sm font-semibold leading-tight">
                  <IconArrowLeft className="h-5 w-5 shrink-0" />

            {visibleFolders.map((folder) => (

            {visibleTracks.map((track) => {

          </div>

          <div className="fixed bottom-0 left-0 right-0 z-30 border-t border-white/10 bg-[#0d0d14]/95 p-3 sm:p-4">
            <div className="mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center">
              <div className="min-w-0 flex-1">

                  <input

                  <span className="w-10 text-right text-xs text-white/50">{Math.round(volume * 100)}%</span>

                <div className="flex items-center gap-1.5">
                  <input

                  />
                  <span className="w-12 text-right text-xs text-white/50">{tune.toFixed(2)}x</span>
                </div>
                <MusicWaveform
                  track={currentTrack}

                <button

                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white"
                  aria-label="Stop music"

                <button

                  aria-label={isPlaying ? "Pause music" : "Play music"}

          {tagEditor && (

                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-3 text-sm font-semibold text-white/80">{tagEditor.mode === "edit" ? "Edit tag" : "Add tag"}</div>
                <div className="relative">
                  {tagSuggestion && (
                    <div className="pointer-events-none absolute inset-0 rounded-lg border border-transparent bg-black/35 px-3 py-2 text-sm text-transparent">
                      <span>{tagEditor.value}</span>
                      <span className="text-white/25">{tagSuggestion.slice(tagEditor.value.length)}</span>
                    </div>
                  )}
                  <input
                    autoFocus
                    value={tagEditor.value}
                    onChange={(event) => setTagEditor((prev) => ({ ...prev, value: event.target.value }))}
                    onKeyDown={(event) => {
                      if (event.key === "Tab" && tagSuggestion) {
                        event.preventDefault();
                        setTagEditor((prev) => ({ ...prev, value: tagSuggestion }));
                      }
                      if (event.key === "Enter") {
                        event.preventDefault();
                        saveTag();
                      }
                      if (event.key === "Escape") {
                        event.preventDefault();
                        setTagEditor(null);
                      }
                    }}
                    className="relative w-full rounded-lg border border-white/10 bg-transparent px-3 py-2 text-sm text-white/85 outline-none transition focus:border-pink-500"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const SfxPanel = ({ onOpenSidebar, isActive }) => {
      const sfxItems = AUDIO_MANIFEST.sfx || [];
      const volumeResetRef = useRef(null);
      const searchInputRef = useRef(null);
      const [volume, setVolume] = useState(0.8);
      const [query, setQuery] = useState("");
      const [sortMode, setSortMode] = useState("name");

      useTypeToSearch(isActive, searchInputRef, setQuery);

      useEffect(() => {
        return () => clearInterval(volumeResetRef.current);
      }, []);

      const visibleItems = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        const filtered = normalizedQuery
          ? sfxItems.filter((item) => `${item.title} ${item.fileName}`.toLowerCase().includes(normalizedQuery))
          : sfxItems;
        return [...filtered].sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
      }, [sfxItems, query, sortMode]);

      const playSfx = async (item) => {
        const audio = new Audio(resolveAssetUrl(item.file));
        audio.volume = volume;
        try {
          await audio.play();
        } catch (err) {}
      };

      const resetVolume = (event) => {

      return (

          <PageTopBar onOpenSidebar={onOpenSidebar}>

              onChange={setQuery}
              placeholder="Search SFX..."
              className="min-w-[12rem] flex-1"
              inputRef={searchInputRef}
            />
            <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            <div className="flex items-center gap-2 rounded-lg bg-[#13131a]/90 border border-white/10 px-3 py-2">
              <input
                aria-label="SFX volume"
                onContextMenu={resetVolume}
                type="range"
                min="0"
                max="100"
                value={Math.round(volume * 100)}
                onChange={(e) => setVolume(Number(e.target.value) / 100)}
                className="w-32 accent-pink-500"
              />
              <span className="w-10 text-right text-xs text-white/50">{Math.round(volume * 100)}%</span>
            </div>
          </PageTopBar>

          <div className="sfx-grid flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1">
            {visibleItems.map((item) => (
              <button
                key={item.file}
                onClick={() => playSfx(item)}
                className="aspect-square rounded-xl border border-white/5 bg-[#13131a]/90 p-2 text-sm font-semibold leading-tight text-white/80 transition hover:bg-white/10 hover:text-white"
              >
                <span className="line-clamp-4 break-words">{item.title}</span>
              </button>
            ))}
          </div>
        </div>
      );
    };

    const LootRollerPanel = ({ onOpenSidebar }) => {
      const [instantRoll, setInstantRoll] = useState(() => localStorage.getItem("loot_roller_instant_roll") === "true");
      const [showSettings, setShowSettings] = useState(false);
      const [activeTab, setActiveTab] = useState("Random");
      const [activeRarity, setActiveRarity] = useState("Any");
      const [activeTheme, setActiveTheme] = useState(() => {
        const savedTheme = localStorage.getItem("loot_roller_theme") || "any";
        return LOOT_THEME_BY_ID[savedTheme] ? savedTheme : "any";
      });
      const [rollAmount, setRollAmount] = useState(1);
      const [luckAmount, setLuckAmount] = useState(() => Math.max(1, Math.min(10, parseInt(localStorage.getItem("loot_roller_luck") || "1", 10) || 1)));
      const [history, setHistory] = useState([]);
      const [expandedId, setExpandedId] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [rollingItem, setRollingItem] = useState(null);
      const [bgFlash, setBgFlash] = useState(null);
      const [allItems, setAllItems] = useState([]);
      const [isLoaded, setIsLoaded] = useState(false);
      const [loadProgress, setLoadProgress] = useState(0);
      const [error, setError] = useState(null);
      const [failedTabs, setFailedTabs] = useState([]);
      const [loadingStatusText, setLoadingStatusText] = useState("");

      const stopRollingRef = useRef(false);
      const currentIntervalRef = useRef(null);
      const flashTimeoutRef = useRef(null);
      const flashClearTimeoutRef = useRef(null);
      useEffect(() => { loadData(false); }, []);

      const normalizeItem = (rawItem, category) => {
        const rarity = normalizeRarity(rawItem.rarity || rawItem.Rarity);
        const tags = new Set(inferLootTags(rawItem, category));
        addLootTag(tags, rarity);

        return {
          name: rawItem.name || rawItem.Name || "Unknown",
          rarity,
          description: rawItem.description || rawItem.Description || rawItem.desc || "",
          value: parseInt((rawItem.value || rawItem.Value || "0").toString().replace(/\D/g, "")) || 0,
          category,
          tags: Array.from(tags).sort(),
          id: Math.random().toString(36).substr(2, 9)
        };
      };

      const loadData = async (forceRefresh = false) => {
        setIsLoaded(false); setLoadProgress(0); setError(null); setFailedTabs([]);
        try {
          setLoadingStatusText("Loading internal tables...");
          setLoadProgress(25);
          const data = await loadInternalLootTables(forceRefresh);
          setLoadingStatusText("Processing Data...");
          setLoadProgress(70);
          processAndFinish(data);
          return;
        } catch (err) {
          setError("Could not load internal loot tables. Using Demo Data.");
        }

        finishLoad(FALLBACK_ITEMS);
      };

      const loadInternalLootTables = async (forceRefresh = false) => {
        if (window.dmDesktop?.lootTables?.get) {
          return await window.dmDesktop.lootTables.get();
        }

        const response = await fetch(resolveAssetUrl(LOOT_TABLES_PATH), {
          cache: forceRefresh ? "reload" : "default"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      };

      const processAndFinish = (data, cacheKey) => {
        const processed = [];
        const content = data.contents ? JSON.parse(data.contents) : data;
        Object.keys(content).forEach((cat) => {
          if (Array.isArray(content[cat])) {
            content[cat].forEach((item) => processed.push(normalizeItem(item, cat)));
          }
        });
        if (processed.length === 0) throw new Error("No loot items found");
        finishLoad(processed, [], cacheKey);
      };

      const finishLoad = (items, failed = [], cacheKey = null) => {
        setAllItems(items);
        setFailedTabs(failed);
        setIsLoaded(true);
        setLoadProgress(100);
        if (cacheKey) {
          localStorage.setItem(cacheKey, JSON.stringify(items));
        }
      };

      const saveSettings = (nextInstantRoll) => {
        localStorage.setItem("loot_roller_instant_roll", String(nextInstantRoll));
        setShowSettings(false);
      };

      const handleThemeChange = (nextTheme) => {
        localStorage.setItem("loot_roller_theme", nextTheme);
        setActiveTheme(nextTheme);
      };

      const getPool = () => {
        let pool = allItems;
        if (activeTab !== "Random") {
          if (activeTab === "Equipment") {
            pool = allItems.filter((item) => item.category === "Weapons" || item.category === "Armor");
          } else {
            pool = allItems.filter((item) => item.category === activeTab);
          }
        }
        if (activeRarity !== "Any") {
          const selected = normalizeRarity(activeRarity);
          pool = pool.filter((item) => normalizeRarity(item.rarity) === selected);
        }
        return pool;
      };

      const getThemeProfile = () => LOOT_THEME_BY_ID[activeTheme] || LOOT_THEME_BY_ID.any;

      const getThemeWeight = (item, profile = getThemeProfile()) => {
        if (!profile || profile.id === "any") return 1;
        const tags = new Set(item.tags || []);
        let weight = 1;

        Object.entries(profile.boost || {}).forEach(([tag, boost]) => {
          if (tags.has(normalizeLootTag(tag))) weight += boost;
        });

        Object.entries(profile.avoid || {}).forEach(([tag, multiplier]) => {
          if (tags.has(normalizeLootTag(tag))) weight *= multiplier;
        });

        return Math.max(0.05, weight);
      };

      const pickWeightedItem = (items) => {
        if (!items || items.length === 0) return null;
        const profile = getThemeProfile();
        if (profile.id === "any") return items[Math.floor(Math.random() * items.length)];

        const weightedItems = items.map((item) => ({ item, weight: getThemeWeight(item, profile) }));
        const totalWeight = weightedItems.reduce((sum, entry) => sum + entry.weight, 0);
        if (totalWeight <= 0) return items[Math.floor(Math.random() * items.length)];

        let roll = Math.random() * totalWeight;
        for (const entry of weightedItems) {
          roll -= entry.weight;
          if (roll <= 0) return entry.item;
        }
        return weightedItems[weightedItems.length - 1].item;
      };

      const pickItemFromPool = (pool) => {
        const groups = { "Artifact": [], "Legendary": [], "Very Rare": [], "Rare": [], "Uncommon": [], "Common": [] };
        pool.forEach((item) => groups[normalizeRarity(item.rarity)].push(item));
        if (activeRarity !== "Any") return pickWeightedItem(pool);

        const selectedRarity = pickRarityForLuck();
        const selectedItem = pickFromRarityWithFallback(groups, selectedRarity);
        return selectedItem || pickWeightedItem(pool);
      };

      const pickRarityForLuck = () => {
        const profile = LUCK_RARITY_PROFILES[luckAmount] || LUCK_RARITY_PROFILES[1];
        const totalWeight = RARITY_ROLL_ORDER.reduce((sum, rarity) => sum + (profile[rarity] || 0), 0);
        let roll = Math.random() * totalWeight;
        for (const rarity of RARITY_ROLL_ORDER) {
          roll -= profile[rarity] || 0;
          if (roll <= 0) return rarity;
        }
        return "Common";
      };

      const pickFromRarityWithFallback = (groups, rarity) => {
        const rarityIndex = RARITY_ROLL_ORDER.indexOf(rarity);
        if (rarityIndex === -1) return null;
        const fallbackOrder = [rarity];
        for (let distance = 1; distance < RARITY_ROLL_ORDER.length; distance++) {
          const lowerRarity = RARITY_ROLL_ORDER[rarityIndex - distance];
          const higherRarity = RARITY_ROLL_ORDER[rarityIndex + distance];
          if (lowerRarity) fallbackOrder.push(lowerRarity);
          if (higherRarity) fallbackOrder.push(higherRarity);
        }

        for (const fallbackRarity of fallbackOrder) {
          const rarityItems = groups[fallbackRarity] || [];
          if (rarityItems.length > 0) {
            return pickWeightedItem(rarityItems);
          }
        }
        return null;
      };

      const handleAmountChange = (delta) => {
        setRollAmount((prev) => Math.max(1, Math.min(10, prev + delta)));
      };

      const handleLuckChange = (delta) => {
        setLuckAmount((prev) => {
          const next = Math.max(1, Math.min(10, prev + delta));
          localStorage.setItem("loot_roller_luck", String(next));
          return next;
        });
      };

      const handleToggleExpand = (id) => {
        setExpandedId((prev) => (prev === id ? null : id));
      };

      const triggerRarityFlash = (rarity) => {
        const flashStyle = RARITY_EDGE_FLASH_STYLES[normalizeRarity(rarity)];
        if (flashTimeoutRef.current) {
          clearTimeout(flashTimeoutRef.current);
        }
        if (flashClearTimeoutRef.current) {
          clearTimeout(flashClearTimeoutRef.current);
        }

        if (!flashStyle) {
          setBgFlash((current) => current ? { ...current, visible: false } : null);
          flashClearTimeoutRef.current = setTimeout(() => setBgFlash(null), 5500);
          return;
        }

        setBgFlash({ style: flashStyle, visible: false });
        requestAnimationFrame(() => setBgFlash({ style: flashStyle, visible: true }));
        flashTimeoutRef.current = setTimeout(() => {
          setBgFlash({ style: flashStyle, visible: false });
          flashClearTimeoutRef.current = setTimeout(() => setBgFlash(null), 5500);
        }, 220);
      };

      const triggerRoll = async () => {
        if (isRolling) { stopRollingRef.current = true; return; }
        const pool = getPool();
        if (pool.length === 0) return;
        setIsRolling(true); stopRollingRef.current = false; setExpandedId(null);
        for (let i = 0; i < rollAmount; i++) {
          if (stopRollingRef.current) break;
          await performSingleRoll(i === rollAmount - 1, pool);
        }
        setIsRolling(false); setRollingItem(null);
      };

      const performSingleRoll = (isLast, pool) => new Promise((resolve) => {
        const finalItem = pickItemFromPool(pool);
        const finalize = () => {
          if (stopRollingRef.current) { resolve(); return; }
          setRollingItem(null);
          triggerRarityFlash(finalItem.rarity);
          const item = { ...finalItem, uniqueId: Date.now() + Math.random(), timestamp: new Date().toLocaleTimeString(), isNew: true };
          setHistory((p) => [item, ...p]); setExpandedId(item.uniqueId);
          setTimeout(() => setHistory((p) => p.map((i) => i.uniqueId === item.uniqueId ? { ...i, isNew: false } : i)), 500);
          setTimeout(resolve, 300);
        };
        if (instantRoll) { finalize(); return; }

        let tick = 0;
        const totalTicks = 50;
        const runLoop = () => {
          if (stopRollingRef.current) { clearTimeout(currentIntervalRef.current); resolve(); return; }
          if (tick >= totalTicks - 2) {
            setRollingItem({ ...finalItem, temp: true, isFinalTick: true });
          } else {
            const randomVisual = pickWeightedItem(pool) || pool[Math.floor(Math.random() * pool.length)];
            setRollingItem({ ...randomVisual, temp: true, isFinalTick: false });
          }
          tick++;
          if (tick >= totalTicks) {
            setTimeout(finalize, 800);
          } else {
            const progress = tick / totalTicks;
            const delay = Math.max(30, 20 + (600 * Math.pow(progress, 4)));
            currentIntervalRef.current = setTimeout(runLoop, delay);
          }
        };
        runLoop();

    const HpTracker = () => {

      const [rows, setRows] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved)) return saved;
        } catch (err) {}
        return [];
      });
      const [dragId, setDragId] = useState(null);
      const focusIdRef = useRef(null);

      useEffect(() => {
        const id = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
          } catch (err) {}
        }, 400);
        return () => clearTimeout(id);
      }, [rows]);

      const addRow = () => {
        const now = Date.now();
        const row = { id: `hp-${now}`, name: "", current: 1, max: 1 };
        setRows((prev) => [row, ...prev]);
        focusIdRef.current = row.id;
      };

      const updateRow = (id, patch) => {
        setRows((prev) =>
          prev.map((row) => {
            if (row.id !== id) return row;
            const next = { ...row, ...patch };
            const max = Number.isFinite(next.max) ? Math.max(0, next.max) : 0;
            const current = Number.isFinite(next.current) ? Math.max(0, next.current) : 0;
            next.max = max;
            next.current = Math.min(current, max);
            return next;
          })
        );
      };

      const removeRow = (id) => {
        setRows((prev) => prev.filter((row) => row.id !== id));
      };

      const handleDragStart = (id) => {
        setDragId(id);
      };

      const handleDrop = (id) => {
        if (!dragId || dragId === id) return;
        setRows((prev) => {
          const fromIndex = prev.findIndex((row) => row.id === dragId);
          const toIndex = prev.findIndex((row) => row.id === id);
          if (fromIndex === -1 || toIndex === -1) return prev;
          const next = [...prev];
          const [moved] = next.splice(fromIndex, 1);
          next.splice(toIndex, 0, moved);
          return next;
        });
        setDragId(null);
      };

      return (
        <div className="mt-auto -mx-6 px-6 text-xs max-h-[45vh] overflow-y-auto custom-scrollbar">
          <div className="flex flex-col gap-2">
            {rows.map((row) => (
              <HpRow
                key={row.id}
                row={row}
                onUpdate={updateRow}
                onRemove={removeRow}
                onDragStart={handleDragStart}
                onDrop={handleDrop}
                focusIdRef={focusIdRef}
              />
            ))}

            onClick={addRow}
            className="w-full mt-3 py-2 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-sm text-white/70 hover:text-white transition"
          >

    const CustomSelect = ({ value, options, onChange, disabled = false, className = "", buttonClassName = "", optionClassName = "" }) => {
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);
      const selected = options.find((opt) => opt.value === value);

      useEffect(() => {
        if (!open) return;
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setOpen(false);
          }
        };
        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            setOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("keydown", handleKeyDown);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("keydown", handleKeyDown);
        };
      }, [open]);

      const handleSelect = (nextValue) => {
        onChange(nextValue);
        setOpen(false);
      };

      return (
        <div ref={containerRef} className={`relative ${className}`}>
          <button
            type="button"
            disabled={disabled}
            onClick={() => setOpen((prev) => !prev)}

    const ArcaneSurgePanel = ({ onOpenSidebar }) => {
      const [forceCritical, setForceCritical] = useState(false);
      const [isRolling, setIsRolling] = useState(false);
      const [result, setResult] = useState("");
      const [overlayOpacity, setOverlayOpacity] = useState(0);
      const [overlayTransition, setOverlayTransition] = useState("none");
      const revealTimersRef = useRef([]);
      const revealFrameRef = useRef(null);

      const clearRevealTimers = () => {
        revealTimersRef.current.forEach((timerId) => clearTimeout(timerId));
        revealTimersRef.current = [];
        if (revealFrameRef.current !== null) {
          cancelAnimationFrame(revealFrameRef.current);
          revealFrameRef.current = null;
        }
      };

      useEffect(() => clearRevealTimers, []);

      const rollSurge = () => {
        if (isRolling) return;
        clearRevealTimers();

        const isCritical = forceCritical || Math.random() < 0.1;
        const nextResult = isCritical
          ? CRITICAL_EFFECTS[Math.floor(Math.random() * CRITICAL_EFFECTS.length)]
          : SURGE_EFFECTS[Math.floor(Math.random() * SURGE_EFFECTS.length)];

        setIsRolling(true);
        setResult("");
        setOverlayTransition("none");
        setOverlayOpacity(0);

        revealFrameRef.current = requestAnimationFrame(() => {
          setOverlayTransition("opacity 2000ms cubic-bezier(0.16, 1, 0.3, 1)");
          setOverlayOpacity(1);
          revealFrameRef.current = null;
        });

        revealTimersRef.current = [
          setTimeout(() => {
            setResult(nextResult);
          }, 2000),
          setTimeout(() => {
            setOverlayTransition("opacity 2000ms cubic-bezier(0.05, 0.9, 0.05, 1)");
            setOverlayOpacity(0);
          }, 2350),
          setTimeout(() => {
            setIsRolling(false);
          }, 4350)

      return (

          </PageTopBar>

          <div className="bg-[#13131a]/90 border border-white/5 rounded-xl p-3 sm:p-4">
            <button
              onClick={rollSurge}
              disabled={isRolling}
              className={`relative block w-full overflow-hidden rounded-lg px-4 py-5 text-base sm:text-lg font-bold transition-all ${
                isRolling ? "opacity-50 cursor-wait" : "hover:scale-[1.005] hover:brightness-110"
              } bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white`}
            >
              Arcane Surge

          <div className="relative bg-[#13131a]/90 border border-white/5 rounded-xl p-4 sm:p-6 flex min-h-0 flex-1 flex-col items-center justify-center overflow-hidden">
            <div className="relative z-10 max-w-5xl text-center text-3xl font-semibold leading-relaxed text-[#ffffff] md:text-5xl" aria-live="polite">
              {result}

            <div
              className="pointer-events-none absolute inset-0 z-20 bg-[#ffffff]"
              style={{ opacity: overlayOpacity, transition: overlayTransition }}
            />
          </div>
        </div>
