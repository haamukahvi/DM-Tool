<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
  <script src="data/audio-manifest.js"></script>
  <script src="data/wow-character-options.js"></script>
  <script src="data/npc-name-pools.js"></script>
  <script src="data/npc-generator-data.js"></script>
  <script src="data/npc-generator-engine.js"></script>
  <script src="data/arcane-surges.js"></script>

  <style>
    :root {
      --bg: #101214;
      --bg-panel: #1a2022;
      --bg-panel-2: #252e31;
      --text: #edf1f2;
      --muted: #aab8ba;
      --accent: #9cc9bc;
      --accent-fill: #315f57;
      --accent-hover: #3d7168;
      --accent-soft: #263e39;
      --outline: rgba(255, 255, 255, 0.08);
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .title-font {
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .panel-glow {
      box-shadow: none;
    }

    /* Controls use surface contrast; an outline appears only for keyboard focus. */
    .dm-ui button,
    .dm-ui [role="button"],
    .dm-ui label,
    .dm-ui .status-label,
    .dm-ui .tag-pill {
      border: 0;
      box-shadow: none;
    }

    .dm-ui button {
      transition-property: background-color, color, opacity;
      transition-duration: 150ms;
    }

    .dm-ui button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .dm-ui :is(button, [role="button"], input, textarea, select, a):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      box-shadow: none;
    }

    .dm-ui :is(input, textarea, select) {
      caret-color: var(--accent);
    }

    .dm-ui ::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    ::selection {
      background: var(--accent-fill);
      color: var(--text);
    }

    .dm-ui .btn-primary {
      background: var(--accent-fill);
      color: #f0faf7;
    }

    .dm-ui .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .dm-ui .category-tab,
    .dm-ui .nav-item {
      background: var(--bg-panel);
      color: var(--muted);
    }

    .dm-ui :is(.category-tab, .nav-item):hover {
      background: var(--bg-panel-2);
      color: var(--text);
    }

    .dm-ui :is(.category-tab[aria-pressed="true"], .nav-item[aria-current="page"]) {
      background: var(--accent-soft);
      color: #c5e7dc;
    }

    /* Category hues identify content; keep them independent of the neutral chrome. */
    .dm-ui .audio-category,
    .dm-ui .tag-pill {
      background: color-mix(in srgb, var(--tag-color) 18%, var(--bg-panel));
      color: color-mix(in srgb, var(--tag-color) 45%, white);
    }

    .dm-ui .audio-category:hover,
    .dm-ui button.tag-pill:hover {
      background: color-mix(in srgb, var(--tag-color) 28%, var(--bg-panel));
    }

    .dm-ui .audio-category[aria-pressed="true"] {
      background: color-mix(in srgb, var(--tag-color) 38%, var(--bg-panel));
      color: color-mix(in srgb, var(--tag-color) 20%, white);
    }

    .dm-ui .npc-field {
      background: var(--bg-panel);
    }

    .dm-ui .npc-field[data-locked="true"] {
      background: color-mix(in srgb, #ec4899 10%, var(--bg-panel));
    }

    .dm-ui .npc-field[data-flash="true"] {
      background: color-mix(in srgb, #22d3ee 18%, var(--bg-panel));
    }

    .surge-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      border-radius: 12px;
      background: var(--bg-panel);
    }

    .surge-stage[data-kind="desperate"] { background: #110f16; }

    .surge-content {
      position: absolute;
      inset: 0;
      display: flex;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(24px, 4vw, 64px);
    }

    .surge-result {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .surge-result h2 {
      margin: 0 0 24px;
      color: #faf5ff;
      font-size: clamp(30px, 4.5vw, 62px);
      font-weight: 650;
      line-height: 1.06;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .surge-result p {
      max-width: 70ch;
      margin: 16px auto 0;
      color: #e1dce8;
      font-size: clamp(18px, 1.75vw, 25px);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .surge-result .surge-save {
      margin-top: 24px;
      color: #b9aeca;
      font-size: 14px;
    }

    .surge-normal-text {
      color: #fff;
      font-size: clamp(26px, 3.75vw, 48px);
      font-weight: 600;
      line-height: 1.4;
      text-wrap: balance;
    }

    .dm-ui .surge-trigger {
      min-height: 64px;
      transition: background-color 160ms, color 160ms, transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dm-ui .surge-trigger[data-desperate="true"] {
      background: #553947;
      color: #fff2f8;
    }

    .dm-ui .surge-trigger:active { transform: scale(0.99); }

    @media (hover: hover) and (pointer: fine) {
      .dm-ui .surge-trigger[data-desperate="true"]:hover { background: #6b4558; }
    }

    .surge-arrival {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .surge-arrival--normal {
      background: #fff;
      animation: surge-normal-flash 4350ms both;
    }

    .surge-arrival--desperate::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #07060a;
      animation: surge-darkness 4600ms both;
    }

    .surge-fissure {
      position: absolute;
      inset: 0;
      background: #fff;
      animation: surge-fissure 4600ms both;
    }

    .surge-stage[data-phase="revealed"][data-kind="desperate"] .surge-result {
      animation: surge-result-arrive 1300ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes surge-normal-flash {
      0% { opacity: 0; }
      46%, 54% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes surge-darkness {
      0% { opacity: 0; }
      12%, 66% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }

    @keyframes surge-fissure {
      0%, 12% { opacity: 0; clip-path: inset(0 calc(50% - 1px)); }
      36%, 52% { opacity: 1; clip-path: inset(0 calc(50% - 1px)); }
      58%, 66% { opacity: 1; clip-path: inset(0 0); }
      100% { opacity: 0; clip-path: inset(0 0); }
    }

    @keyframes surge-result-arrive {
      from { opacity: 0; transform: scale(1.035); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .surge-result h2 { margin-bottom: 20px; }
      .surge-result p { line-height: 1.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dm-ui *, .dm-ui *::before, .dm-ui *::after {
        animation: none !important;
        transition: none !important;
      }

      .surge-arrival { display: none; }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .compare-scroll-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .compare-scroll-hidden::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flash {
      0% { background-color: rgba(255, 255, 255, 0.05); }
      50% { background-color: rgba(255, 255, 255, 0.2); }
      100% { background-color: rgba(255, 255, 255, 0.05); }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease both;
    }

    .animate-flash {
      animation: flash 0.6s ease;
    }

    @keyframes breathe-opacity {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }

    .animate-breathe {
      animation: breathe-opacity 4s ease-in-out infinite;
    }

    .ambience-track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr));
      align-items: start;
      gap: 0.75rem;
    }

    .rules-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr));
      gap: 0.75rem;
    }

    .music-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));
      gap: 0.75rem;
    }

    .sfx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
      gap: 0.75rem;
    }
  </style>
</head>

    const WAVEFORM_PEAK_CACHE = new Map();
    const decodeWaveformPeaks = (encodedPeaks) => {
      if (!encodedPeaks) return [];
      const cached = WAVEFORM_PEAK_CACHE.get(encodedPeaks);
      if (cached) return cached;
      try {
        const binary = atob(encodedPeaks);
        const peaks = Array.from(binary, (value) => value.charCodeAt(0) / 255);
        WAVEFORM_PEAK_CACHE.set(encodedPeaks, peaks);
        return peaks;
      } catch (err) {
        return [];
      }
    };

    const MusicWaveform = ({ track, currentTime, duration, onSeek }) => {
      const canvasRef = useRef(null);
      const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
      const peaks = useMemo(() => decodeWaveformPeaks(track?.waveform), [track?.file, track?.waveform]);

      const seekFromPointer = (event) => {
        if (!track || !duration || !onSeek) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const clientX = event.clientX ?? event.touches?.[0]?.clientX;
        if (clientX === undefined) return;
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        onSeek(ratio * duration);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const updateSize = () => {
          const rect = canvas.getBoundingClientRect();
          setCanvasSize({ width: Math.round(rect.width), height: Math.round(rect.height) });
        };
        updateSize();
        if (!window.ResizeObserver) {
          window.addEventListener("resize", updateSize);
          return () => window.removeEventListener("resize", updateSize);
        }
        const observer = new ResizeObserver(updateSize);
        observer.observe(canvas);
        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        const midY = height / 2;
        const sourcePeaks = peaks.length > 0 ? peaks : Array.from({ length: 72 }, (_, index) => 0.18 + (Math.sin(index * 1.7) + 1) * 0.12);
        const progressRatio = duration > 0 ? Math.min(1, Math.max(0, currentTime / duration)) : 0;
        const barGap = Math.max(1, 1.5 * dpr);
        const step = width / sourcePeaks.length;
        const barWidth = Math.max(1, step - barGap);

        const drawBars = (color, clipProgress = null) => {
          ctx.save();
          if (clipProgress !== null) {
            ctx.beginPath();
            ctx.rect(0, 0, width * clipProgress, height);
            ctx.clip();
          }
          ctx.fillStyle = color;
          sourcePeaks.forEach((peak, index) => {
            const barHeight = Math.max(2 * dpr, peak * height * 0.86);
            const x = index * step;
            const y = midY - barHeight / 2;
            ctx.fillRect(x, y, barWidth, barHeight);
          });
          ctx.restore();
        };

        drawBars("rgba(255, 255, 255, 0.18)");
        if (track && progressRatio > 0) {
          drawBars("rgba(236, 72, 153, 0.95)", progressRatio);
        }
      }, [peaks, currentTime, duration, track?.file, canvasSize.width, canvasSize.height]);

      return (
        <div className="h-10 min-w-[10rem] flex-1 overflow-hidden px-1 py-1">
          <canvas
            ref={canvasRef}
            onClick={seekFromPointer}
            className="block h-full w-full cursor-pointer"
            aria-label="Music waveform timeline"
            role="slider"
            aria-valuemin="0"
            aria-valuemax={Math.max(0, duration || 0)}
            aria-valuenow={Math.min(duration || 0, currentTime || 0)}
          />
        </div>
      );
    };

    const MusicProgressWaveform = React.memo(({ track, isPlaying, isTransitioning, activeAudioRef, incomingAudioRef, onSeek }) => {
      const [progress, setProgress] = useState({ currentTime: 0, duration: 0 });
      const [isDocumentVisible, setIsDocumentVisible] = useState(() => document.visibilityState !== "hidden");

      useEffect(() => {
        const handleVisibilityChange = () => setIsDocumentVisible(document.visibilityState !== "hidden");
        document.addEventListener("visibilitychange", handleVisibilityChange);
        return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
      }, []);

      useEffect(() => {
        const updateProgress = () => {
          const audio = activeAudioRef.current || incomingAudioRef.current;
          const currentTime = audio?.currentTime || 0;
          const duration = Number.isFinite(audio?.duration) ? audio.duration : 0;
          setProgress((previous) => {
            const nextProgress = {
              currentTime: Math.round(currentTime * 2) / 2,
              duration: Math.round(duration * 2) / 2
            };
            return previous.currentTime === nextProgress.currentTime && previous.duration === nextProgress.duration
              ? previous
              : nextProgress;
          });
        };

        updateProgress();
        if (!track || !isDocumentVisible || (!isPlaying && !isTransitioning)) return;
        const interval = setInterval(updateProgress, 500);
        return () => clearInterval(interval);
      }, [track?.file, isPlaying, isTransitioning, isDocumentVisible, activeAudioRef, incomingAudioRef]);

      const seek = (nextTime) => {
        const nextProgress = onSeek(nextTime);
        if (nextProgress) setProgress(nextProgress);
      };

      return (
        <MusicWaveform
          track={track}
          currentTime={progress.currentTime}
          duration={progress.duration}
          onSeek={seek}
        />
      );
    });

      const start = Date.now();
      const interval = setInterval(() => {
        const progress = Math.min(1, (Date.now() - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        setter(from + (to - from) * eased);
        if (progress >= 1) {
          clearInterval(interval);
          setter(to);
        }
      }, 16);

      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";

      const sp = Math.floor(cp / 10); cp %= 10;
      const parts = [];
      if (pp > 0) parts.push({ val: pp, unit: "p", color: "text-slate-200" });

        audio.loop = true;

        const source = audioContextRef.current.createMediaElementSource(audio);
        const gainNode = audioContextRef.current.createGain();
        gainNode.gain.setValueAtTime(0, audioContextRef.current.currentTime);

        source.connect(gainNode);
        gainNode.connect(masterGainRef.current);

        try {
          await audio.play();
          setIsPaused(false);
          const fadeDuration = 4.5;
          gainNode.gain.linearRampToValueAtTime(1, audioContextRef.current.currentTime + fadeDuration);
          activeTracksRef.current[track.file] = { audio, source, gainNode, title: track.title };
          setActiveUrls(Object.keys(activeTracksRef.current));
          setTimeout(() => setPendingUrl(null), fadeDuration * 1000);
        } catch (err) {
          setPendingUrl(null);
        }
      };

      const stopTrack = (track) => {
        const active = activeTracksRef.current[track.file];
        if (!active) return;
        setPendingUrl(track.file);
        const fadeDuration = 4.5;
        const now = audioContextRef.current.currentTime;
        active.gainNode.gain.cancelScheduledValues(now);
        active.gainNode.gain.setValueAtTime(active.gainNode.gain.value, now);
        active.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);
        setTimeout(() => {
          active.audio.pause();
          active.source.disconnect();
          delete activeTracksRef.current[track.file];
          setActiveUrls(Object.keys(activeTracksRef.current));
          setPendingUrl(null);
        }, fadeDuration * 1000);
      };

      const stopAll = () => {
        Object.keys(activeTracksRef.current).forEach((url) => {
          stopTrack({ file: url });
        });
        setIsPaused(false);
      };

      const pauseOrResumeAll = async () => {
        if (activeUrls.length === 0) return;
        if (!audioContextRef.current) return;
        if (audioContextRef.current.state === "suspended") await audioContextRef.current.resume();

        const fadeDuration = 1.5;
        const now = audioContextRef.current.currentTime;
        if (!isPaused) {
          Object.values(activeTracksRef.current).forEach((track) => {
            track.gainNode.gain.cancelScheduledValues(now);
            track.gainNode.gain.setValueAtTime(track.gainNode.gain.value, now);
            track.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);
          });
          setIsPaused(true);
          return;
        }

        Object.values(activeTracksRef.current).forEach(async (track) => {
          try {
            await track.audio.play();
          } catch (err) {}
          const resumeNow = audioContextRef.current.currentTime;
          track.gainNode.gain.cancelScheduledValues(resumeNow);
          track.gainNode.gain.setValueAtTime(track.gainNode.gain.value, resumeNow);
          track.gainNode.gain.linearRampToValueAtTime(1, resumeNow + fadeDuration);
        });
        setIsPaused(false);
      };

      useEffect(() => {
        if (!isActive) return;
        const handleKeyDown = (event) => {
          if (event.code !== "Space" || isTypingTarget(event.target) || event.ctrlKey || event.metaKey || event.altKey) return;
          event.preventDefault();
          pauseOrResumeAll();
        };
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, [isActive, activeUrls, isPaused]);

      const resetMasterVolume = (event) => {
        event.preventDefault();
        clearInterval(volumeResetRef.current);
        volumeResetRef.current = animateNumber(masterVolume, 0.7, setMasterVolume);
      };

      const visibleTracks = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        const filtered = ambienceTracks.filter((track) => {
          const matchesCategory = activeCategory === "All" || (track.tags || []).includes(activeCategory);
          const matchesQuery =
            !normalizedQuery ||
            `${track.title} ${track.fileName} ${(track.tags || []).join(" ")}`.toLowerCase().includes(normalizedQuery);
          return matchesCategory && matchesQuery;
        });
        return [...filtered].sort((a, b) => {
          if (sortMode === "latest") return (b.modifiedAt || 0) - (a.modifiedAt || 0);
          return a.title.localeCompare(b.title);
        });
      }, [ambienceTracks, query, activeCategory, sortMode]);

      if (!isActive) return null;

      return (
        <div className="h-[calc(100vh-1.5rem)] flex flex-col gap-3 sm:gap-4">
          <div className="flex flex-col gap-3">
            <PageTopBar onOpenSidebar={onOpenSidebar}>
              <SearchInput
                value={query}
                onChange={setQuery}
                placeholder="Search ambience..."
                className="min-w-[12rem] flex-1"
                inputRef={searchInputRef}
              />
              <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            </PageTopBar>
            <div className="flex min-h-[4.75rem] items-center gap-2 overflow-x-auto custom-scrollbar py-4">
              {["All", ...categories].map((category) => (
                <CategoryTabButton
                  key={category}
                  label={category}
                  active={activeCategory === category}
                  onClick={() => setActiveCategory(category)}
                />
              ))}
            </div>
          </div>

          <div className="music-list-grid flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1 pb-24">
            {visibleTracks.length === 0 && (
              <div className="rounded-xl border border-white/5 bg-[#1a2022] p-4 text-sm text-[#aab8ba]">
                No ambience found.
              </div>
            )}
            {visibleTracks.map((track) => {
              const isActive = activeUrls.includes(track.file);
              const isPending = pendingUrl === track.file;
              return (
                <button
                  key={track.file}
                  onClick={() => (isActive ? stopTrack(track) : playTrack(track))}
                  disabled={isPending}
                  className={`text-left rounded-xl border p-2.5 transition ${
                    isActive
                      ? "bg-pink-500/20 text-white"
                      : "bg-[#1a2022] border-white/5 text-white/80 hover:bg-white/10"
                  } ${isPending ? "opacity-70 cursor-wait" : ""}`}
                >
                  <div className="text-sm font-semibold leading-tight break-words">{track.title}</div>
                  {(track.tags || []).length > 0 && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      {track.tags.map((tag) => (
                        <TagPill key={tag} tag={tag} className="break-words" />
                      ))}
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          <div className="fixed bottom-0 left-0 right-0 z-30 border-t border-white/10 bg-[#151a1c] p-3 sm:p-4">
            <div className="mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center">
              <div className="min-w-0 flex-1">
                <div className="truncate text-sm font-semibold text-white/90">
                  {activeUrls.length > 0 ? `${activeUrls.length} layer${activeUrls.length === 1 ? "" : "s"} playing` : "No ambience playing"}
                </div>
                {activeUrls.length > 0 && (
                  <div className="mt-1 flex gap-1 overflow-x-auto custom-scrollbar pb-1">
                    {activeUrls.map((url) => {
                      const track = ambienceTracks.find((item) => item.file === url);
                      return (
                        <span key={url} className="shrink-0 rounded bg-white/5 px-2 py-0.5 text-xs text-[#aab8ba]">
                          {track ? track.title : "Track"}
                        </span>
                      );
                    })}
                  </div>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-2 sm:gap-5">
                <button
                  type="button"
                  onClick={pauseOrResumeAll}
                  disabled={activeUrls.length === 0}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white disabled:opacity-40"
                  aria-label={isPaused ? "Play ambience" : "Pause ambience"}
                  title={isPaused ? "Play" : "Pause"}
                >
                  {isPaused ? <IconPlayerPlay className="h-5 w-5" /> : <IconPlayerPause className="h-5 w-5" />}
                </button>
                <button
                  onClick={stopAll}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white"
                  aria-label="Stop ambience"
                  title="Stop"
                >
                  <IconPlayerStop className="h-5 w-5" />
                </button>
                <div className="flex items-center gap-1.5">
                  <input
                    aria-label="Ambience volume"
                    onContextMenu={resetMasterVolume}
                    type="range"
                    min="0"
                    max="100"
                    value={Math.round(masterVolume * 100)}
                    onChange={(e) => setMasterVolume(Number(e.target.value) / 100)}
                    className="w-32 accent-pink-500"
                  />
                  <span className="w-10 text-right text-xs text-[#aab8ba]">{Math.round(masterVolume * 100)}%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MUSIC_TUNE_STEPS = [0.25, ...Array.from({ length: 13 }, (_, index) => (index + 3) / 10)];

    const MusicPanel = ({ onOpenSidebar, isActive, onActivate }) => {
      const musicTracks = AUDIO_MANIFEST.music || [];
      const categories = AUDIO_MANIFEST.musicCategories || [];
      const activeAudioRef = useRef(null);
      const incomingAudioRef = useRef(null);
      const musicAudiosRef = useRef(new Set());
      const playbackRequestedRef = useRef(false);
      const timeoutsRef = useRef([]);
      const controlResetTimersRef = useRef({});
      const loopCrossfadeRef = useRef(false);
      const transitionIdRef = useRef(0);
      const searchInputRef = useRef(null);
      const linkCopyResetRef = useRef(null);
      const [query, setQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("All");
      const [sortMode, setSortMode] = useState("name");
      const [currentFolder, setCurrentFolder] = useState("");
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [volume, setVolume] = useState(0.75);
      const [tune, setTune] = useState(1);
      const [drunkEnabled, setDrunkEnabled] = useState(false);
      const volumeRef = useRef(volume);
      const tuneRef = useRef(tune);
      const drunkEffectRef = useRef({ phase: 0, mix: 0, multiplier: 1 });
      const [copiedTrackFile, setCopiedTrackFile] = useState("");
      const [musicTagOverrides, setMusicTagOverrides] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("dm_music_tag_overrides_v1"));
          return saved && typeof saved === "object" ? saved : {};
        } catch (err) {
          return {};
        }
      });
      const [tagEditor, setTagEditor] = useState(null);
      const [selectedTag, setSelectedTag] = useState(null);

      useTypeToSearch(isActive, searchInputRef, setQuery);

      useEffect(() => {
        const id = setTimeout(() => {
          try {
            localStorage.setItem("dm_music_tag_overrides_v1", JSON.stringify(musicTagOverrides));
          } catch (err) {}
        }, 300);
        return () => clearTimeout(id);
      }, [musicTagOverrides]);

      const getTrackTags = (track) => {
        if (!track) return [];
        return musicTagOverrides[track.file] || track.tags || [];
      };

      const knownTags = useMemo(() => {
        const tags = new Set(categories);
        musicTracks.forEach((track) => {
          (track.tags || []).forEach((tag) => tags.add(tag));
          (musicTagOverrides[track.file] || []).forEach((tag) => tags.add(tag));
        });
        const orderedBuiltIns = categories.filter((tag) => tags.has(tag));
        const customTags = [...tags]
          .filter((tag) => tag && !categories.includes(tag))
          .sort((a, b) => a.localeCompare(b));
        return [...orderedBuiltIns, ...customTags];
      }, [categories, musicTracks, musicTagOverrides]);

      const clearTransitionTimers = () => {
        timeoutsRef.current.forEach((id) => {
          clearTimeout(id);
          clearInterval(id);
        });
        timeoutsRef.current = [];
      };

      const clearControlResetTimers = () => {
        Object.values(controlResetTimersRef.current).forEach((id) => clearInterval(id));
        controlResetTimersRef.current = {};
      };

      const stopAudio = (audio) => {
        if (!audio) return;
        audio._dmStopped = true;
        if (audio._dmFadeInterval) {
          clearInterval(audio._dmFadeInterval);
          audio._dmFadeInterval = null;
        }
        if (audio._dmLoopTimer) {
          clearTimeout(audio._dmLoopTimer);
          audio._dmLoopTimer = null;
        }
        if (audio._dmLoopHandler) {
          audio.removeEventListener("timeupdate", audio._dmLoopHandler);
          audio._dmLoopHandler = null;
        }
        if (audio._dmLoadedMetadataHandler) {
          audio.removeEventListener("loadedmetadata", audio._dmLoadedMetadataHandler);
          audio._dmLoadedMetadataHandler = null;
        }
        if (audio._dmPlayHandler) {
          audio.removeEventListener("play", audio._dmPlayHandler);
          audio._dmPlayHandler = null;
        }
        if (audio._dmSeekedHandler) {
          audio.removeEventListener("seeked", audio._dmSeekedHandler);
          audio._dmSeekedHandler = null;
        }
        if (audio._dmEndedHandler) {
          audio.removeEventListener("ended", audio._dmEndedHandler);
          audio._dmEndedHandler = null;
        }
        audio.pause();
        audio.src = "";
        musicAudiosRef.current.delete(audio);
        if (activeAudioRef.current === audio) activeAudioRef.current = null;
        if (incomingAudioRef.current === audio) incomingAudioRef.current = null;
      };

      const applyTune = (audio, nextTune) => {
        if (!audio || audio._dmStopped) return;
        audio.preservesPitch = false;
        audio.mozPreservesPitch = false;
        audio.webkitPreservesPitch = false;
        audio.playbackRate = nextTune * drunkEffectRef.current.multiplier;
      };

      useEffect(() => {
        const effect = drunkEffectRef.current;
        if (!drunkEnabled && effect.mix === 0) return;
        let lastUpdate = performance.now();

        // Share one five-second wobble across every track, including crossfades.
        const timer = setInterval(() => {
          const now = performance.now();
          const elapsed = (now - lastUpdate) / 1000;
          lastUpdate = now;
          const audios = [...musicAudiosRef.current];
          if (audios.some((audio) => !audio.paused && !audio._dmStopped)) {
            effect.phase = (effect.phase + elapsed * Math.PI * 2 / 5) % (Math.PI * 2);
          }
          // Ease the effect in and out without moving the user's Tune slider.
          effect.mix = Math.max(0, Math.min(1, effect.mix + (drunkEnabled ? 1 : -1) * elapsed / 0.4));
          effect.multiplier = 1 + Math.sin(effect.phase) * 0.04 * effect.mix;
          audios.forEach((audio) => applyTune(audio, tuneRef.current));
          activeAudioRef.current?._dmScheduleLoopCrossfade?.();
          if (!drunkEnabled && effect.mix === 0) {
            effect.phase = 0;
            clearInterval(timer);
          }
        }, 50);

        return () => clearInterval(timer);
      }, [drunkEnabled]);

      useEffect(() => {
        return () => {
          transitionIdRef.current += 1;
          clearTransitionTimers();
          clearControlResetTimers();
          clearTimeout(linkCopyResetRef.current);
          [...musicAudiosRef.current].forEach(stopAudio);
        };
      }, []);

      const resetControl = (event, key, currentValue, targetValue, setter) => {
        event.preventDefault();
        clearInterval(controlResetTimersRef.current[key]);
        controlResetTimersRef.current[key] = animateNumber(currentValue, targetValue, setter);
      };

      useEffect(() => {
        volumeRef.current = volume;
        const activeAudio = activeAudioRef.current;
        if (activeAudio && isPlaying && !isTransitioning && !activeAudio._dmFadeInterval) {
          activeAudio.volume = volume;
        }
      }, [volume, isPlaying, isTransitioning]);

      useEffect(() => {
        tuneRef.current = tune;
        musicAudiosRef.current.forEach((audio) => applyTune(audio, tune));
        activeAudioRef.current?._dmScheduleLoopCrossfade?.();
      }, [tune]);

      const fadeVolume = (audio, from, to, durationMs, onDone) => {
        if (!audio || audio._dmStopped) return;
        clearInterval(audio._dmFadeInterval);
        const start = Date.now();
        audio.volume = from;

        const interval = setInterval(() => {
          if (audio._dmStopped) {
            clearInterval(interval);
            if (audio._dmFadeInterval === interval) audio._dmFadeInterval = null;
            return;
          }
          const progress = Math.min(1, (Date.now() - start) / durationMs);
          audio.volume = from + (to - from) * progress;
          if (progress >= 1) {
            clearInterval(interval);
            if (audio._dmFadeInterval === interval) audio._dmFadeInterval = null;
            if (onDone) onDone();
          }
        }, 50);
        audio._dmFadeInterval = interval;
      };

      const createMusicAudio = (track) => {
        const audio = new Audio(resolveAssetUrl(track.file));
        audio.loop = false;
        audio.volume = 0;
        applyTune(audio, tuneRef.current);
        audio._dmTrack = track;
        audio._dmStopped = false;
        musicAudiosRef.current.add(audio);
        const loopFadeDuration = 2000;
        const getWallMsUntilEnd = () => {
          const playbackRate = Number.isFinite(audio.playbackRate) && audio.playbackRate > 0 ? audio.playbackRate : 1;
          return ((audio.duration - audio.currentTime) * 1000) / playbackRate;
        };
        const scheduleLoopCrossfade = () => {
          clearTimeout(audio._dmLoopTimer);
          if (audio._dmStopped || audio.paused || !playbackRequestedRef.current || activeAudioRef.current !== audio) return;
          if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
          const msUntilFade = Math.max(0, getWallMsUntilEnd() - loopFadeDuration);
          audio._dmLoopTimer = setTimeout(() => startLoopCrossfade(false), msUntilFade);
        };
        audio._dmScheduleLoopCrossfade = scheduleLoopCrossfade;
        const startLoopCrossfade = (fallback = false) => {
          if (loopCrossfadeRef.current || !playbackRequestedRef.current || activeAudioRef.current !== audio) return;
          if (!fallback && Number.isFinite(audio.duration) && getWallMsUntilEnd() > loopFadeDuration + 120) return;

          const transitionId = transitionIdRef.current;
          loopCrossfadeRef.current = true;
          const nextAudio = createMusicAudio(track);
          incomingAudioRef.current = nextAudio;

          nextAudio.play().then(() => {
            if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== nextAudio) {
              stopAudio(nextAudio);
              return;
            }
            const fadeDuration = loopFadeDuration;
            activeAudioRef.current = nextAudio;
            nextAudio._dmScheduleLoopCrossfade?.();
            fadeVolume(audio, audio.volume, 0, fadeDuration, () => stopAudio(audio));
            fadeVolume(nextAudio, 0, volumeRef.current, fadeDuration, () => {
              if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== nextAudio) {
                stopAudio(nextAudio);
                return;
              }
              incomingAudioRef.current = null;
              loopCrossfadeRef.current = false;
            });
          }).catch(() => {
            if (transitionId !== transitionIdRef.current) {
              stopAudio(nextAudio);
              return;
            }
            incomingAudioRef.current = null;
            loopCrossfadeRef.current = false;
            audio.currentTime = 0;
            audio.volume = volumeRef.current;
            audio.play().catch(() => {});
          });
        };
        audio._dmLoopHandler = () => {
          scheduleLoopCrossfade();
        };
        audio._dmLoadedMetadataHandler = scheduleLoopCrossfade;
        audio._dmPlayHandler = scheduleLoopCrossfade;
        audio._dmSeekedHandler = scheduleLoopCrossfade;
        audio._dmEndedHandler = () => {
          startLoopCrossfade(true);
        };
        audio.addEventListener("loadedmetadata", audio._dmLoadedMetadataHandler);
        audio.addEventListener("play", audio._dmPlayHandler);
        audio.addEventListener("seeked", audio._dmSeekedHandler);
        audio.addEventListener("timeupdate", audio._dmLoopHandler);
        audio.addEventListener("ended", audio._dmEndedHandler);
        return audio;
      };

      const playTrack = (track) => {
        playbackRequestedRef.current = true;
        const transitionId = transitionIdRef.current + 1;
        transitionIdRef.current = transitionId;
        clearTransitionTimers();
        loopCrossfadeRef.current = false;
        setIsTransitioning(true);
        setCurrentTrack(track);

        if (incomingAudioRef.current) {
          stopAudio(incomingAudioRef.current);
          incomingAudioRef.current = null;
        }

        activeAudioRef.current = null;
        const incoming = createMusicAudio(track);
        incomingAudioRef.current = incoming;
        const outgoingAudios = [...musicAudiosRef.current].filter((audio) => audio !== incoming);
        outgoingAudios.forEach((audio) => {
          fadeVolume(audio, audio.volume, 0, 4000, () => stopAudio(audio));
        });

        const startIncomingTimer = setTimeout(async () => {
          if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
            stopAudio(incoming);
            return;
          }
          try {
            await incoming.play();
            if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
              stopAudio(incoming);
              return;
            }
            activeAudioRef.current = incoming;
            incoming._dmScheduleLoopCrossfade?.();
            fadeVolume(incoming, 0, volumeRef.current, 4000, () => {
              if (transitionId !== transitionIdRef.current || incomingAudioRef.current !== incoming) {
                stopAudio(incoming);
                return;
              }
              incomingAudioRef.current = null;
              setCurrentTrack(track);
              setIsPlaying(true);
              setIsTransitioning(false);
            });
          } catch (err) {
            stopAudio(incoming);
            setIsTransitioning(false);
          }
        }, outgoingAudios.length > 0 ? 2000 : 0);
        timeoutsRef.current.push(startIncomingTimer);
      };

      const pauseOrResume = async () => {
        const audio = activeAudioRef.current;
        const incoming = incomingAudioRef.current;

        if (isPlaying || isTransitioning) {
          playbackRequestedRef.current = false;
          transitionIdRef.current += 1;
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          const preferredAudio = incoming && currentTrack && incoming._dmTrack?.file === currentTrack.file ? incoming : audio;
          [...musicAudiosRef.current].forEach((item) => {
            fadeVolume(item, item.volume, 0, 4000, () => {
              if (item === preferredAudio) {
                item.pause();
                return;
              }
              stopAudio(item);
            });
          });
          activeAudioRef.current = preferredAudio || null;
          incomingAudioRef.current = null;
          setIsPlaying(false);
          setIsTransitioning(false);
          return;
        }

        if (!audio && currentTrack) {
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          playTrack(currentTrack);
          return;
        }

        if (!audio) return;

        try {
          playbackRequestedRef.current = true;
          const transitionId = transitionIdRef.current + 1;
          transitionIdRef.current = transitionId;
          clearTransitionTimers();
          loopCrossfadeRef.current = false;
          const resumeVolume = audio.volume;
          audio.volume = resumeVolume;
          setIsTransitioning(true);
          await audio.play();
          if (transitionId !== transitionIdRef.current || activeAudioRef.current !== audio) return;
          fadeVolume(audio, resumeVolume, volumeRef.current, 4000, () => {
            if (transitionId !== transitionIdRef.current || activeAudioRef.current !== audio) return;
            setIsTransitioning(false);
          });
          setIsPlaying(true);
        } catch (err) {
          setIsTransitioning(false);
        }
      };

      useEffect(() => {
        if (!isActive) return;
        const handleKeyDown = (event) => {
          if (event.code !== "Space" || isTypingTarget(event.target) || event.ctrlKey || event.metaKey || event.altKey) return;
          event.preventDefault();
          pauseOrResume();
        };
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, [isActive, isPlaying, isTransitioning, currentTrack, volume]);

      const stopMusic = () => {
        playbackRequestedRef.current = false;
        transitionIdRef.current += 1;
        clearTransitionTimers();
        loopCrossfadeRef.current = false;
        const audios = [...musicAudiosRef.current];
        audios.forEach((audio) => {
          fadeVolume(audio, audio.volume, 0, 4000, () => stopAudio(audio));
        });

        activeAudioRef.current = null;
        incomingAudioRef.current = null;
        setIsPlaying(false);
        setIsTransitioning(false);
        setCurrentTrack(null);
      };

      const normalizeMusicReference = (value) => {
        if (!value) return "";
        const normalized = String(value).replace(/\\/g, "/");
        try {
          return decodeURIComponent(normalized).toLowerCase();
        } catch (err) {
          return normalized.toLowerCase();
        }
      };

      const matchesMusicCommand = (track, reference) => {
        const normalizedReference = normalizeMusicReference(reference);
        if (!normalizedReference) return false;
        const relativeFile = `${track.folderPath ? `${track.folderPath}/` : ""}${track.fileName}`;
        return [track.file, relativeFile, track.fileName]
          .map(normalizeMusicReference)
          .some((candidate) => candidate === normalizedReference || candidate.endsWith(`/${normalizedReference}`));
      };

      const escapeMarkdownLinkText = (value) => String(value || "").replace(/([\\[\]])/g, "\\$1");

      const buildMusicObsidianLink = (track) => {
        let decodedFile = track.file;
        try {
          decodedFile = decodeURIComponent(track.file);
        } catch (err) {}
        return `[Play: ${escapeMarkdownLinkText(track.title)}](dmtool://music/play?file=${encodeURIComponent(decodedFile)})`;
      };

      const copyMusicObsidianLink = async (event, track) => {
        event.preventDefault();
        event.stopPropagation();
        const link = buildMusicObsidianLink(track);
        try {
          await copyTextToClipboard(link);
          setCopiedTrackFile(track.file);
          clearTimeout(linkCopyResetRef.current);
          linkCopyResetRef.current = setTimeout(() => setCopiedTrackFile(""), 1400);
        } catch (err) {
          console.warn("Unable to copy music link.", err);
        }
      };

      useEffect(() => {
        if (!window.dmDesktop?.onMusicCommand) return;
        const unsubscribe = window.dmDesktop.onMusicCommand((command) => {
          if (!command || command.type !== "play" || !command.file) return;
          const track = musicTracks.find((item) => matchesMusicCommand(item, command.file));
          if (!track) return;
          onActivate?.();
          setQuery("");
          setActiveCategory("All");
          setCurrentFolder(track.folderPath || "");
          playTrack(track);
        });
        return unsubscribe;
      }, [musicTracks, onActivate, volume, tune]);

      const seekMusic = (nextTime) => {
        const audio = activeAudioRef.current || incomingAudioRef.current;
        if (!audio || !Number.isFinite(audio.duration)) return null;
        const boundedTime = Math.min(Math.max(nextTime, 0), Math.max(0, audio.duration - 0.05));
        audio.currentTime = boundedTime;
        return {
          currentTime: Math.round(boundedTime * 2) / 2,
          duration: Math.round(audio.duration * 2) / 2
        };
      };

      const folderBrowserActive = activeCategory === "All" && query.trim().length === 0;
      const folderLabel = currentFolder ? currentFolder.split("/").pop() : "Music";
      const currentParentFolder = currentFolder.split("/").slice(0, -1).join("/");

      const visibleFolders = useMemo(() => {
        if (!folderBrowserActive) return [];
        const folderNames = new Set();
        const prefix = currentFolder ? `${currentFolder}/` : "";

        musicTracks.forEach((track) => {
          const folderPath = track.folderPath || "";
          if (!folderPath.startsWith(prefix) || folderPath === currentFolder) return;
          const remaining = folderPath.slice(prefix.length);
          const folderName = remaining.split("/")[0];
          if (folderName) folderNames.add(folderName);
        });

        const latestForFolder = (name) => {
          const folderPath = currentFolder ? `${currentFolder}/${name}` : name;
          return Math.max(0, ...musicTracks
            .filter((track) => (track.folderPath || "").startsWith(folderPath))
            .map((track) => track.modifiedAt || 0));
        };

        return [...folderNames]
          .sort((a, b) => sortMode === "latest" ? latestForFolder(b) - latestForFolder(a) : a.localeCompare(b))
          .map((name) => ({
            name,
            path: currentFolder ? `${currentFolder}/${name}` : name
          }));
      }, [folderBrowserActive, musicTracks, currentFolder, sortMode]);

      const visibleTracks = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        if (folderBrowserActive) {
          return musicTracks
            .filter((track) => (track.folderPath || "") === currentFolder)
            .sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
        }

        const filtered = musicTracks.filter((track) => {
          const trackTags = getTrackTags(track);
          const matchesCategory = activeCategory === "All" || trackTags.includes(activeCategory);
          const matchesQuery =
            !normalizedQuery ||
            `${track.title} ${track.fileName} ${track.folderPath || ""} ${trackTags.join(" ")}`.toLowerCase().includes(normalizedQuery);
          return matchesCategory && matchesQuery;
        });
        return [...filtered].sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
      }, [musicTracks, query, activeCategory, folderBrowserActive, currentFolder, musicTagOverrides, sortMode]);

      const currentTags = getTrackTags(currentTrack);
      const openTagEditor = (mode, originalTag = "") => {
        if (!currentTrack) return;
        setSelectedTag(null);
        setTagEditor({ mode, originalTag, value: originalTag });
      };
      const tagSuggestion = tagEditor?.value
        ? knownTags.find((tag) => tag.toLowerCase().startsWith(tagEditor.value.toLowerCase()) && tag.toLowerCase() !== tagEditor.value.toLowerCase())
        : "";
      const saveTag = () => {
        if (!currentTrack || !tagEditor) return;
        const nextTag = tagEditor.value.trim();
        if (!nextTag) return;

        const baseTags = getTrackTags(currentTrack);
        const nextTags = tagEditor.mode === "edit"
          ? baseTags.map((tag) => (tag === tagEditor.originalTag ? nextTag : tag))
          : [...baseTags, nextTag];
        const uniqueTags = [...new Set(nextTags.map((tag) => tag.trim()).filter(Boolean))];
        setMusicTagOverrides((prev) => ({ ...prev, [currentTrack.file]: uniqueTags }));
        setTagEditor(null);
      };
      const deleteTag = (tagToDelete) => {
        if (!currentTrack) return;
        const nextTags = getTrackTags(currentTrack).filter((tag) => tag !== tagToDelete);
        setMusicTagOverrides((prev) => ({ ...prev, [currentTrack.file]: nextTags }));
        setSelectedTag(null);
      };

      if (!isActive) return null;

      return (
        <div className="h-[calc(100vh-1.5rem)] flex flex-col gap-3 sm:gap-4">
          <div className="flex flex-col gap-3">
            <PageTopBar onOpenSidebar={onOpenSidebar}>
              <SearchInput
                value={query}
                onChange={setQuery}
                placeholder="Search music..."
                className="min-w-[12rem] flex-1"
                inputRef={searchInputRef}
              />
              <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            </PageTopBar>
            <div className="flex min-h-[4.75rem] items-center gap-2 overflow-x-auto custom-scrollbar py-4">
              {["All", ...knownTags].map((category) => (
                <CategoryTabButton
                  key={category}
                  label={category}
                  active={activeCategory === category}
                  onClick={() => {
                    setActiveCategory(category);
                    if (category !== "All") setCurrentFolder("");
                  }}
                />
              ))}
            </div>
          </div>

          <div className="music-list-grid flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1 pb-28">
            {folderBrowserActive && currentFolder && (
              <button
                onClick={() => setCurrentFolder(currentParentFolder)}
                className="text-left rounded-xl border border-white/10 bg-transparent p-2.5 text-white/60 transition hover:border-white/30 hover:text-white"
              >
                <div className="flex items-center gap-2 text-sm font-semibold leading-tight">
                  <IconArrowLeft className="h-5 w-5 shrink-0" />
                  <span>Back</span>
                </div>
                <div className="mt-2 truncate text-xs text-[#aab8ba]">{folderLabel}</div>
              </button>
            )}
            {visibleFolders.map((folder) => (
              <button
                key={folder.path}
                onClick={() => setCurrentFolder(folder.path)}
                className="text-left rounded-xl border border-cyan-300/20 bg-cyan-400/10 p-2.5 text-white/85 transition hover:border-cyan-200/40 hover:bg-cyan-400/15"
              >
                <div className="flex items-center gap-2 text-sm font-semibold leading-tight break-words">
                  <IconFolder className="h-5 w-5 shrink-0 text-cyan-100/70" />
                  <span>{folder.name}</span>
                </div>
                <div className="mt-2 text-xs text-cyan-100/40">Folder</div>
              </button>
            ))}
            {visibleFolders.length === 0 && visibleTracks.length === 0 && (
              <div className="rounded-xl border border-white/5 bg-[#1a2022] p-4 text-sm text-[#aab8ba]">
                No music found.
              </div>
            )}
            {visibleTracks.map((track) => {
              const selected = currentTrack?.file === track.file;
              return (
                <button
                  key={track.file}
                  onClick={() => playTrack(track)}
                  onContextMenu={(event) => copyMusicObsidianLink(event, track)}
                  title="Right-click to copy Obsidian play link"
                  className={`text-left rounded-xl border p-2.5 transition ${
                    selected
                      ? "bg-pink-500/20 border-pink-400/40 text-white"
                      : "bg-[#1a2022] border-white/5 text-white/80 hover:bg-white/10"
                  }`}
                >
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0 text-sm font-semibold leading-tight break-words">{track.title}</div>
                    {copiedTrackFile === track.file && (
                      <span className="shrink-0 rounded bg-emerald-400/15 px-1.5 py-0.5 text-xs text-emerald-200">
                        Copied
                      </span>
                    )}
                  </div>
                  {getTrackTags(track).length > 0 && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      {getTrackTags(track).map((tag) => (
                        <TagPill key={tag} tag={tag} className="break-words" />
                      ))}
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          <div className="fixed bottom-0 left-0 right-0 z-30 border-t border-white/10 bg-[#151a1c] p-3 sm:p-4">
            <div className="mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center">
              <div className="min-w-0 flex-1">
                <div className="truncate text-sm font-semibold text-white/90">
                  {currentTrack ? currentTrack.title : "No music selected"}
                </div>
                {currentTrack && (
                  <div className="relative mt-1 flex flex-wrap items-center gap-1">
                    {currentTags.map((tag) => (
                      <div key={tag} className="relative">
                        <TagPill
                          tag={tag}
                          onClick={() => setSelectedTag(selectedTag === tag ? null : tag)}
                        />
                        {selectedTag === tag && (
                          <div className="absolute bottom-full left-0 z-40 mb-2 flex gap-1 rounded-lg border border-white/10 bg-[#252e31] p-1 shadow-xl">
                            <button
                              type="button"
                              onClick={() => openTagEditor("edit", tag)}
                              className="inline-flex h-7 w-7 items-center justify-center rounded-md text-white/60 transition hover:bg-white/10 hover:text-white"
                              aria-label={`Edit ${tag}`}
                              title="Edit"
                            >
                              <IconPencil className="h-4 w-4" />
                            </button>
                            <button
                              type="button"
                              onClick={() => deleteTag(tag)}
                              className="inline-flex h-7 w-7 items-center justify-center rounded-md text-white/60 transition hover:bg-white/10 hover:text-white"
                              aria-label={`Delete ${tag}`}
                              title="Delete"
                            >
                              <IconTrash className="h-4 w-4" />
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                    <button
                      type="button"
                      onClick={() => openTagEditor("add")}
                      className="inline-flex h-5 w-5 items-center justify-center rounded bg-white/5 text-[#aab8ba] transition hover:bg-white/10 hover:text-white"
                      aria-label="Add tag"
                      title="Add tag"
                    >
                      <IconPlus className="h-3.5 w-3.5" />
                    </button>
                  </div>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-2 sm:gap-5">
                <div className="flex items-center gap-1.5">
                  <input
                    aria-label="Music volume"
                    onContextMenu={(event) => resetControl(event, "volume", volume, 0.75, setVolume)}
                    type="range"
                    min="0"
                    max="100"
                    value={Math.round(volume * 100)}
                    onChange={(e) => setVolume(Number(e.target.value) / 100)}
                    className="w-28 accent-pink-500"
                  />
                  <span className="w-10 text-right text-xs text-[#aab8ba]">{Math.round(volume * 100)}%</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <input
                    aria-label="Music tune"
                    aria-valuemin={0.25}
                    aria-valuemax={1.5}
                    aria-valuenow={tune}
                    aria-valuetext={`${tune.toFixed(2)} times`}
                    onContextMenu={(event) => resetControl(event, "tune", tune, 1, setTune)}
                    type="range"
                    min="0"
                    max={MUSIC_TUNE_STEPS.length - 1}
                    step="1"
                    value={tune < 0.275 ? 0 : Math.round(tune * 10) - 2}
                    onChange={(event) => {
                      clearInterval(controlResetTimersRef.current.tune);
                      setTune(MUSIC_TUNE_STEPS[Number(event.target.value)]);
                    }}
                    className="w-28 accent-cyan-400"
                  />
                  <span className="w-12 text-right text-xs text-[#aab8ba]">{tune.toFixed(2)}x</span>
                </div>
                <button
                  type="button"
                  aria-pressed={drunkEnabled}
                  onClick={() => setDrunkEnabled((enabled) => !enabled)}
                  onKeyDown={(event) => {
                    if (event.key === " " || event.key === "Enter") event.stopPropagation();
                  }}
                  title="Slowly wobble pitch up and down"
                  className={`inline-flex h-10 shrink-0 items-center gap-2 rounded-lg border px-3 text-xs font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300 ${
                    drunkEnabled
                      ? "border-cyan-300/40 bg-cyan-400/15 text-cyan-100 hover:bg-cyan-400/20"
                      : "border-white/10 text-white/70 hover:border-white/30 hover:text-white"
                  }`}
                >
                  Drunk <span className={drunkEnabled ? "text-cyan-200" : "text-white/60"}>{drunkEnabled ? "On" : "Off"}</span>
                </button>
                <MusicProgressWaveform
                  track={currentTrack}
                  isPlaying={isPlaying}
                  isTransitioning={isTransitioning}
                  activeAudioRef={activeAudioRef}
                  incomingAudioRef={incomingAudioRef}
                  onSeek={seekMusic}
                />
                <button
                  onClick={stopMusic}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white"
                  aria-label="Stop music"
                  title="Stop"
                >
                  <IconPlayerStop className="h-5 w-5" />
                </button>
                <button
                  onClick={pauseOrResume}
                  disabled={!currentTrack}
                  className="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 transition hover:border-white/30 hover:text-white disabled:opacity-40"
                  aria-label={isPlaying ? "Pause music" : "Play music"}
                  title={isPlaying ? "Pause" : "Play"}
                >
                  {isPlaying ? <IconPlayerPause className="h-5 w-5" /> : <IconPlayerPlay className="h-5 w-5" />}
                </button>
              </div>
            </div>
          </div>
          {tagEditor && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/45 p-4" onClick={() => setTagEditor(null)}>
              <div
                className="w-full max-w-md rounded-xl border border-white/10 bg-[#252e31] p-4 shadow-2xl"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-3 text-sm font-semibold text-white/80">{tagEditor.mode === "edit" ? "Edit tag" : "Add tag"}</div>
                <div className="relative">
                  {tagSuggestion && (
                    <div className="pointer-events-none absolute inset-0 rounded-lg border border-transparent bg-black/35 px-3 py-2 text-sm text-transparent">
                      <span>{tagEditor.value}</span>
                      <span className="text-[#aab8ba]">{tagSuggestion.slice(tagEditor.value.length)}</span>
                    </div>
                  )}
                  <input
                    autoFocus
                    value={tagEditor.value}
                    onChange={(event) => setTagEditor((prev) => ({ ...prev, value: event.target.value }))}
                    onKeyDown={(event) => {
                      if (event.key === "Tab" && tagSuggestion) {
                        event.preventDefault();
                        setTagEditor((prev) => ({ ...prev, value: tagSuggestion }));
                      }
                      if (event.key === "Enter") {
                        event.preventDefault();
                        saveTag();
                      }
                      if (event.key === "Escape") {
                        event.preventDefault();
                        setTagEditor(null);
                      }
                    }}
                    className="relative w-full rounded-lg border border-white/10 bg-transparent px-3 py-2 text-sm text-white/85 outline-none transition focus:border-pink-500"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const SfxPanel = ({ onOpenSidebar, isActive }) => {
      const sfxItems = AUDIO_MANIFEST.sfx || [];
      const volumeResetRef = useRef(null);
      const searchInputRef = useRef(null);
      const [volume, setVolume] = useState(0.8);
      const [query, setQuery] = useState("");
      const [sortMode, setSortMode] = useState("name");

      useTypeToSearch(isActive, searchInputRef, setQuery);

      useEffect(() => {
        return () => clearInterval(volumeResetRef.current);
      }, []);

      const visibleItems = useMemo(() => {
        const normalizedQuery = query.trim().toLowerCase();
        const filtered = normalizedQuery
          ? sfxItems.filter((item) => `${item.title} ${item.fileName}`.toLowerCase().includes(normalizedQuery))
          : sfxItems;
        return [...filtered].sort((a, b) => sortMode === "latest" ? (b.modifiedAt || 0) - (a.modifiedAt || 0) : a.title.localeCompare(b.title));
      }, [sfxItems, query, sortMode]);

      const playSfx = async (item) => {
        const audio = new Audio(resolveAssetUrl(item.file));
        audio.volume = volume;
        try {
          await audio.play();
        } catch (err) {}
      };

      const resetVolume = (event) => {
        event.preventDefault();
        clearInterval(volumeResetRef.current);
        volumeResetRef.current = animateNumber(volume, 0.8, setVolume);
      };

      if (!isActive) return null;

      return (
        <div className="h-[calc(100vh-1.5rem)] flex flex-col gap-3 sm:gap-4">
          <PageTopBar onOpenSidebar={onOpenSidebar}>
            <SearchInput
              value={query}
              onChange={setQuery}
              placeholder="Search SFX..."
              className="min-w-[12rem] flex-1"
              inputRef={searchInputRef}
            />
            <SortModeButton sortMode={sortMode} onToggle={() => setSortMode((prev) => (prev === "name" ? "latest" : "name"))} />
            <div className="flex items-center gap-2 rounded-lg bg-[#1a2022] border border-white/10 px-3 py-2">
              <input
                aria-label="SFX volume"
                onContextMenu={resetVolume}
                type="range"
                min="0"
                max="100"
                value={Math.round(volume * 100)}
                onChange={(e) => setVolume(Number(e.target.value) / 100)}
                className="w-32 accent-pink-500"
              />
              <span className="w-10 text-right text-xs text-[#aab8ba]">{Math.round(volume * 100)}%</span>
            </div>
          </PageTopBar>

          <div className="sfx-grid flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1">
            {visibleItems.map((item) => (
              <button
                key={item.file}
                onClick={() => playSfx(item)}
                className="aspect-square rounded-xl border border-white/5 bg-[#1a2022] p-2 text-sm font-semibold leading-tight text-white/80 transition hover:bg-white/10 hover:text-white"
              >
                <span className="line-clamp-4 break-words">{item.title}</span>
              </button>
            ))}
          </div>
        </div>
      );
    };

    const NPC_STORAGE_KEYS = {
      draft: "dm_npc_generator_draft_v1",
      locks: "dm_npc_generator_locks_v1",
      history: "dm_npc_generator_history_v1"
    };
    const NPC_FIELD_KEYS = ["factionId", "jobId", "raceId", "name", "genderId", "ageTierId", "trait-0", "trait-1", "trait-2", "appearance", "mannerism"];
    const EMPTY_NPC = { name: "", raceId: "", genderId: "", ageTierId: "", factionId: "", jobId: "", traits: ["", "", ""], appearance: "", mannerism: "" };
    const readNpcStorage = (key, fallback) => {
      try {
        const stored = JSON.parse(localStorage.getItem(key) || "null");
        return stored ?? fallback;
      } catch (error) {
        return fallback;
      }
    };
    const sanitizeNpcRecord = (value) => {
      if (!value || typeof value !== "object" || Array.isArray(value)) return { ...EMPTY_NPC };
      const safeString = (field) => typeof value[field] === "string" ? value[field].slice(0, 500) : "";
      const record = {
        name: safeString("name"),
        raceId: safeString("raceId"),
        genderId: safeString("genderId"),
        ageTierId: safeString("ageTierId"),
        factionId: safeString("factionId"),
        jobId: safeString("jobId"),
        traits: Array.isArray(value.traits) ? [0, 1, 2].map((index) => typeof value.traits[index] === "string" ? value.traits[index].slice(0, 500) : "") : ["", "", ""],
        appearance: safeString("appearance"),
        mannerism: safeString("mannerism")
      };
      if (typeof value.id === "string" && value.id) record.id = value.id.slice(0, 200);
      if (typeof value.createdAt === "string") record.createdAt = value.createdAt.slice(0, 100);
      return record;
    };
    const sanitizeNpcLocks = (value) => {
      if (!value || typeof value !== "object" || Array.isArray(value)) return {};
      return NPC_FIELD_KEYS.reduce((result, key) => ({ ...result, [key]: value[key] === true }), {});
    };
    const sanitizeNpcHistory = (value) => {
      if (!Array.isArray(value)) return [];
      return value
        .filter((entry) => entry && typeof entry === "object" && !Array.isArray(entry) && typeof entry.id === "string")
        .map(sanitizeNpcRecord)
        .slice(0, 20);
    };
    const writeNpcStorage = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Storage can be unavailable or full; the in-memory generator should keep working.
      }
    };

    const NpcSearchSelect = ({ value, options, onChange, placeholder = "Select...", ariaLabel }) => {
      const [open, setOpen] = useState(false);
      const [query, setQuery] = useState("");
      const rootRef = useRef(null);
      const inputRef = useRef(null);
      const selected = options.find((option) => option.value === value);
      const filtered = useMemo(() => {
        const normalized = query.trim().toLowerCase();
        if (!normalized) return options;
        return options.filter((option) => option.label.toLowerCase().includes(normalized));
      }, [options, query]);

      useEffect(() => {
        if (!open) return;
        const close = (event) => {
          if (rootRef.current && !rootRef.current.contains(event.target)) setOpen(false);
        };
        const escape = (event) => { if (event.key === "Escape") setOpen(false); };
        document.addEventListener("mousedown", close);
        document.addEventListener("keydown", escape);
        setTimeout(() => inputRef.current?.focus(), 0);
        return () => {
          document.removeEventListener("mousedown", close);
          document.removeEventListener("keydown", escape);
        };
      }, [open]);

      return (
        <div ref={rootRef} className="relative min-w-0 flex-1">
          <button
            type="button"
            onClick={() => { setQuery(""); setOpen((previous) => !previous); }}
            className="flex h-10 w-full items-center justify-between gap-3 rounded-lg bg-black/30 px-3 text-left text-sm text-white/85 outline-none transition hover:bg-black/40 focus-visible:ring-2 focus-visible:ring-pink-400/70"
            aria-label={ariaLabel}
            aria-haspopup="listbox"
            aria-expanded={open}
          >
            <span className={selected ? "truncate" : "truncate text-[#aab8ba]"}>{selected?.label || placeholder}</span>
            <ChevronDown className={`h-3.5 w-3.5 shrink-0 text-[#aab8ba] transition ${open ? "rotate-180" : ""}`} />
          </button>
          {open && (
            <div className="absolute left-0 right-0 top-full z-[120] mt-2 overflow-hidden rounded-xl border border-white/10 bg-[#252e31] shadow-[0_18px_45px_rgba(0,0,0,0.55)]">
              <div className="border-b border-white/10 p-2">
                <input
                  ref={inputRef}
                  value={query}
                  onChange={(event) => setQuery(event.target.value)}
                  placeholder="Filter options..."
                  className="h-9 w-full rounded-lg border border-white/10 bg-black/35 px-3 text-sm text-white/85 outline-none placeholder:text-[#aab8ba] focus:border-pink-400/60"
                />
              </div>
              <div className="max-h-64 overflow-y-auto custom-scrollbar" role="listbox">
                {filtered.length ? filtered.map((option) => (
                  <button
                    key={option.value}
                    type="button"
                    onClick={() => { onChange(option.value); setOpen(false); }}
