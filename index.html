    };

    const PortraitPanel = () => {
      const [apiKey] = useState(BACKGROUND_DEFAULT_API_KEY);
      const [selectedStyleId, setSelectedStyleId] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.styleId) || PORTRAIT_STYLES[0].id);
      const [selectedRaceId, setSelectedRaceId] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.raceId) || PORTRAIT_RACES[0].id);
      const [userPrompt, setUserPrompt] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.prompt) || "");
      const [imageUrl, setImageUrl] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [error, setError] = useState("");
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [referenceImage, setReferenceImage] = useState(null);
      const [referenceStyleImage, setReferenceStyleImage] = useState(null);
      const fileInputRef = useRef(null);
      const fileInputStyleRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.styleId, selectedStyleId);
      }, [selectedStyleId]);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.raceId, selectedRaceId);
      }, [selectedRaceId]);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.prompt, userPrompt);
      }, [userPrompt]);

      const selectedStyle = PORTRAIT_STYLES.find((style) => style.id === selectedStyleId) || PORTRAIT_STYLES[0];
      const selectedRace = PORTRAIT_RACES.find((race) => race.id === selectedRaceId) || PORTRAIT_RACES[0];
      const activeReferenceImage = referenceImage || referenceStyleImage;
      const canGenerate = apiKey.trim().length > 0 && userPrompt.trim().length > 0 && !isGenerating;

      useEffect(() => {
        if (!isGenerating) {
          setElapsedSeconds(0);
          return;
        }
        const start = Date.now();
        const id = setInterval(() => {
          setElapsedSeconds(Math.floor((Date.now() - start) / 1000));
        }, 1000);
        return () => clearInterval(id);
      }, [isGenerating]);

      const buildPrompt = () => {
        const artstylePrimer = referenceStyleImage ? REF_STYLE_ARTSTYLE_PRIMER : BACKGROUND_ARTSTYLE_PRIMER;
        const lines = [
          "Fantasy character portrait. 3:4 aspect ratio, 1536x2048, no text, no UI.",
          artstylePrimer,
          `Style: ${selectedStyle.primer}`,
          `Race: ${selectedRace.primer}`,
          `Character instructions: ${userPrompt.trim()}. Only one character should be visible, from the waist up. Focus on clear depiction of character's identity, outfit, and silhouette.`
        ];
        if (referenceImage) {
          lines.push("From reference image, extract only the character's identity, outfit, and silhouette. Do not copy artstyle or lighting.");
        }
        if (referenceStyleImage) {
          lines.push("Strongly match the ref style image for art style rendering, brushwork, texture treatment, color grading, edge softness/hardness, material painting style, and lighting mood. Use that style as highest-priority visual guidance. CONTENT FIREWALL: Do not transfer composition, objects, characters, poses, layout, or specific scene elements from the ref style image.");
          lines.push("Enforce strong style transfer from ref style image while keeping character identity, outfit, silhouette, and pose from the prompt only.");
        }
        return lines.join("\n");
      };

      const handleGenerate = async () => {
        if (!canGenerate) return;
        setIsGenerating(true);
        setError("");
        const fullPrompt = buildPrompt();
        console.log("[Portrait Generator] Prompt:\n", fullPrompt);

        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-image-preview:generateContent?key=${encodeURIComponent(apiKey.trim())}`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                {
                  role: "user",
                  parts: activeReferenceImage
                    ? [{ inlineData: { mimeType: activeReferenceImage.mimeType, data: activeReferenceImage.data } }, { text: fullPrompt }]
                    : [{ text: fullPrompt }]
                }
              ]
            })
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }

          const data = await response.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const inlinePart = parts.find((part) => part.inlineData && part.inlineData.data);

          if (!inlinePart) {
            throw new Error("No image data returned from the model.");
          }

          const mimeType = inlinePart.inlineData.mimeType || "image/png";
          const imageData = inlinePart.inlineData.data;
          const nextUrl = `data:${mimeType};base64,${imageData}`;
          setImageUrl(nextUrl);
          setTimeout(() => {
            const link = document.createElement("a");
            link.href = nextUrl;
            link.download = `portrait-${selectedRaceId || "character"}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }, 0);
        } catch (err) {
          setError(err.message || "Failed to generate image.");
        } finally {
          setIsGenerating(false);
        }
      };

      const handleReferenceUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result !== "string") {
            setError("Failed to read reference image.");
            return;
          }
          const match = result.match(/^data:(.*);base64,(.*)$/);
          if (!match) {
            setError("Unsupported reference image format.");
            return;
          }
          setReferenceStyleImage(null);
          if (fileInputStyleRef.current) {
            fileInputStyleRef.current.value = "";
          }
          setReferenceImage({ mimeType: match[1], data: match[2], name: file.name });
        };
        reader.onerror = () => {
          setError("Failed to load reference image.");
        };
        reader.readAsDataURL(file);
      };

      const handleReferenceStyleUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result !== "string") {
            setError("Failed to read style reference image.");
            return;
          }
          const match = result.match(/^data:(.*);base64,(.*)$/);
          if (!match) {
            setError("Unsupported style reference image format.");
            return;
          }
          setReferenceImage(null);
          if (fileInputRef.current) {
            fileInputRef.current.value = "";
          }
          setReferenceStyleImage({ mimeType: match[1], data: match[2], name: file.name });
        };
        reader.onerror = () => {
          setError("Failed to load style reference image.");
        };
        reader.readAsDataURL(file);
      };

      const clearReferenceImage = () => {
        setReferenceImage(null);
        if (fileInputRef.current) {
          fileInputRef.current.value = "";
        }
      };

      const clearReferenceStyleImage = () => {
        setReferenceStyleImage(null);
        if (fileInputStyleRef.current) {
          fileInputStyleRef.current.value = "";
        }
      };

      return (
        <div className="flex flex-col gap-6">
          <div className="bg-[#13131a]/90 border border-white/5 rounded-3xl p-6 panel-glow flex flex-col gap-6">
            <div className="grid grid-cols-1 lg:grid-cols-[0.5fr_1.5fr] gap-4">
              <div className="flex flex-col h-full justify-between gap-4">
                <CustomSelect
                  value={selectedStyleId}
                  onChange={setSelectedStyleId}
                  className="w-full flex-1"
                  buttonClassName="w-full bg-gradient-to-b from-[#191924] to-[#111118] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:from-[#1f1f2b] hover:to-[#14141c] transition-colors"
                  optionClassName="text-sm"
                  options={PORTRAIT_STYLES.map((style) => ({ value: style.id, label: style.label }))}
                />

                <CustomSelect
                  value={selectedRaceId}
                  onChange={setSelectedRaceId}
                  className="w-full flex-1"
                  buttonClassName="w-full bg-gradient-to-b from-[#191924] to-[#111118] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:from-[#1f1f2b] hover:to-[#14141c] transition-colors"
                  optionClassName="text-sm"
                  options={PORTRAIT_RACES.map((race) => ({ value: race.id, label: race.label }))}
                />
              </div>

              <div className="flex flex-col gap-3">
                <div className="grid grid-cols-1 lg:grid-cols-[1.3fr_0.7fr] gap-4">
                  <textarea
                    value={userPrompt}
                    onChange={(e) => setUserPrompt(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.ctrlKey && e.key === "Enter") {
                        e.preventDefault();
                        handleGenerate();
                      }
                    }}
                    placeholder="Describe the character..."
                    className="min-h-[120px] bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white/80 outline-none focus:border-pink-500 transition resize-none"
                  />

                  <div className="flex flex-col gap-3">
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className="w-full px-4 py-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs uppercase tracking-[0.3em] text-white/70 hover:text-white transition"
                      >
                        Reference
                      </button>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleReferenceUpload}
                        className="hidden"
                      />
                      <button
                        type="button"
                        onClick={() => fileInputStyleRef.current?.click()}
                        className="w-full px-4 py-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs uppercase tracking-[0.3em] text-white/70 hover:text-white transition"
                      >
                        Ref style
                      </button>
                      <input
                        ref={fileInputStyleRef}
                        type="file"
                        accept="image/*"
                        onChange={handleReferenceStyleUpload}
                        className="hidden"
                      />
                    </div>
                    {referenceImage && (
                      <div className="flex items-center gap-2 text-xs text-white/60">
                        <span className="truncate max-w-[180px]">{referenceImage.name}</span>
                        <button
                          type="button"
                          onClick={clearReferenceImage}
                          className="px-2 py-1 rounded-lg border border-white/10 text-white/50 hover:text-white hover:border-white/30 transition"
                        >
                          Clear
                        </button>
                      </div>
                    )}
                    {referenceStyleImage && (
                      <div className="flex items-center gap-2 text-xs text-white/60">
                        <span className="px-2 py-1 rounded-lg border border-cyan-300/40 bg-cyan-400/10 text-cyan-200 text-[10px] uppercase tracking-[0.2em]">Style lock on</span>
                        <span className="truncate max-w-[180px]">Ref style: {referenceStyleImage.name}</span>
                        <button
                          type="button"
                          onClick={clearReferenceStyleImage}
                          className="px-2 py-1 rounded-lg border border-white/10 text-white/50 hover:text-white hover:border-white/30 transition"
                        >
                          Clear
                        </button>
                      </div>
                    )}
                    <button
                      onClick={handleGenerate}
                      disabled={!canGenerate}
                      className={`relative w-full overflow-hidden rounded-2xl px-6 py-4 text-sm font-black tracking-[0.3em] uppercase transition-all ${
                        canGenerate ? "hover:scale-[1.02] hover:shadow-pink-500/20" : "opacity-50 cursor-not-allowed"
                      } bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white shadow-lg`}
                    >
                      {isGenerating ? "Generating..." : "Generate"}
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {error && (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-200 text-xs rounded-xl px-3 py-2">
                {error}
              </div>
            )}
          </div>

          <div className="bg-[#13131a]/90 border border-white/5 rounded-3xl p-6 panel-glow flex flex-col gap-4">
            <div className="relative w-full max-w-[50%] aspect-[3/4] rounded-2xl border border-white/10 bg-black/40 overflow-hidden">
              {imageUrl && (
                <img
                  src={imageUrl}
                  alt="Generated portrait"
                  className={`w-full h-full object-cover transition-opacity duration-700 ${isGenerating ? "opacity-0" : "opacity-100"}`}
                />
              )}
              {(!imageUrl || isGenerating) && (
                <div className={`absolute inset-0 flex flex-col items-center justify-center text-white/20 text-sm ${isGenerating ? "animate-breathe" : ""}`}>
                  <ImageIcon className="w-20 h-20 mb-3 opacity-50" />
                </div>
              )}
              {isGenerating && (
                <div className="absolute inset-x-0 bottom-4 flex items-center justify-center">
                  <div className="px-4 py-2 rounded-full bg-black/50 border border-white/10 text-xs uppercase tracking-[0.4em] text-white/70">
                    {String(Math.floor(elapsedSeconds / 60)).padStart(2, "0")}:{String(elapsedSeconds % 60).padStart(2, "0")}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const parseStoredIdList = (key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(parsed) ? parsed.filter((id) => typeof id === "string" && id.trim().length > 0) : [];
      } catch (err) {
        return [];
      }
    };

    const validateCharacterItems = (rawItems, kind) => {
      if (!Array.isArray(rawItems)) {
        throw new Error(`Invalid ${kind} JSON: expected an array.`);
      }

      const parseBonusEntry = (entry) => {
        if (entry && typeof entry === "object" && !Array.isArray(entry)) {
          const stat = typeof entry.stat === "string" ? entry.stat.trim().toUpperCase() : "";
          const value = Number(entry.value);
          if (stat && Number.isFinite(value) && value !== 0) return { stat, value };
          return null;
        }
        if (typeof entry === "string") {
          const raw = entry.trim().toUpperCase();
          const match = raw.match(/^([+-]{1,2}|[+-]?\d+)\s*([A-Z]{3,})$/);
          if (!match) return null;
          const token = match[1];
          const stat = match[2];
          let value = Number(token);
          if (!Number.isFinite(value)) {
            if (token === "+") value = 1;
            if (token === "++") value = 2;
            if (token === "-") value = -1;
            if (token === "--") value = -2;
          }
          if (!Number.isFinite(value) || value === 0) return null;
          return { stat, value };
        }
        return null;
      };

      const idSet = new Set();
      const normalized = rawItems.map((raw) => {
        const id = typeof raw?.id === "string" ? raw.id.trim() : "";
        const name = typeof raw?.name === "string" ? raw.name.trim() : "";
        const image = typeof raw?.image === "string" ? raw.image.trim() : "";
        const description = typeof raw?.description === "string" ? raw.description.trim() : "";
        const parentId = raw?.parentId === null || raw?.parentId === undefined ? null : String(raw.parentId).trim();
        const bonuses = Array.isArray(raw?.bonuses)
          ? raw.bonuses.map(parseBonusEntry).filter(Boolean)
          : [];
        const traits = Array.isArray(raw?.traits)
          ? raw.traits
              .map((trait) => (typeof trait === "string" ? trait.trim() : ""))
              .filter((trait) => trait.length > 0)
          : [];
        const dataChips = Array.isArray(raw?.dataChips)
          ? raw.dataChips
              .map((chip) => (typeof chip === "string" ? chip.trim() : ""))
              .filter((chip) => chip.length > 0)
          : [];
        const isAdditional = raw?.isAdditional === true;

        if (!id || !name || !image || !description) {
          throw new Error(`Invalid ${kind} item: required fields are id, name, image, description.`);
        }
        if (idSet.has(id)) {
          throw new Error(`Duplicate ${kind} id "${id}" in dataset.`);
        }
        idSet.add(id);

        return { id, name, image, description, parentId, bonuses, traits, dataChips, isAdditional };
      });

      const availableIds = new Set(normalized.map((item) => item.id));
      normalized.forEach((item) => {
        if (item.parentId && !availableIds.has(item.parentId)) {
          throw new Error(`Invalid ${kind} item "${item.id}": parentId "${item.parentId}" does not exist.`);
        }
      });

      return normalized;
    };

    const RACE_LOCAL_IMAGE_EXTENSIONS = ["webp", "png", "jpg", "jpeg"];

    const getCharacterImageCandidates = (item, kind) => {
      const fallback = typeof item?.image === "string" ? item.image.trim() : "";
      if (kind !== "race") return fallback ? [fallback] : [];
      const id = typeof item?.id === "string" ? item.id.trim() : "";
      if (!id) return fallback ? [fallback] : [];
      const encodedId = encodeURIComponent(id);
      const localCandidates = RACE_LOCAL_IMAGE_EXTENSIONS.map((ext) => `img/race/${encodedId}.${ext}`);
      return fallback ? [...localCandidates, fallback] : localCandidates;
    };

    const CharacterItemImage = ({ item, kind, alt, className = "", loading = undefined }) => {
      const candidates = useMemo(
        () => getCharacterImageCandidates(item, kind),
        [item?.id, item?.image, kind]
      );
      const [candidateIndex, setCandidateIndex] = useState(0);

      useEffect(() => {
        setCandidateIndex(0);
      }, [candidates.join("|")]);

      const src = candidates[candidateIndex] || "";
      const canFallback = candidateIndex < candidates.length - 1;

      return (
        <img
          src={src}
          alt={alt || item?.name || ""}
          className={className}
          loading={loading}
          onError={canFallback ? () => setCandidateIndex((prev) => prev + 1) : undefined}
        />
      );
    };

    const QuickFadeCharacterImage = ({ item, kind, className = "" }) => {
      const [currentItem, setCurrentItem] = useState(item || null);
      const [previousItem, setPreviousItem] = useState(null);
      const [showCurrent, setShowCurrent] = useState(true);
      const rafRef = useRef(null);
      const cleanupTimeoutRef = useRef(null);

      useEffect(() => {
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (cleanupTimeoutRef.current) clearTimeout(cleanupTimeoutRef.current);
        };
      }, []);

      useEffect(() => {
        const next = item || null;

        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        if (cleanupTimeoutRef.current) clearTimeout(cleanupTimeoutRef.current);

        setCurrentItem((prevCurrent) => {
          if (!next) {
            setPreviousItem(null);
            setShowCurrent(true);
            return null;
          }
          if (!prevCurrent) {
            setPreviousItem(null);
            setShowCurrent(true);
            return next;
          }
          if (prevCurrent.id === next.id) return prevCurrent;

          // Restart fade on every target update, including mid-transition changes.
          setPreviousItem(prevCurrent);
          setShowCurrent(false);
          rafRef.current = requestAnimationFrame(() => setShowCurrent(true));
          cleanupTimeoutRef.current = setTimeout(() => setPreviousItem(null), 260);
          return next;
        });
      }, [item?.id, kind]);

      return (
        <div className={`relative w-full h-full ${className}`}>
          {previousItem && (
            <CharacterItemImage
              item={previousItem}
              kind={kind}
              alt={previousItem.name}
              className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-200 ${showCurrent ? "opacity-0" : "opacity-100"}`}
              loading="lazy"
            />
          )}
          {currentItem && (
            <CharacterItemImage
              item={currentItem}
              kind={kind}
              alt={currentItem.name}
              className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-200 ${
                previousItem ? (showCurrent ? "opacity-100" : "opacity-0") : "opacity-100"
              }`}
              loading="lazy"
            />
          )}
        </div>
      );
    };

    const getBonusPrefix = (value) => {
      if (value === 1) return "+";
      if (value === 2) return "++";
      if (value === -1) return "-";
      if (value === -2) return "--";
      return value > 0 ? `+${value}` : `${value}`;
    };

    const mergeBonuses = (bonusArrays) => {
      const totals = new Map();
      bonusArrays.flat().forEach((bonus) => {
        if (!bonus || !bonus.stat || !Number.isFinite(bonus.value)) return;
        totals.set(bonus.stat, (totals.get(bonus.stat) || 0) + bonus.value);
      });
      return Array.from(totals.entries())
        .map(([stat, value]) => ({ stat, value }))
        .filter((bonus) => bonus.value !== 0)
        .sort((a, b) => b.value - a.value || a.stat.localeCompare(b.stat));
    };

    const mergeTraits = (traitArrays) => {
      const seen = new Set();
      const merged = [];
      traitArrays.flat().forEach((trait) => {
        if (!trait || typeof trait !== "string") return;
        const normalized = trait.trim();
        if (!normalized) return;
        const key = normalized.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        merged.push(normalized);
      });
      return merged;
    };

    const mergeDataChips = (chipArrays) => {
      const seen = new Set();
      const merged = [];
      chipArrays.flat().forEach((chip) => {
        if (!chip || typeof chip !== "string") return;
        const normalized = chip.trim();
        if (!normalized) return;
        const key = normalized.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        merged.push(normalized);
      });
      return merged;
    };

    const extractAgeInfoFromChips = (chips = []) => {
      const ageInfo = [];
      const remaining = [];
      chips.forEach((chip) => {
        if (!chip || typeof chip !== "string") return;
        const trimmed = chip.trim();
        if (/^"?\s*Maturity:/i.test(trimmed)) {
          const normalized = trimmed
            .replace(/^"+|"+$/g, "")
            .replace(/\s*\|\s*/g, ". ")
            .trim();
          const lifespanMatch = normalized.match(/Lifespan:\s*[^.]+/i);
          if (lifespanMatch) {
            ageInfo.push(lifespanMatch[0].trim());
          }
        } else {
          remaining.push(trimmed);
        }
      });
      return { ageInfo, remaining };
    };

    const CharacterPickerSection = ({ title, items, selectedIds, onOpenItem, onToggleItem }) => {
      const [expandedParentIds, setExpandedParentIds] = useState(() => new Set());
      const isRaceSelector = title.toLowerCase().includes("race");
      const useParentGrouping = !isRaceSelector;
      const additionalLabel = isRaceSelector ? "Additional Races" : "Additional Classes";
      const additionalPlaceholders = useMemo(
        () => Array.from({ length: 4 }, (_, idx) => ({ id: `additional-${idx}` })),
        []

      const mainItems = useMemo(() => items.filter((item) => !item.isAdditional), [items]);
      const additionalItems = useMemo(() => items.filter((item) => item.isAdditional), [items]);
      const selectableMainIds = useMemo(() => getSelectableCharacterIds(mainItems), [mainItems]);
      const childrenByParent = useMemo(() => {
        const map = new Map();
        mainItems.forEach((item) => {
          if (!item.parentId) return;
          const arr = map.get(item.parentId) || [];
          arr.push(item);
          map.set(item.parentId, arr);
        });
        map.forEach((arr) => arr.sort((a, b) => a.id.localeCompare(b.id)));
        return map;
      }, [mainItems]);
      const orderedItems = useMemo(() => {
        if (!useParentGrouping) {
          return mainItems
            .filter((item) => selectableMainIds.has(item.id))
            .sort((a, b) => a.id.localeCompare(b.id));
        }

        const baseItems = mainItems.filter((item) => !item.parentId).sort((a, b) => a.id.localeCompare(b.id));
        const ordered = [];

        baseItems.forEach((parent) => {
          ordered.push(parent);
          const variants = childrenByParent.get(parent.id) || [];
          if (variants.length > 0 && expandedParentIds.has(parent.id)) {
            ordered.push(...variants.map((variant) => ({ ...variant, _isExpandedChild: true })));
          }
        });

        const parentIds = new Set(baseItems.map((p) => p.id));
        const orphanVariants = mainItems
          .filter((item) => item.parentId && !parentIds.has(item.parentId))
          .sort((a, b) => a.id.localeCompare(b.id));
        ordered.push(...orphanVariants);
        return ordered;
      }, [mainItems, childrenByParent, expandedParentIds, useParentGrouping, selectableMainIds]);

      useEffect(() => {
        if (!useParentGrouping) {
          setExpandedParentIds(new Set());
          return;
        }
        const validParentIds = new Set(mainItems.filter((item) => !item.parentId).map((item) => item.id));
        setExpandedParentIds((prev) => {
          const next = new Set();
          prev.forEach((id) => {
            if (validParentIds.has(id)) next.add(id);
          });
          return next;
        });
      }, [mainItems, useParentGrouping]);

      const getFamilyColor = (rootId) => {
        let hash = 0;
        for (let i = 0; i < rootId.length; i++) {
          hash = ((hash << 5) - hash) + rootId.charCodeAt(i);
          hash |= 0;
        }
        const hue = Math.abs(hash) % 360;
        return {
          line: `hsla(${hue}, 72%, 62%, 0.95)`
        };
      };

      const renderCard = (item, index = 0) => {
        const selected = selectedIds.includes(item.id);

        const hasChildren = useParentGrouping && !item.parentId && (childrenByParent.get(item.id)?.length || 0) > 0;
        const isExpanded = hasChildren && expandedParentIds.has(item.id);
        const familyColor = getFamilyColor(rootId);
        const staggerDelayMs = Math.min(index, 24) * 35;

        const handleOpenOrToggle = (rect = null) => {
          if (hasChildren) {
            setExpandedParentIds((prev) => {
              const next = new Set(prev);
              if (next.has(item.id)) next.delete(item.id);
              else next.add(item.id);
              return next;
            });
            return;

            onClick={(event) => handleOpenOrToggle(event.currentTarget.getBoundingClientRect())}

          >
            <div className="relative aspect-[3/4] bg-black/40">
              {!isRaceSelector && (

              <CharacterItemImage

                } ${hasChildren ? "hidden" : ""}`}
              >
                {selected ? "Selected" : "Select"}
              </button>
              {hasChildren && (
                <div className="absolute bottom-2 right-2 w-6 h-6 rounded-full bg-black/45 border border-white/20 inline-flex items-center justify-center">
                  <ChevronDown className={`w-3 h-3 text-white/80 transition-transform ${isExpanded ? "rotate-90" : "-rotate-90"}`} />
                </div>
              )}
              <div className="absolute inset-x-0 bottom-0 p-3">
                <div className="text-sm font-semibold text-white">{item.name}</div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col gap-5">
          <div className="text-xs uppercase tracking-[0.3em] text-white/50">
            {title}
          </div>

          {orderedItems.length === 0 ? (
            <div className="text-sm text-white/40">No entries found.</div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
              {orderedItems.map((item, idx) => renderCard(item, idx))}
            </div>
          )}

          <div className="pt-2 flex flex-col gap-3">
            <div className="text-xs uppercase tracking-[0.3em] text-white/45">{additionalLabel}</div>
            {isRaceSelector && additionalItems.length > 0 ? (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
                {additionalItems
                  .slice()
                  .sort((a, b) => a.id.localeCompare(b.id))
                  .map((item, idx) => renderCard(item, orderedItems.length + idx))}
              </div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
                {additionalPlaceholders.map((box, idx) => (
                  <div
                    key={box.id}
                    className="relative aspect-[3/4] rounded-2xl border border-dashed border-white/20 bg-white/[0.02] animate-fade-in-up"
                    style={{ animationDelay: `${Math.min(orderedItems.length + idx, 24) * 35}ms` }}
                  >
                    <div className="absolute inset-0 flex items-center justify-center">
                      <span className="text-[10px] uppercase tracking-[0.25em] text-white/30">Empty</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const VerticalCompareSpinner = ({ items, onActiveChange, onPreviewIdChange }) => {
      const containerRef = useRef(null);
      const [activeIndex, setActiveIndex] = useState(0);
      const [spacerHeight, setSpacerHeight] = useState(160);
      const scrollEndTimeoutRef = useRef(null);
      const programmaticScrollTimeoutRef = useRef(null);
      const isProgrammaticScrollRef = useRef(false);
      const wheelStepTimeoutRef = useRef(null);

      const measureSpacerHeight = () => {
        const container = containerRef.current;
        if (!container) return;
        const firstCard = container.querySelector("[data-spinner-item='true']");
        if (!firstCard) return;
        const nextSpacer = Math.max(0, (container.clientHeight - firstCard.offsetHeight) / 2);
        setSpacerHeight(nextSpacer);
      };

      const snapToIndex = (index, behavior = "smooth") => {
        const container = containerRef.current;
        if (!container) return;
        const cards = Array.from(container.querySelectorAll("[data-spinner-item='true']"));
        const target = cards[index];
        if (!target) return;
        const top = target.offsetTop - (container.clientHeight - target.offsetHeight) / 2;
        isProgrammaticScrollRef.current = true;
        container.scrollTo({ top: Math.max(0, top), behavior });
        if (programmaticScrollTimeoutRef.current) clearTimeout(programmaticScrollTimeoutRef.current);
        programmaticScrollTimeoutRef.current = setTimeout(() => {
          isProgrammaticScrollRef.current = false;
        }, behavior === "smooth" ? 260 : 30);
      };

      useEffect(() => {
        return () => {
          if (scrollEndTimeoutRef.current) clearTimeout(scrollEndTimeoutRef.current);
          if (programmaticScrollTimeoutRef.current) clearTimeout(programmaticScrollTimeoutRef.current);
          if (wheelStepTimeoutRef.current) clearTimeout(wheelStepTimeoutRef.current);
        };
      }, []);

      useEffect(() => {
        setActiveIndex(0);
        if (onPreviewIdChange) onPreviewIdChange(items[0]?.id || null);
        requestAnimationFrame(() => {
          measureSpacerHeight();
          snapToIndex(0, "auto");
        });
      }, [items, onPreviewIdChange]);

      useEffect(() => {
        const onResize = () => {
          measureSpacerHeight();
          snapToIndex(activeIndex, "auto");
        };
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, [activeIndex]);

      useEffect(() => {
        if (!items.length) return;
        onActiveChange(items[activeIndex] || null);
      }, [activeIndex, items, onActiveChange]);

      const updateActiveIndex = () => {
        const container = containerRef.current;
        if (!container) return;
        if (isProgrammaticScrollRef.current) return;
        const cards = Array.from(container.querySelectorAll("[data-spinner-item='true']"));
        if (!cards.length) return;
        const centerY = container.getBoundingClientRect().top + container.clientHeight / 2;
        let nearestIndex = 0;
        let nearestDistance = Infinity;
        cards.forEach((card, index) => {
          const rect = card.getBoundingClientRect();
          const cardCenter = rect.top + rect.height / 2;
          const distance = Math.abs(cardCenter - centerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestIndex = index;
          }
        });
        if (onPreviewIdChange) onPreviewIdChange(items[nearestIndex]?.id || null);

        if (scrollEndTimeoutRef.current) clearTimeout(scrollEndTimeoutRef.current);
        scrollEndTimeoutRef.current = setTimeout(() => {
          setActiveIndex(nearestIndex);
          snapToIndex(nearestIndex, "smooth");
        }, 90);
      };

      const handleWheel = (event) => {
        event.preventDefault();
        if (!items.length) return;
        if (wheelStepTimeoutRef.current) return;

        const direction = event.deltaY > 0 ? 1 : event.deltaY < 0 ? -1 : 0;
        if (!direction) return;

        const nextIndex = Math.max(0, Math.min(items.length - 1, activeIndex + direction));
        if (nextIndex === activeIndex) return;
        setActiveIndex(nextIndex);
        if (onPreviewIdChange) onPreviewIdChange(items[nextIndex]?.id || null);
        snapToIndex(nextIndex, "smooth");

        wheelStepTimeoutRef.current = setTimeout(() => {
          wheelStepTimeoutRef.current = null;
        }, 140);
      };

      return (
        <div className="relative w-full max-w-[540px] mx-auto">
          <div
            ref={containerRef}
            onScroll={updateActiveIndex}
            onWheel={handleWheel}
            className="h-[clamp(220px,34vh,430px)] overflow-y-auto compare-scroll-hidden"
          >
            <div style={{ height: `${spacerHeight}px` }}></div>
            <div className="flex flex-col gap-2">
              {items.map((item, index) => {
                const isActive = index === activeIndex;
                const distance = Math.abs(index - activeIndex);
                const fadeDistance = 3;
                const opacity = Math.max(0, 1 - (distance / fadeDistance));
                const scale = Math.max(0.85, 1 - (distance * 0.04));
                return (
                  <button
                    key={item.id}
                    type="button"
                    tabIndex={-1}
                    data-spinner-item="true"
                    onClick={() => {
                      setActiveIndex(index);
                      if (onPreviewIdChange) onPreviewIdChange(item.id);
                      snapToIndex(index, "smooth");
                    }}
                    className="w-full h-14 px-1 text-center text-white transition-all duration-200 inline-flex items-center justify-center"
                    style={{ opacity, transform: `scale(${scale})` }}
                  >
                    <div className="inline-flex items-center gap-3">
                      <span className={`text-[20px] md:text-[28px] font-semibold leading-none tracking-[0.03em] transition-colors ${isActive ? "text-white" : "text-inherit"}`}>
                        {item.name}
                      </span>
                      {isActive && <span className="h-1.5 w-1.5 rounded-full bg-white/85"></span>}
                    </div>
                  </button>
                );
              })}
            </div>
            <div style={{ height: `${spacerHeight}px` }}></div>
          </div>
        </div>
      );
    };

    const CharacterForgePanel = ({ isVisible = false }) => {
      const isFileProtocol = window.location.protocol === "file:";
      const [activeStep, setActiveStep] = useState(() => {
        const saved = localStorage.getItem(CHARACTER_FORGE_STORAGE_KEYS.activeStep) || "races";
        return CHARACTER_FORGE_STEPS.some((step) => step.id === saved) ? saved : "races";
      });
      const [selectedRaceIds, setSelectedRaceIds] = useState(() => parseStoredIdList(CHARACTER_FORGE_STORAGE_KEYS.selectedRaceIds));
      const [selectedClassIds, setSelectedClassIds] = useState(() => parseStoredIdList(CHARACTER_FORGE_STORAGE_KEYS.selectedClassIds));
      const [races, setRaces] = useState([]);
      const [classes, setClasses] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState("");
      const [modalState, setModalState] = useState(null);
      const [activeRace, setActiveRace] = useState(null);
      const [activeClass, setActiveClass] = useState(null);
      const [previewRaceId, setPreviewRaceId] = useState(null);
      const [previewClassId, setPreviewClassId] = useState(null);
      const dataFileInputRef = useRef(null);

      const applyCharacterData = (data) => {
        if (!data || !Array.isArray(data.races) || !Array.isArray(data.classes)) {
          throw new Error("Invalid character JSON: expected { races: [], classes: [] }.");
        }
        setRaces(validateCharacterItems(data.races, "races"));
        setClasses(validateCharacterItems(data.classes, "classes"));
      };

      const loadData = async () => {
        setIsLoading(true);
        setLoadError("");
        try {
          const bundledData = window[CHARACTER_FORGE_DATA_GLOBAL_KEY];
          if (bundledData) {
            applyCharacterData(bundledData);
            return;
          }

          if (isFileProtocol) {
            throw new Error("Could not load character data script. Ensure data/wow-character-options.js exists and is linked in index.html.");
          }

          const response = await fetch(CHARACTER_FORGE_DATA_FILE);
          if (!response.ok) {
            throw new Error("Could not load character data JSON.");
          }

          const data = await response.json();
          applyCharacterData(data);
        } catch (err) {
          setLoadError(err.message || "Failed to load character data.");
        } finally {
          setIsLoading(false);
        }
      };

      const handleManualImport = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = typeof reader.result === "string" ? reader.result : "";
            const parsed = JSON.parse(text);
            applyCharacterData(parsed);
            if (dataFileInputRef.current) dataFileInputRef.current.value = "";
            setLoadError("");
          } catch (err) {
            setLoadError(err.message || "Failed to parse JSON file.");
          }
        };
        reader.onerror = () => {
          setLoadError("Failed to read JSON file.");
        };
        reader.readAsText(file);
      };

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.activeStep, activeStep);
      }, [activeStep]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedRaceIds, JSON.stringify(selectedRaceIds));
      }, [selectedRaceIds]);

      useEffect(() => {
        localStorage.setItem(CHARACTER_FORGE_STORAGE_KEYS.selectedClassIds, JSON.stringify(selectedClassIds));
      }, [selectedClassIds]);

      useEffect(() => {
        const mainEl = document.querySelector("main");
        if (!mainEl) return;
        const previousOverflow = mainEl.style.overflowY;
        if (isVisible && activeStep === "compare") {
          mainEl.style.overflowY = "hidden";
        }
        return () => {
          mainEl.style.overflowY = previousOverflow;
        };
      }, [isVisible, activeStep]);

      useEffect(() => {
        if (!races.length) return;
        const validIds = getSelectableCharacterIds(races);
        setSelectedRaceIds((prev) => prev.filter((id) => validIds.has(id)));
      }, [races]);

      useEffect(() => {
        if (!classes.length) return;
        const validIds = getSelectableCharacterIds(classes);
        setSelectedClassIds((prev) => prev.filter((id) => validIds.has(id)));
      }, [classes]);

      const selectedRaces = useMemo(() => {
        const validIds = getSelectableCharacterIds(races);
        return races.filter((item) => validIds.has(item.id) && selectedRaceIds.includes(item.id));
      }, [races, selectedRaceIds]);
      const selectedClasses = useMemo(() => {
        const validIds = getSelectableCharacterIds(classes);
        return classes.filter((item) => validIds.has(item.id) && selectedClassIds.includes(item.id));
      }, [classes, selectedClassIds]);

      const compareRace = activeRace || selectedRaces[0] || null;
      const compareClass = activeClass || selectedClasses[0] || null;
      const previewRace = selectedRaces.find((item) => item.id === previewRaceId) || null;
      const previewClass = selectedClasses.find((item) => item.id === previewClassId) || null;
      const backgroundRace = previewRace || compareRace;
      const backgroundClass = previewClass || compareClass;

      useEffect(() => {
        if (previewRaceId && !selectedRaces.some((item) => item.id === previewRaceId)) {
          setPreviewRaceId(null);
        }
      }, [selectedRaces, previewRaceId]);

      useEffect(() => {
        if (previewClassId && !selectedClasses.some((item) => item.id === previewClassId)) {
          setPreviewClassId(null);
        }
      }, [selectedClasses, previewClassId]);

      useEffect(() => {
        if (activeStep !== "compare") {
          setPreviewRaceId(null);
          setPreviewClassId(null);
        }
      }, [activeStep]);

      const toggleSelection = (kind, itemId) => {
        const sourceItems = kind === "race" ? races : classes;
        const validIds = getSelectableCharacterIds(sourceItems);
        if (!validIds.has(itemId)) return;
        const setter = kind === "race" ? setSelectedRaceIds : setSelectedClassIds;
        setter((prev) => (prev.includes(itemId) ? prev.filter((id) => id !== itemId) : [...prev, itemId]));
      };

      const openItemModal = (kind, item, rect = null) => {
        setModalState({ kind, item, rect });
      };

      const renderLoadingSkeleton = () => (
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
          {Array.from({ length: 10 }).map((_, idx) => (
            <div key={`skeleton-${idx}`} className="aspect-[3/4] rounded-2xl border border-white/10 bg-white/5 animate-pulse"></div>
          ))}
        </div>
      );

      const renderCompare = () => {
        if (!selectedRaces.length || !selectedClasses.length) {
          return (
            <div className="bg-[#13131a]/90 border border-white/5 rounded-3xl p-8 panel-glow flex flex-col gap-4">
              <div className="text-sm text-white/70">
                Select at least one race and one class to use compare mode.
              </div>
              <div className="flex flex-wrap gap-3">
                <button
                  type="button"
                  onClick={() => setActiveStep("races")}
                  className="px-4 py-2 rounded-xl border border-white/15 bg-white/5 text-xs uppercase tracking-[0.25em] hover:border-white/30 hover:bg-white/10 transition"
                >
                  Go to Races
                </button>
                <button
                  type="button"
                  onClick={() => setActiveStep("classes")}
                  className="px-4 py-2 rounded-xl border border-white/15 bg-white/5 text-xs uppercase tracking-[0.25em] hover:border-white/30 hover:bg-white/10 transition"
                >
                  Go to Classes
                </button>
              </div>
            </div>
          );
        }

        const comboName = [compareRace?.name, compareClass?.name].filter(Boolean).join(" ");
        const comboBonuses = mergeBonuses([
          compareRace?.bonuses || [],
          compareClass?.bonuses || []
        ]);
        const comboTraits = mergeTraits([
          compareRace?.traits || [],
          compareClass?.traits || []
        ]);
        const comboDataChips = mergeDataChips([
          compareRace?.dataChips || [],
          compareClass?.dataChips || []
        ]);
        const { ageInfo: comboAgeInfo, remaining: comboChips } = extractAgeInfoFromChips(comboDataChips);

        return (
          <div className="relative h-[calc(100vh-220px)] min-h-[560px] max-h-[840px]">
            <div className="relative z-10 h-full p-4 md:p-8 flex flex-col gap-4 md:gap-6">
              <div className="flex-1 min-h-0 grid place-items-start">
                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 md:gap-10 items-start max-w-7xl mx-auto w-full">
                  <VerticalCompareSpinner
                    items={selectedRaces}
                    onActiveChange={setActiveRace}
                    onPreviewIdChange={setPreviewRaceId}
                  />
                  <VerticalCompareSpinner
                    items={selectedClasses}
                    onActiveChange={setActiveClass}
                    onPreviewIdChange={setPreviewClassId}
                  />
                </div>
              </div>

              <div className="mt-auto w-full max-w-7xl mx-auto px-3 md:px-10 pb-2 md:pb-4">
                <div className="rounded-2xl bg-black/35 backdrop-blur-md p-4 md:p-6 flex flex-col gap-3">
                  <div className="text-lg md:text-2xl font-semibold text-white/95">{comboName}</div>
                  {comboBonuses.length > 0 ? (
                    <BonusChips bonuses={comboBonuses} />
                  ) : (
                    <div className="text-sm text-white/50">No bonuses defined for this combination yet.</div>
                  )}
                  {comboTraits.length > 0 && (
                    <div className="pt-1">
                      <TraitChips traits={comboTraits} />
                    </div>
                  )}
                  {comboAgeInfo.length > 0 && (
                    <div className="pt-1 text-sm text-white/75 leading-relaxed">
                      {comboAgeInfo.join(" ")}
                    </div>
                  )}
                  {comboChips.length > 0 && (
                    <div className="pt-1">
                      <TraitChips traits={comboChips} />
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const canOpenCompare = selectedRaceIds.length > 0 && selectedClassIds.length > 0;
      const isCompareActiveView = !isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "compare";

      return (
        <div className="relative flex flex-col gap-6">
          {isCompareActiveView && (
            <div className="absolute -inset-x-6 -inset-y-6 lg:-inset-x-10 lg:-inset-y-10 z-0 pointer-events-none">
              <div className="absolute inset-0">
                <div
                  className="absolute inset-y-0 left-0 w-[56%]"
                  style={{
                    WebkitMaskImage: "linear-gradient(to right, black 74%, transparent 100%)",
                    maskImage: "linear-gradient(to right, black 74%, transparent 100%)"
                  }}
                >
                  {backgroundRace && (
                    <QuickFadeCharacterImage
                      item={backgroundRace}
                      kind="race"
                      className="absolute inset-0 w-full h-full object-left contrast-[0.8] brightness-[0.72] saturate-[0.9]"
                    />
                  )}
                </div>
                <div
                  className="absolute inset-y-0 right-0 w-[56%]"
                  style={{
                    WebkitMaskImage: "linear-gradient(to left, black 74%, transparent 100%)",
                    maskImage: "linear-gradient(to left, black 74%, transparent 100%)"
                  }}
                >
                  {backgroundClass && (
                    <QuickFadeCharacterImage
                      item={backgroundClass}
                      kind="class"
                      className="absolute inset-0 w-full h-full object-right contrast-[0.8] brightness-[0.72] saturate-[0.9]"
                    />
                  )}
                </div>
              </div>
              <div className="absolute inset-0 bg-black/35"></div>
            </div>
          )}

          <div className="sticky top-0 z-20 -mx-2 px-2 py-3 mb-1 flex flex-wrap items-center justify-center gap-5">
            {CHARACTER_FORGE_STEPS.map((step) => {
              const isCompareDisabled = step.id === "compare" && !canOpenCompare;
              return (
                <button
                  key={step.id}
                  type="button"
                  disabled={isCompareDisabled}
                  onClick={() => setActiveStep(step.id)}
                  className={`px-8 py-4 rounded-2xl text-[18px] font-bold uppercase tracking-[0.2em] border backdrop-blur-xl transition-all ${
                    isCompareDisabled
                      ? "bg-black/20 text-white/20 border-transparent cursor-not-allowed"
                      : activeStep === step.id
                        ? "bg-white text-black border-white shadow-[0_0_22px_rgba(255,255,255,0.45)] scale-105"
                        : "bg-black/25 text-white/55 border-white/10 hover:bg-black/35 hover:text-white"
                  }`}
                >
                  {step.label}
                </button>
              );
            })}
          </div>

          <div className={isCompareActiveView ? "" : "bg-[#13131a]/90 border border-white/5 rounded-3xl p-6 panel-glow"}>
            <input
              ref={dataFileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleManualImport}
              className="hidden"
            />

            {isLoading && renderLoadingSkeleton()}

            {!isLoading && loadError && (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-200 rounded-2xl p-4 text-sm flex flex-col gap-3">
                <span>{loadError}</span>
                <div className="flex flex-wrap gap-2">
                  {!isFileProtocol && (
                    <button
                      type="button"
                      onClick={loadData}
                      className="px-4 py-2 rounded-xl border border-rose-300/30 bg-rose-300/10 text-[11px] uppercase tracking-[0.25em] hover:bg-rose-300/20 transition"
                    >
                      Retry
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => dataFileInputRef.current?.click()}
                    className="px-4 py-2 rounded-xl border border-white/20 bg-white/5 text-[11px] uppercase tracking-[0.25em] text-white/90 hover:border-white/40 hover:bg-white/10 transition"
                  >
                    Import Character JSON
                  </button>
                </div>
              </div>
            )}

            {!isLoading && !loadError && (races.length === 0 || classes.length === 0) && (
              <div className="bg-white/5 border border-white/10 rounded-2xl p-4 text-sm text-white/80 flex flex-col gap-3">
                <span>Import character JSON to continue.</span>
                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={() => dataFileInputRef.current?.click()}
                    className="px-4 py-2 rounded-xl border border-white/20 bg-white/5 text-[11px] uppercase tracking-[0.25em] text-white/90 hover:border-white/40 hover:bg-white/10 transition"
                  >
                    Import Character JSON
                  </button>
                </div>
              </div>
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "races" && (
              <CharacterPickerSection
                title="Choose Races"
                items={races}
                selectedIds={selectedRaceIds}
                onOpenItem={(item, rect) => openItemModal("race", item, rect)}
                onToggleItem={(itemId) => toggleSelection("race", itemId)}
              />
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "classes" && (
              <CharacterPickerSection
                title="Choose Classes"
                items={classes}
                selectedIds={selectedClassIds}
                onOpenItem={(item, rect) => openItemModal("class", item, rect)}
                onToggleItem={(itemId) => toggleSelection("class", itemId)}
              />
            )}

            {!isLoading && !loadError && races.length > 0 && classes.length > 0 && activeStep === "compare" && renderCompare()}
          </div>

          {modalState && (
            <CharacterItemModal
              item={modalState.item}
              kind={modalState.kind}
              kindLabel={modalState.kind === "race" ? "Race" : "Class"}
              selected={
                modalState.kind === "race"
                  ? selectedRaceIds.includes(modalState.item.id)
                  : selectedClassIds.includes(modalState.item.id)
              }
              originRect={modalState.rect}
              onClose={() => setModalState(null)}
              onToggle={() => {
                toggleSelection(modalState.kind, modalState.item.id);
              }}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
