    const LootRollerPanel = ({ onOpenSidebar, isActive }) => {
      const [instantRoll, setInstantRoll] = useState(() => localStorage.getItem("loot_roller_instant_roll") === "true");
      const [showSettings, setShowSettings] = useState(false);
      const [activeTab, setActiveTab] = useState("Random");
      const [activeRarity, setActiveRarity] = useState("Any");
      const [activeTheme, setActiveTheme] = useState(() => {
        const savedTheme = localStorage.getItem("loot_roller_theme") || "any";
        return LOOT_THEME_BY_ID[savedTheme] ? savedTheme : "any";
      });
      const [rollAmount, setRollAmount] = useState(1);
      const [luckAmount, setLuckAmount] = useState(() => Math.max(1, Math.min(10, parseInt(localStorage.getItem("loot_roller_luck") || "1", 10) || 1)));
      const [history, setHistory] = useState([]);
      const [expandedId, setExpandedId] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [rollingItem, setRollingItem] = useState(null);
      const [bgFlash, setBgFlash] = useState(null);
      const [allItems, setAllItems] = useState([]);
      const [isLoaded, setIsLoaded] = useState(false);
      const [loadProgress, setLoadProgress] = useState(0);
      const [error, setError] = useState(null);
      const [failedTabs, setFailedTabs] = useState([]);
      const [loadingStatusText, setLoadingStatusText] = useState("");

      const stopRollingRef = useRef(false);
      const currentIntervalRef = useRef(null);
      const flashTimeoutRef = useRef(null);
      const flashClearTimeoutRef = useRef(null);
      useEffect(() => {
        if (isActive && !isLoaded) loadData(false);
      }, [isActive]);

      const normalizeItem = (rawItem, category) => {
        const rarity = normalizeRarity(rawItem.rarity || rawItem.Rarity);
        const tags = new Set(inferLootTags(rawItem, category));
        addLootTag(tags, rarity);

        return {
          name: rawItem.name || rawItem.Name || "Unknown",
          rarity,
          description: rawItem.description || rawItem.Description || rawItem.desc || "",
          value: parseInt((rawItem.value || rawItem.Value || "0").toString().replace(/\D/g, "")) || 0,
          category,
          tags: Array.from(tags).sort(),
          id: Math.random().toString(36).substr(2, 9)
        };
      };

      const loadData = async (forceRefresh = false) => {
        setIsLoaded(false); setLoadProgress(0); setError(null); setFailedTabs([]);
        try {
          setLoadingStatusText("Loading internal tables...");
          setLoadProgress(25);
          const data = await loadInternalLootTables(forceRefresh);
          setLoadingStatusText("Processing Data...");
          setLoadProgress(70);
          processAndFinish(data);
          return;
        } catch (err) {
          setError("Could not load internal loot tables. Using Demo Data.");
        }

        finishLoad(FALLBACK_ITEMS);
      };

      const loadInternalLootTables = async (forceRefresh = false) => {
        if (window.dmDesktop?.lootTables?.get) {
          return await window.dmDesktop.lootTables.get();
        }

        const response = await fetch(resolveAssetUrl(LOOT_TABLES_PATH), {
          cache: forceRefresh ? "reload" : "default"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      };

      const processAndFinish = (data, cacheKey) => {
        const processed = [];
        const content = data.contents ? JSON.parse(data.contents) : data;
        Object.keys(content).forEach((cat) => {
          if (Array.isArray(content[cat])) {
            content[cat].forEach((item) => processed.push(normalizeItem(item, cat)));
          }
        });
        if (processed.length === 0) throw new Error("No loot items found");
        finishLoad(processed, [], cacheKey);
      };

      const finishLoad = (items, failed = [], cacheKey = null) => {
        setAllItems(items);
        setFailedTabs(failed);
        setIsLoaded(true);
        setLoadProgress(100);
        if (cacheKey) {
          localStorage.setItem(cacheKey, JSON.stringify(items));
        }
      };

      const saveSettings = (nextInstantRoll) => {
        localStorage.setItem("loot_roller_instant_roll", String(nextInstantRoll));
        setShowSettings(false);
      };

      const handleThemeChange = (nextTheme) => {
        localStorage.setItem("loot_roller_theme", nextTheme);
        setActiveTheme(nextTheme);
      };

      const getPool = () => {
        let pool = allItems;
        if (activeTab !== "Random") {
          if (activeTab === "Equipment") {
            pool = allItems.filter((item) => item.category === "Weapons" || item.category === "Armor");
          } else {
            pool = allItems.filter((item) => item.category === activeTab);
          }
        }
        if (activeRarity !== "Any") {
          const selected = normalizeRarity(activeRarity);
          pool = pool.filter((item) => normalizeRarity(item.rarity) === selected);
        }
        return pool;
      };

      const getThemeProfile = () => LOOT_THEME_BY_ID[activeTheme] || LOOT_THEME_BY_ID.any;

      const getThemeWeight = (item, profile = getThemeProfile()) => {
        if (!profile || profile.id === "any") return 1;
        const tags = new Set(item.tags || []);
        let weight = 1;

        Object.entries(profile.boost || {}).forEach(([tag, boost]) => {
          if (tags.has(normalizeLootTag(tag))) weight += boost;
        });

        Object.entries(profile.avoid || {}).forEach(([tag, multiplier]) => {
          if (tags.has(normalizeLootTag(tag))) weight *= multiplier;
        });

        return Math.max(0.05, weight);
      };

      const pickWeightedItem = (items) => {
        if (!items || items.length === 0) return null;
        const profile = getThemeProfile();
        if (profile.id === "any") return items[Math.floor(Math.random() * items.length)];

        const weightedItems = items.map((item) => ({ item, weight: getThemeWeight(item, profile) }));
        const totalWeight = weightedItems.reduce((sum, entry) => sum + entry.weight, 0);
        if (totalWeight <= 0) return items[Math.floor(Math.random() * items.length)];

        let roll = Math.random() * totalWeight;
        for (const entry of weightedItems) {
          roll -= entry.weight;
          if (roll <= 0) return entry.item;
        }
        return weightedItems[weightedItems.length - 1].item;
      };

      const pickItemFromPool = (pool) => {
        const groups = { "Artifact": [], "Legendary": [], "Very Rare": [], "Rare": [], "Uncommon": [], "Common": [] };
        pool.forEach((item) => groups[normalizeRarity(item.rarity)].push(item));
        if (activeRarity !== "Any") return pickWeightedItem(pool);

        const selectedRarity = pickRarityForLuck();
        const selectedItem = pickFromRarityWithFallback(groups, selectedRarity);
        return selectedItem || pickWeightedItem(pool);
      };

      const pickRarityForLuck = () => {
        const profile = LUCK_RARITY_PROFILES[luckAmount] || LUCK_RARITY_PROFILES[1];
        const totalWeight = RARITY_ROLL_ORDER.reduce((sum, rarity) => sum + (profile[rarity] || 0), 0);
        let roll = Math.random() * totalWeight;
        for (const rarity of RARITY_ROLL_ORDER) {
          roll -= profile[rarity] || 0;
          if (roll <= 0) return rarity;
        }
        return "Common";
      };

      const pickFromRarityWithFallback = (groups, rarity) => {
        const rarityIndex = RARITY_ROLL_ORDER.indexOf(rarity);
        if (rarityIndex === -1) return null;
        const fallbackOrder = [rarity];
        for (let distance = 1; distance < RARITY_ROLL_ORDER.length; distance++) {
          const lowerRarity = RARITY_ROLL_ORDER[rarityIndex - distance];
          const higherRarity = RARITY_ROLL_ORDER[rarityIndex + distance];
          if (lowerRarity) fallbackOrder.push(lowerRarity);
          if (higherRarity) fallbackOrder.push(higherRarity);
        }

        for (const fallbackRarity of fallbackOrder) {
          const rarityItems = groups[fallbackRarity] || [];
          if (rarityItems.length > 0) {
            return pickWeightedItem(rarityItems);
          }
        }
        return null;
      };

      const handleAmountChange = (delta) => {
        setRollAmount((prev) => Math.max(1, Math.min(10, prev + delta)));
      };

      const handleLuckChange = (delta) => {
        setLuckAmount((prev) => {
          const next = Math.max(1, Math.min(10, prev + delta));
          localStorage.setItem("loot_roller_luck", String(next));
          return next;
        });
      };

      const handleToggleExpand = (id) => {
        setExpandedId((prev) => (prev === id ? null : id));

        const flashStyle = RARITY_EDGE_FLASH_STYLES[normalizeRarity(rarity)];
        if (flashTimeoutRef.current) {
          clearTimeout(flashTimeoutRef.current);
        }
        if (flashClearTimeoutRef.current) {
          clearTimeout(flashClearTimeoutRef.current);
        }

        if (!flashStyle) {
          setBgFlash((current) => current ? { ...current, visible: false } : null);
          flashClearTimeoutRef.current = setTimeout(() => setBgFlash(null), 5500);
          return;
        }

        setBgFlash({ style: flashStyle, visible: false });
        requestAnimationFrame(() => setBgFlash({ style: flashStyle, visible: true }));
        flashTimeoutRef.current = setTimeout(() => {
          setBgFlash({ style: flashStyle, visible: false });
          flashClearTimeoutRef.current = setTimeout(() => setBgFlash(null), 5500);
        }, 220);
      };

        if (isRolling) { stopRollingRef.current = true; return; }
        const pool = getPool();
        if (pool.length === 0) return;
        setIsRolling(true); stopRollingRef.current = false; setExpandedId(null);
        for (let i = 0; i < rollAmount; i++) {

        setIsRolling(false); setRollingItem(null);

        const finalItem = pickItemFromPool(pool);
        const finalize = () => {
          if (stopRollingRef.current) { resolve(); return; }
          setRollingItem(null);
          triggerRarityFlash(finalItem.rarity);
          const item = { ...finalItem, uniqueId: Date.now() + Math.random(), timestamp: new Date().toLocaleTimeString(), isNew: true };

          setTimeout(resolve, 300);

        if (instantRoll) { finalize(); return; }

        let tick = 0;
        const totalTicks = 50;
        const runLoop = () => {
          if (stopRollingRef.current) { clearTimeout(currentIntervalRef.current); resolve(); return; }
          if (tick >= totalTicks - 2) {
            setRollingItem({ ...finalItem, temp: true, isFinalTick: true });
          } else {
            const randomVisual = pickWeightedItem(pool) || pool[Math.floor(Math.random() * pool.length)];
            setRollingItem({ ...randomVisual, temp: true, isFinalTick: false });
          }
          tick++;
          if (tick >= totalTicks) {
            setTimeout(finalize, 800);
          } else {
            const progress = tick / totalTicks;
            const delay = Math.max(30, 20 + (600 * Math.pow(progress, 4)));
            currentIntervalRef.current = setTimeout(runLoop, delay);
          }
        };
        runLoop();

    const HpTracker = () => {

        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved)) return saved;
        } catch (err) {}
        return [];
      });
      const [dragId, setDragId] = useState(null);
      const focusIdRef = useRef(null);

      useEffect(() => {
        const id = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
          } catch (err) {}
        }, 400);
        return () => clearTimeout(id);
      }, [rows]);

      const addRow = () => {
        const now = Date.now();
        const row = { id: `hp-${now}`, name: "", current: 1, max: 1 };
        setRows((prev) => [row, ...prev]);
        focusIdRef.current = row.id;
      };

      const updateRow = (id, patch) => {
        setRows((prev) =>
          prev.map((row) => {
            if (row.id !== id) return row;
            const next = { ...row, ...patch };
            const max = Number.isFinite(next.max) ? Math.max(0, next.max) : 0;
            const current = Number.isFinite(next.current) ? Math.max(0, next.current) : 0;
            next.max = max;
            next.current = Math.min(current, max);
            return next;
          })
        );
      };

      const removeRow = (id) => {
        setRows((prev) => prev.filter((row) => row.id !== id));
      };

      const handleDragStart = (id) => {
        setDragId(id);
      };

      const handleDrop = (id) => {
        if (!dragId || dragId === id) return;
        setRows((prev) => {
          const fromIndex = prev.findIndex((row) => row.id === dragId);
          const toIndex = prev.findIndex((row) => row.id === id);
          if (fromIndex === -1 || toIndex === -1) return prev;
          const next = [...prev];
          const [moved] = next.splice(fromIndex, 1);
          next.splice(toIndex, 0, moved);
          return next;
        });
        setDragId(null);
      };

      return (
        <div className="mt-auto -mx-6 px-6 text-xs max-h-[45vh] overflow-y-auto custom-scrollbar">
          <div className="flex flex-col gap-2">
            {rows.map((row) => (

    const ArcaneSurgePanel = ({ onOpenSidebar, isActive }) => {
      const [forceDesperate, setForceDesperate] = useState(false);
      const [roll, setRoll] = useState(null);
      const [phase, setPhase] = useState("idle");
      const revealTimersRef = useRef([]);
      const rollingRef = useRef(false);
      const rollIdRef = useRef(0);
      const contentRef = useRef(null);
      const isRolling = phase === "charging" || phase === "revealed";
      const showResult = roll && phase !== "charging";

      const clearRevealTimers = () => {
        revealTimersRef.current.forEach((timerId) => clearTimeout(timerId));
        revealTimersRef.current = [];
      };

      const finishReveal = () => {
        clearRevealTimers();
        rollingRef.current = false;
        setPhase("settled");
      };

      useEffect(() => {
        const handleVisibility = () => {
          if (document.hidden && rollingRef.current) finishReveal();
        };
        const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
        const handleMotionChange = () => {
          if (motionPreference.matches && rollingRef.current) finishReveal();
        };
        document.addEventListener("visibilitychange", handleVisibility);
        motionPreference.addEventListener("change", handleMotionChange);
        return () => {
          clearRevealTimers();
          document.removeEventListener("visibilitychange", handleVisibility);
          motionPreference.removeEventListener("change", handleMotionChange);
        };
      }, []);

      useEffect(() => {
        if (!isActive && rollingRef.current) finishReveal();
      }, [isActive]);

      const rollSurge = (event) => {
        // A second press reveals the pending result; it never draws a second roll.
        if (rollingRef.current) {
          finishReveal();
          return;
        }
        clearRevealTimers();
        const nextRoll = { ...rollArcaneSurge({ desperate: forceDesperate }), id: ++rollIdRef.current };
        setRoll(nextRoll);
        if (contentRef.current) contentRef.current.scrollTop = 0;

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || event.detail === 0) {
          setPhase("settled");
          return;
        }

        rollingRef.current = true;
        setPhase("charging");
        const isDesperate = nextRoll.kind === "desperate";
        revealTimersRef.current = [
          setTimeout(() => setPhase("revealed"), isDesperate ? 2800 : 2000),
          setTimeout(finishReveal, isDesperate ? 4600 : 4350)
        ];
      };

      if (!isActive) return null;

      return (
        <div className="flex min-h-0 w-full flex-col gap-3 sm:gap-4" onKeyDown={(event) => {
          if (event.key === "Escape" && rollingRef.current) {
            event.preventDefault();
            finishReveal();
          }
        }}>
          <PageTopBar onOpenSidebar={onOpenSidebar} className="w-full justify-between">
            <label className="ml-auto inline-flex h-10 items-center gap-3 rounded-lg bg-[#1a2022] px-3 text-sm text-white/70" title="Guarantee a desperate surge. Normal rolls have a 10% chance.">
              <input
                type="checkbox"
                checked={forceDesperate}
                disabled={isRolling}
                onChange={(e) => setForceDesperate(e.target.checked)}
                aria-describedby="surge-mode-help"
                className="h-4 w-4 accent-pink-500"
              />
              Desperate
            </label>
            <span id="surge-mode-help" className="sr-only">Guarantees a desperate surge. Unchecked rolls have a 10% chance of a desperate surge.</span>
          </PageTopBar>

          <div className="bg-[#1a2022] rounded-xl p-3 sm:p-4">
            <button
              type="button"
              onClick={rollSurge}
              data-desperate={isRolling ? roll?.kind === "desperate" : forceDesperate}
              className="surge-trigger block w-full rounded-lg px-4 py-5 text-base sm:text-lg font-bold btn-primary"
            >
              {isRolling ? "Reveal now" : "Arcane Surge"}
            </button>
          </div>

          <div className="surge-stage" data-kind={roll?.kind || "normal"} data-phase={phase}>
            <div ref={contentRef} className="surge-content custom-scrollbar" role="region" aria-label="Arcane surge result" aria-live="polite" aria-atomic="true" aria-busy={phase === "charging"} tabIndex={showResult ? 0 : -1}>
              {showResult && (
                <article key={roll.id} className="surge-result">
                  {roll.kind === "desperate" ? (
                    <>
                      <h2>{roll.effect.title}</h2>
                      {roll.effect.text.split("\n").map((paragraph, index) => <p key={index}>{paragraph}</p>)}
                      {roll.effect.usesSave && <p className="surge-save">Save DC: your spell save DC, or 15 if you have none.</p>}
                    </>
                  ) : <div className="surge-normal-text">{roll.effect.text}</div>}
                </article>
              )}
            </div>
            {isRolling && (
              <div key={roll.id} className={`surge-arrival surge-arrival--${roll.kind}`} aria-hidden="true">
                {roll.kind === "desperate" && <>
                  <div className="surge-fissure" />
                </>}
              </div>
            )}
          </div>
        </div>
      );
    };

      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [referenceImageSlots, setReferenceImageSlots] = useState(() => Array(4).fill(null));
      const [referenceStyleImage, setReferenceStyleImage] = useState(null);

      useEffect(() => {

      const selectedStyle = mergedStyles.find((style) => style.id === selectedStyleId) || mergedStyles[0];

        const nextOverrides = { styles: normalized };
        setStyleOverrides(nextOverrides);
        localStorage.setItem(BACKGROUND_STORAGE_KEYS.styleOverrides, JSON.stringify(nextOverrides));
        setIsEditingStyles(false);
      };

      useEffect(() => {
        if (!selectedStyle || !mergedStyles.find((s) => s.id === selectedStyleId)) {
          if (mergedStyles.length > 0) {
            setSelectedStyleId(mergedStyles[0].id);

        if (sceneContext !== "any" && !availableContexts.some((ctx) => ctx.id === sceneContext)) {

          lines.push("Separate the inputs strictly: place reference images define what kind of place this is; the ref style image defines only how the final image is painted.");

          parts.push({

      const requestGeneratedBackground = async (fullPrompt) => {

              {
                role: "user",
                parts: [...referenceParts, { text: fullPrompt }]
              }
            ],
            generationConfig: {
              temperature,
              imageConfig: {
                aspectRatio: "16:9",
                imageSize: "2K"
              }
            }
          })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const parts = data?.candidates?.[0]?.content?.parts || [];
        const inlinePart = parts.find((part) => part.inlineData && part.inlineData.data);

        if (!inlinePart) {
          throw new Error("No image data returned from the model.");
        }

        const mimeType = inlinePart.inlineData.mimeType || "image/png";
        const imageData = inlinePart.inlineData.data;
        const url = `data:${mimeType};base64,${imageData}`;

        if (window.dmDesktop?.backgroundImages?.saveGenerated) {
          try {
            await window.dmDesktop.backgroundImages.saveGenerated({
              mimeType,
              data: imageData,
              styleId: selectedStyleId || "scene"
            });
          } catch (err) {
            console.warn("[Background Generator] Failed to save generated image.", err);
          }
        }

        return { url, mimeType };
      };

      const requestGeneratedBackgroundWithRetry = async (fullPrompt, maxAttempts = 2) => {
        let lastError = null;
        for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
          try {
            return await requestGeneratedBackground(fullPrompt);
          } catch (err) {
            lastError = err;
          }
        }
        throw lastError || new Error("Failed to generate image.");
      };

      const handleGenerate = async (count = 1) => {
        if (!canGenerate) return;
        setIsGenerating(true);
        setError("");
        setGenerationTargetCount(count);
        setCompletedGenerationCount(0);
        setGeneratedImages([]);
        const fullPrompt = buildPrompt();
        const nextImages = [];

        try {
          for (let index = 0; index < count; index += 1) {
            const image = await requestGeneratedBackgroundWithRetry(fullPrompt);
            nextImages.push(image);
            setGeneratedImages([...nextImages]);
            setCompletedGenerationCount(index + 1);
          }
        } catch (err) {
          const progress = count > 1 ? ` Generated ${nextImages.length}/${count}.` : "";
          setError(`${err.message || "Failed to generate image."}${progress}`);
        } finally {
          setIsGenerating(false);
        }
      };

      const handleTransformEnvironment = async () => {
        if (!userPrompt.trim() || !transformEnvironmentTarget.trim() || isTransformingEnvironment) return;
        setError("");
        setIsTransformingEnvironment(true);
        try {
          const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey.trim()
            },
            body: JSON.stringify({
              store: false,
              contents: [
                {
                  role: "user",
                  parts: [
                    {
                      text:
                        "Rewrite the scene description so it is set in the target environment while preserving intent, subject focus, camera/composition cues, and level of detail. Output only rewritten scene text.\n\n" +
                        `Target environment: ${transformEnvironmentTarget.trim()}\n\n` +
                        `Current scene description:\n${userPrompt.trim()}`
                    }
                  ]
                }
              ]
            })
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }

          const data = await response.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const rewrittenText = parts
            .map((part) => part?.text || "")
            .join("\n")
            .trim();

          if (!rewrittenText) {
            throw new Error("No transformed text returned from the model.");
          }

          setUserPrompt(rewrittenText);
        } catch (err) {
          setError(err.message || "Failed to transform scene text.");
        } finally {
          setIsTransformingEnvironment(false);
        }
      };

      const readUploadedImage = (file, readErrorMessage, formatErrorMessage, loadErrorMessage) =>
        new Promise((resolve, reject) => {
          if (file.type && !file.type.startsWith("image/")) {
            reject(new Error(formatErrorMessage));
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            const result = reader.result;
            if (typeof result !== "string") {
              reject(new Error(readErrorMessage));
              return;
            }
            const match = result.match(/^data:(.*);base64,(.*)$/);
            if (!match) {
              reject(new Error(formatErrorMessage));
              return;
            }
            resolve({ mimeType: match[1], data: match[2], name: file.name });
          };
          reader.onerror = () => {
            reject(new Error(loadErrorMessage));
          };
          reader.readAsDataURL(file);
        });

      const getReferenceImageSrc = (image) => image ? `data:${image.mimeType};base64,${image.data}` : "";

      const replaceReferenceImageSlot = (slotIndex, image) => {
        setReferenceImageSlots((prev) => {
          const next = [...prev];
          next[slotIndex] = image;
          return next;
        });
      };

      const clearReferenceImageSlot = (slotIndex) => {

          next[slotIndex] = null;
          return next;

      const openReferenceImageSlot = (slotIndex) => {

      const handleReferenceUpload = async (event) => {

        setError("");
        try {

            file,

            "Unsupported reference image format.",
            "Failed to load reference image."

          replaceReferenceImageSlot(pendingReferenceSlotIndexRef.current, image);
        } catch (err) {
          setError(err.message || "Failed to load reference image.");
        } finally {
          input.value = "";
        }
      };

      const handleReferenceDrop = async (event, slotIndex) => {
        event.preventDefault();
        const file = event.dataTransfer?.files?.[0];

        setError("");
        try {
          const image = await readUploadedImage(
            file,
            "Failed to read reference image.",
            "Unsupported reference image format.",
            "Failed to load reference image."
          );
          replaceReferenceImageSlot(slotIndex, image);
        } catch (err) {
          setError(err.message || "Failed to load reference image.");
        }
      };

      const handleExtractReferenceDetails = async () => {
        if (!referenceImages.length || isExtractingReference) return;
        setError("");
        setIsExtractingReference(true);
        try {
          const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
          const placeReferenceParts = referenceImages.flatMap((image, index) => [
            { text: `Place reference image ${index + 1}${image.name ? ` (${image.name})` : ""}:` },
            { inlineData: { mimeType: image.mimeType, data: image.data } }
          ]);
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey.trim()
            },
            body: JSON.stringify({
              store: false,
              contents: [
                {
                  role: "user",
                  parts: [
                    ...placeReferenceParts,
                    { text: "From the place reference image or images, extract into text only the environment, the feeling, the spatial layout, materials, terrain, landmarks, props, and scene content. Do not describe art style." }
                  ]
                }
              ]
            })
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }

          const data = await response.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const extractedText = parts
            .map((part) => part?.text || "")
            .join("\n")
            .trim();

          if (!extractedText) {
            throw new Error("No extracted text returned from the model.");
          }

          setUserPrompt((prev) => {
            const base = (prev || "").trim();
            return base ? `${base}\n${extractedText}` : extractedText;
          });
        } catch (err) {
          setError(err.message || "Failed to extract reference details.");
        } finally {
          setIsExtractingReference(false);
        }
      };

                      {Array.isArray(style.contexts) && style.contexts.length > 0 && (
                        <div className="mt-3 flex flex-col gap-3">
                          {style.contexts.map((ctx, ctxIndex) => (
                            <div key={`${style.label || "style"}-${ctx.label || "context"}-${ctxIndex}`} className="bg-black/30 border border-white/5 rounded-xl p-3">
                              <div className="flex items-center justify-between mb-2">
                                <div className="text-xs uppercase tracking-wide text-[#aab8ba]">{ctx.label || "Context"}</div>
                                <button
                                  type="button"
                                  onClick={() => {
                                    if (!window.confirm(`Remove context "${ctx.label || "Untitled"}"?`)) return;
                                    const next = [...editDraft];
                                    const nextContexts = [...next[styleIndex].contexts];
                                    nextContexts.splice(ctxIndex, 1);
                                    next[styleIndex] = { ...next[styleIndex], contexts: nextContexts };
                                    setEditDraft(next);
                                  }}
                                  className="text-xs uppercase tracking-wide text-rose-300/70 hover:text-rose-200 transition"
                                >
                                  Remove
                                </button>
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-[1fr] gap-3 mb-2">
                                <input
                                  value={ctx.label}
                                  onChange={(e) => {
                                    const next = [...editDraft];
                                    const nextContexts = [...next[styleIndex].contexts];
                                    nextContexts[ctxIndex] = { ...nextContexts[ctxIndex], label: e.target.value };
                                    next[styleIndex] = { ...next[styleIndex], contexts: nextContexts };
                                    setEditDraft(next);
                                  }}
                                  className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white/80 outline-none focus:border-pink-500 transition"
                                  placeholder="Context label"
                                />
                              </div>
                              <textarea
                                value={ctx.primer}
                                onChange={(e) => {
                                  const next = [...editDraft];
                                  const nextContexts = [...next[styleIndex].contexts];
                                  nextContexts[ctxIndex] = { ...nextContexts[ctxIndex], primer: e.target.value };
                                  next[styleIndex] = { ...next[styleIndex], contexts: nextContexts };
                                  setEditDraft(next);
                                }}
                                className="w-full min-h-[60px] bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white/80 outline-none focus:border-pink-500 transition resize-y"
                                placeholder="Context primer..."
                              />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                <div className="flex items-center justify-end gap-3">
                  <button
                    type="button"

                    className="px-4 py-2 rounded-xl border border-white/10 text-xs uppercase tracking-wide text-[#aab8ba] hover:text-white hover:border-white/30 transition"
                  >

                  <button

                    className="px-5 py-2 rounded-xl btn-primary text-white text-xs uppercase tracking-wide shadow-lg"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}
          <div className="bg-[#1a2022] border border-white/5 rounded-3xl p-5 sm:p-6 panel-glow flex flex-col gap-5">
            <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_21rem] gap-5 items-start">
              <div className="flex flex-col gap-4 min-w-0">
                <div className="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] gap-3 items-end">
                  <div className="flex flex-col gap-2 min-w-0">

                    <CustomSelect
                      value={selectedStyleId}
                      onChange={setSelectedStyleId}

                      buttonClassName="w-full bg-[#252e31] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:bg-[#303d40] transition-colors"
                      optionClassName="text-sm"
                      options={mergedStyles.map((style) => ({ value: style.id, label: style.label }))}
                    />
                  </div>
                  <div className="flex flex-col gap-2 min-w-0">
                    <div className="text-xs uppercase tracking-wide text-[#aab8ba]">Context</div>
                    <CustomSelect
                      value={sceneContext}

                      className="w-full"
                      buttonClassName="w-full bg-[#252e31] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:bg-[#303d40] transition-colors"
                      optionClassName="text-sm"
                      options={[

                }`}>
                  <span className="min-w-0">

                    </span>

                <textarea

                  onKeyDown={(e) => {

                  </div>

                  <div className="flex flex-col gap-2">
                    <div className="text-xs uppercase tracking-wide text-[#aab8ba]">Art style</div>
                    <div
                      role="button"
                      tabIndex={0}
                      onClick={() => fileInputStyleRef.current?.click()}
                      onKeyDown={(event) => {
                        if (event.key === "Enter" || event.key === " ") {
                          event.preventDefault();
                          fileInputStyleRef.current?.click();
                        }
                      }}
                      onDragOver={(event) => event.preventDefault()}
                      onDrop={handleReferenceStyleDrop}
                      className={`group relative aspect-[16/7] overflow-hidden rounded-xl border transition cursor-pointer ${
                        referenceStyleImage
                          ? "border-cyan-300/35 bg-black/30 hover:border-cyan-200/70"
                          : "border-dashed border-cyan-300/20 bg-cyan-400/[0.04] hover:border-cyan-300/45 hover:bg-cyan-400/[0.07]"
                      }`}
                      aria-label="Art style reference slot"
                    >
                      {referenceStyleImage ? (
                        <>
                          <img
                            src={getReferenceImageSrc(referenceStyleImage)}
                            alt="Art style reference"
                            className="absolute inset-0 h-full w-full object-cover"
                          />
                          <div className="status-label absolute left-2 top-2 rounded-lg bg-black/65 px-2 py-1 text-xs uppercase tracking-wide text-cyan-100">
                            Style lock
                          </div>
                          <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-2">
                            <div className="truncate text-xs text-white/80">{referenceStyleImage.name}</div>
                          </div>
                          <button
                            type="button"
                            onClick={(event) => {
                              event.stopPropagation();
                              clearReferenceStyleImage();
                            }}
                            className="absolute right-1.5 top-1.5 rounded-lg border border-black/40 bg-black/60 p-1 text-white/70 opacity-0 transition hover:text-white group-hover:opacity-100"
                            aria-label="Clear art style reference"
                          >
                            <X className="h-3.5 w-3.5" />
                          </button>
                        </>
                      ) : (
                        <div className="absolute inset-0 flex flex-col items-center justify-center gap-1 text-cyan-100/45">
                          <ImageIcon className="h-5 w-5" />
                          <span className="text-xs uppercase tracking-wide">Style slot</span>
                        </div>
                      )}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={handleExtractReferenceDetails}
                    disabled={!referenceImages.length || isExtractingReference || isGenerating}
                    className={`w-full min-h-[42px] px-4 rounded-xl border text-xs uppercase tracking-wide transition ${
                      !referenceImages.length || isExtractingReference || isGenerating
                        ? "border-white/10 bg-white/5 text-[#aab8ba] cursor-not-allowed"
                        : "border-cyan-400/30 bg-cyan-500/10 text-cyan-200 hover:bg-cyan-500/20 hover:border-cyan-300/40"
                    }`}
                  >
                    {isExtractingReference ? "Extracting..." : "Extract ref"}
                  </button>
                </div>

                <div className="flex flex-col gap-3 border-t border-white/10 pt-4">
                  <div className="flex flex-col gap-2">
                    <div className="flex items-center justify-between text-xs text-white/60">
                      <span className="uppercase tracking-wide">Temperature</span>
                      <span className="font-mono text-white/80">{temperature.toFixed(2)}</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="2"
                      step="0.05"
                      value={temperature}
                      onChange={(event) => setTemperature(Number(event.target.value))}
                      disabled={isGenerating}
                      className="w-full accent-pink-500"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-1 gap-3">
                    <button
                      onClick={() => handleGenerate(1)}
                      disabled={!canGenerate}
                      className={`relative w-full min-h-[52px] overflow-hidden rounded-xl px-5 text-sm font-semibold tracking-wide uppercase transition-all ${
                        canGenerate ? "hover:scale-[1.01] hover:shadow-pink-500/20" : "opacity-50 cursor-not-allowed"
                      } btn-primary text-white shadow-lg`}
                    >
                      {isGenerating ? `Generating ${completedGenerationCount}/${generationTargetCount}` : "Generate"}
                    </button>
                    <button
                      type="button"
                      onClick={() => handleGenerate(4)}
                      disabled={!canGenerate}
                      className={`w-full min-h-[44px] px-5 rounded-xl border text-xs uppercase tracking-wide transition ${
                        canGenerate
                          ? "border-pink-400/30 bg-pink-500/10 text-pink-100 hover:bg-[#263e39] hover:border-pink-300/40"
                          : "border-white/10 bg-white/5 text-[#aab8ba] cursor-not-allowed"
                      }`}
                    >
                      Generate 4
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {error && (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-200 text-xs rounded-xl px-3 py-2">
                {error}
              </div>
            )}

          </div>

          <div className="bg-[#1a2022] border border-white/5 rounded-3xl p-6 panel-glow flex flex-col gap-4">
            <div className={`relative w-full ${generatedImages.length >= 4 ? "grid grid-cols-2 gap-3" : "aspect-[16/9]"} rounded-2xl border border-white/10 bg-black/40 overflow-hidden p-0`}>
              {generatedImages.length > 0 && generatedImages.length < 4 && (
                <img
                  src={generatedImages[0].url}
                  alt="Generated background"
                  className={`w-full h-full object-cover transition-opacity duration-700 ${isGenerating ? "opacity-0" : "opacity-100"}`}
                />
              )}
              {generatedImages.length >= 4 && generatedImages.slice(0, 4).map((image, index) => (
                <div key={`${image.mimeType}-${index}`} className="relative aspect-[16/9] border border-white/10 bg-black/30 overflow-hidden">
                  <img
                    src={image.url}
                    alt={`Generated background ${index + 1}`}
                    className="w-full h-full object-cover"
                  />
                </div>
              ))}
              {(!generatedImages.length || isGenerating) && (
                <div className={`absolute inset-0 flex flex-col items-center justify-center text-[#aab8ba] text-sm ${isGenerating ? "animate-breathe" : ""}`}>
                  <ImageIcon className="w-20 h-20 mb-3 opacity-50" />
                </div>
              )}
              {isGenerating && (
                <div className="absolute inset-x-0 bottom-4 flex items-center justify-center">
                  <div className="px-4 py-2 rounded-full bg-black/50 border border-white/10 text-xs uppercase tracking-[0.4em] text-white/70">
                    {String(Math.floor(elapsedSeconds / 60)).padStart(2, "0")}:{String(elapsedSeconds % 60).padStart(2, "0")}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const PortraitPanel = ({ apiKey, onOpenSidebar, isActive }) => {
      const [selectedStyleId, setSelectedStyleId] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.styleId) || PORTRAIT_STYLES[0].id);
      const [selectedRaceId, setSelectedRaceId] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.raceId) || PORTRAIT_RACES[0].id);
      const [userPrompt, setUserPrompt] = useState(() => localStorage.getItem(PORTRAIT_STORAGE_KEYS.prompt) || "");
      const [imageUrl, setImageUrl] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [error, setError] = useState("");
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [referenceImage, setReferenceImage] = useState(null);
      const [referenceStyleImage, setReferenceStyleImage] = useState(null);
      const fileInputRef = useRef(null);
      const fileInputStyleRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.styleId, selectedStyleId);
      }, [selectedStyleId]);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.raceId, selectedRaceId);
      }, [selectedRaceId]);

      useEffect(() => {
        localStorage.setItem(PORTRAIT_STORAGE_KEYS.prompt, userPrompt);
      }, [userPrompt]);

      const selectedStyle = PORTRAIT_STYLES.find((style) => style.id === selectedStyleId) || PORTRAIT_STYLES[0];
      const selectedRace = PORTRAIT_RACES.find((race) => race.id === selectedRaceId) || PORTRAIT_RACES[0];
      const activeReferenceImage = referenceImage || referenceStyleImage;
      const canGenerate = apiKey.trim().length > 0 && userPrompt.trim().length > 0 && !isGenerating;

      useEffect(() => {
        if (!isGenerating) {
          setElapsedSeconds(0);
          return;
        }
        const start = Date.now();
        const id = setInterval(() => {
          setElapsedSeconds(Math.floor((Date.now() - start) / 1000));
        }, 1000);
        return () => clearInterval(id);
      }, [isGenerating]);

      const buildPrompt = () => {
        const artstylePrimer = referenceStyleImage ? REF_STYLE_ARTSTYLE_PRIMER : BACKGROUND_ARTSTYLE_PRIMER;
        const lines = [
          "Fantasy character portrait. 3:4 aspect ratio, 1536x2048, no text, no UI.",
          artstylePrimer,
          `Style: ${selectedStyle.primer}`,
          `Race: ${selectedRace.primer}`,
          `Character instructions: ${userPrompt.trim()}. Only one character should be visible, from the waist up. Focus on clear depiction of character's identity, outfit, and silhouette.`
        ];
        if (referenceImage) {
          lines.push("From reference image, extract only the character's identity, outfit, and silhouette. Do not copy artstyle or lighting.");
        }
        if (referenceStyleImage) {
          lines.push("Strongly match the ref style image for art style rendering, brushwork, texture treatment, color grading, edge softness/hardness, material painting style, and lighting mood. Use that style as highest-priority visual guidance. CONTENT FIREWALL: Do not transfer composition, objects, characters, poses, layout, or specific scene elements from the ref style image.");
          lines.push("Enforce strong style transfer from ref style image while keeping character identity, outfit, silhouette, and pose from the prompt only.");
        }
        return lines.join("\n");
      };

      const handleGenerate = async () => {
        if (!canGenerate) return;
        setIsGenerating(true);
        setError("");
        const fullPrompt = buildPrompt();

        try {
          const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-image-preview:generateContent";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey.trim()
            },
            body: JSON.stringify({
              store: false,
              contents: [
                {
                  role: "user",
                  parts: activeReferenceImage
                    ? [{ inlineData: { mimeType: activeReferenceImage.mimeType, data: activeReferenceImage.data } }, { text: fullPrompt }]
                    : [{ text: fullPrompt }]
                }
              ]
            })
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }

          const data = await response.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const inlinePart = parts.find((part) => part.inlineData && part.inlineData.data);

          if (!inlinePart) {
            throw new Error("No image data returned from the model.");
          }

          const mimeType = inlinePart.inlineData.mimeType || "image/png";
          const imageData = inlinePart.inlineData.data;
          const nextUrl = `data:${mimeType};base64,${imageData}`;
          setImageUrl(nextUrl);
          setTimeout(() => {
            const link = document.createElement("a");
            link.href = nextUrl;
            link.download = `portrait-${selectedRaceId || "character"}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }, 0);
        } catch (err) {
          setError(err.message || "Failed to generate image.");
        } finally {
          setIsGenerating(false);
        }
      };

      const handleReferenceUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result !== "string") {
            setError("Failed to read reference image.");
            return;
          }
          const match = result.match(/^data:(.*);base64,(.*)$/);
          if (!match) {
            setError("Unsupported reference image format.");
            return;
          }
          setReferenceStyleImage(null);
          if (fileInputStyleRef.current) {
            fileInputStyleRef.current.value = "";
          }
          setReferenceImage({ mimeType: match[1], data: match[2], name: file.name });
        };
        reader.onerror = () => {
          setError("Failed to load reference image.");
        };
        reader.readAsDataURL(file);
      };

      const handleReferenceStyleUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result !== "string") {
            setError("Failed to read style reference image.");
            return;
          }
          const match = result.match(/^data:(.*);base64,(.*)$/);
          if (!match) {
            setError("Unsupported style reference image format.");
            return;
          }
          setReferenceImage(null);
          if (fileInputRef.current) {
            fileInputRef.current.value = "";
          }
          setReferenceStyleImage({ mimeType: match[1], data: match[2], name: file.name });
        };
        reader.onerror = () => {
          setError("Failed to load style reference image.");
        };
        reader.readAsDataURL(file);
      };

      const clearReferenceImage = () => {
        setReferenceImage(null);
        if (fileInputRef.current) {
          fileInputRef.current.value = "";
        }
      };

      const clearReferenceStyleImage = () => {
        setReferenceStyleImage(null);
        if (fileInputStyleRef.current) {
          fileInputStyleRef.current.value = "";
        }
      };

      if (!isActive) return null;

      return (
        <div className="flex flex-col gap-6">
          <PageTopBar onOpenSidebar={onOpenSidebar} />
          <div className="bg-[#1a2022] border border-white/5 rounded-3xl p-6 panel-glow flex flex-col gap-6">
            <div className="grid grid-cols-1 lg:grid-cols-[0.5fr_1.5fr] gap-4">
              <div className="flex flex-col h-full justify-between gap-4">
                <CustomSelect
                  value={selectedStyleId}
                  onChange={setSelectedStyleId}
                  className="w-full flex-1"
                  buttonClassName="w-full bg-[#252e31] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:bg-[#303d40] transition-colors"
                  optionClassName="text-sm"
                  options={PORTRAIT_STYLES.map((style) => ({ value: style.id, label: style.label }))}
                />

                <CustomSelect
                  value={selectedRaceId}
                  onChange={setSelectedRaceId}
                  className="w-full flex-1"
                  buttonClassName="w-full bg-[#252e31] border border-white/10 rounded-xl px-3 py-3 text-sm text-white/90 outline-none focus:border-pink-500/70 focus:ring-2 focus:ring-pink-500/20 shadow-[0_8px_24px_rgba(0,0,0,0.35)] hover:border-white/20 hover:bg-[#303d40] transition-colors"
                  optionClassName="text-sm"
                  options={PORTRAIT_RACES.map((race) => ({ value: race.id, label: race.label }))}
                />
              </div>

              <div className="flex flex-col gap-3">
                <div className="grid grid-cols-1 lg:grid-cols-[1.3fr_0.7fr] gap-4">
                  <textarea
                    value={userPrompt}
                    onChange={(e) => setUserPrompt(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.ctrlKey && e.key === "Enter") {
                        e.preventDefault();
                        handleGenerate();
                      }
                    }}
                    placeholder="Describe the character..."
                    className="min-h-[120px] bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white/80 outline-none focus:border-pink-500 transition resize-none"
                  />

                  <div className="flex flex-col gap-3">
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className="w-full px-4 py-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs uppercase tracking-wide text-white/70 hover:text-white transition"
                      >
                        Reference
                      </button>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleReferenceUpload}
                        className="hidden"
                      />
                      <button
                        type="button"
                        onClick={() => fileInputStyleRef.current?.click()}
                        className="w-full px-4 py-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs uppercase tracking-wide text-white/70 hover:text-white transition"
                      >
                        Ref style
                      </button>
                      <input
                        ref={fileInputStyleRef}
                        type="file"
                        accept="image/*"
                        onChange={handleReferenceStyleUpload}
                        className="hidden"
                      />
                    </div>
                    {referenceImage && (
                      <div className="flex items-center gap-2 text-xs text-white/60">
                        <span className="truncate max-w-[180px]">{referenceImage.name}</span>
                        <button
                          type="button"
                          onClick={clearReferenceImage}
                          className="px-2 py-1 rounded-lg border border-white/10 text-[#aab8ba] hover:text-white hover:border-white/30 transition"
                        >
                          Clear
                        </button>
                      </div>
                    )}
                    {referenceStyleImage && (
                      <div className="flex items-center gap-2 text-xs text-white/60">
                        <span className="status-label px-2 py-1 rounded-lg border border-cyan-300/40 bg-cyan-400/10 text-cyan-200 text-xs uppercase tracking-wide">Style lock on</span>
                        <span className="truncate max-w-[180px]">Ref style: {referenceStyleImage.name}</span>
                        <button
                          type="button"
                          onClick={clearReferenceStyleImage}
                          className="px-2 py-1 rounded-lg border border-white/10 text-[#aab8ba] hover:text-white hover:border-white/30 transition"
                        >
                          Clear
                        </button>
                      </div>
                    )}
                    <button
                      onClick={handleGenerate}
                      disabled={!canGenerate}
                      className={`relative w-full overflow-hidden rounded-2xl px-6 py-4 text-sm font-semibold tracking-wide uppercase transition-all ${
                        canGenerate ? "hover:scale-[1.02] hover:shadow-pink-500/20" : "opacity-50 cursor-not-allowed"
                      } btn-primary text-white shadow-lg`}
                    >
                      {isGenerating ? "Generating..." : "Generate"}
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {error && (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-200 text-xs rounded-xl px-3 py-2">
                {error}
              </div>
            )}
          </div>

          <div className="bg-[#1a2022] border border-white/5 rounded-3xl p-6 panel-glow flex flex-col gap-4">
            <div className="relative w-full max-w-[50%] aspect-[3/4] rounded-2xl border border-white/10 bg-black/40 overflow-hidden">
              {imageUrl && (
                <img
                  src={imageUrl}
                  alt="Generated portrait"
                  className={`w-full h-full object-cover transition-opacity duration-700 ${isGenerating ? "opacity-0" : "opacity-100"}`}
                />
              )}
              {(!imageUrl || isGenerating) && (
                <div className={`absolute inset-0 flex flex-col items-center justify-center text-[#aab8ba] text-sm ${isGenerating ? "animate-breathe" : ""}`}>
                  <ImageIcon className="w-20 h-20 mb-3 opacity-50" />
                </div>
              )}
              {isGenerating && (
                <div className="absolute inset-x-0 bottom-4 flex items-center justify-center">
                  <div className="px-4 py-2 rounded-full bg-black/50 border border-white/10 text-xs uppercase tracking-[0.4em] text-white/70">
                    {String(Math.floor(elapsedSeconds / 60)).padStart(2, "0")}:{String(elapsedSeconds % 60).padStart(2, "0")}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
